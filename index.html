/* Ajuste unificado de proporção da República, Governo Estadual e Prefeitura */
.content{max-width:1600px;width:100%}
.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid{grid-template-columns:minmax(0,1.45fr) minmax(300px,.85fr)}
.embedded-app-toolbar{height:58px;display:flex;align-items:center;gap:11px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:2}
.embedded-app-toolbar>div{min-width:0;display:flex;flex-direction:column;gap:2px}.embedded-app-toolbar b{color:var(--navy);font-size:14px}.embedded-app-toolbar small{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.embedded-app-toolbar small[data-ok="1"]{color:#2E7D55;font-weight:800}
.embedded-app-frame-wrap{width:100%;height:calc(100dvh - 58px);overflow:hidden;background:#EEF3F7}
.embedded-app-frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:#EEF3F7}
body.embedded-app-view{overflow:hidden}
body.embedded-app-view .shell{grid-template-columns:1fr;height:100dvh;min-height:0}
body.embedded-app-view .side,body.embedded-app-view .top,body.embedded-app-view .mobile{display:none!important}
body.embedded-app-view main{height:100dvh;min-height:0}
body.embedded-app-view .content{max-width:none;height:100dvh;padding:0;margin:0}
body.embedded-app-view .municipal-app-panel{border:0;border-radius:0;box-shadow:none}
html[data-theme="dark"] .embedded-app-toolbar{background:#182838}
@media(max-width:900px){
  .content{max-width:none}
  .grid{grid-template-columns:1fr}
  .embedded-app-toolbar{height:54px;padding:6px 8px}
  .embedded-app-frame-wrap{height:calc(100dvh - 54px)}
  .embedded-back{padding:8px 10px;min-height:38px}
  .municipal-open-full{display:none}
}
@media(min-width:901px) and (max-width:1180px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .side{padding-left:9px;padding-right:9px}
  .content{padding:20px}
}
.profile-photo-picker{position:relative;display:grid;justify-items:center;gap:4px;cursor:pointer;flex:0 0 auto;font-size:11px;font-weight:800;color:var(--navy)}.profile-photo-picker .avatar{outline:2px solid var(--gold);outline-offset:3px}.profile-photo-picker input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.photo-feedback{font-size:12px;color:var(--muted)}
.sync-badge{font-size:11px;font-weight:800;color:var(--navy);background:#EDF5FC;border-radius:10px;padding:8px 10px;margin-bottom:12px}html[data-theme="dark"] .sync-badge{background:#193047;color:#E6EEF6}

async function processPhoto(file){if(!file)return;if(!file.type.startsWith('image/')){alert('Escolha um arquivo de imagem.');return}if(file.size>10*1024*1024){alert('A foto deve ter até 10 MB.');return}photoBusy=true;const status=$('photoFeedback');if(status)status.textContent='Preparando foto…';let url='';try{url=URL.createObjectURL(file);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=256;canvas.height=256;const size=Math.min(img.naturalWidth,img.naturalHeight),x=(img.naturalWidth-size)/2,y=(img.naturalHeight-size)/2;ctx.drawImage(img,x,y,size,size,0,0,256,256);photoDraft=canvas.toDataURL('image/jpeg',.78);const preview=$('content')?.querySelector('.profile-photo-picker .avatar');if(preview)preview.outerHTML=avatar({...current(),photo:photoDraft},'large');if(status)status.textContent='✓ Foto pronta. Toque em Salvar perfil para confirmar.'}catch{if(status)status.textContent='Não foi possível abrir essa imagem.';alert('Não foi possível abrir a foto.')}finally{photoBusy=false;if(url)URL.revokeObjectURL(url);const input=$('photoInput');if(input)input.value=''}}
function municipalProfilePayload(){

function connectFederatedFrame(frameId,statusId,payload,successLabel='Perfil conectado.'){
  const frame=$(frameId),status=$(statusId),p=payload;
  if(!frame||!p)return;
  const requestId='federation-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  let handoffSent=false,finished=false;
  const setStatus=(text,ok=false)=>{if(status){status.textContent=text;status.dataset.ok=ok?'1':'0'}};
  const target=/^https?:$/.test(location.protocol)?location.origin:'*';
  const onMessage=e=>{
    const msg=e.data;
    if(e.source!==frame.contentWindow||!msg||msg.protocol!==FEDERATION_PROTOCOL||msg.requestId!==requestId)return;
    if(msg.type==='MUNICIPAL_SYSTEM_DESCRIPTOR'&&!handoffSent){
      handoffSent=true;setStatus('Conectando seu perfil…');
      frame.contentWindow.postMessage({protocol:FEDERATION_PROTOCOL,type:'HANDOFF_PROFILE',requestId,payload:p},target);
      return
    }
    if(msg.type==='HANDOFF_RESULT'){
      finished=true;
      if(msg.payload?.ok)setStatus(msg.payload.requiresPassword?'Perfil sincronizado. Confirme a senha para continuar.':successLabel,true);
      else setStatus(msg.payload?.reason||'Não foi possível conectar este perfil.');
      setTimeout(()=>window.removeEventListener('message',onMessage),3500)
    }
  };
  window.addEventListener('message',onMessage);
  const discover=()=>{if(!finished){try{frame.contentWindow?.postMessage({protocol:FEDERATION_PROTOCOL,type:'DISCOVER_MUNICIPAL_SYSTEM',requestId},target)}catch{}}};
  frame.addEventListener('load',()=>setTimeout(discover,120),{once:true});
  setTimeout(discover,320);
  setTimeout(()=>{if(!finished&&!handoffSent)setStatus('O módulo abriu, mas a integração automática ainda está conectando…')},3200)
}

function adminmunicipio(){const level=scope(current()),national=level==='nacional',allowedStates=data.estados.filter(canState),items=data.municipios.filter(canCity),edit=items.find(x=>x.id===editCityId),canCreate=level!=='municipal'&&!data.municipios.length;return heading('Municípios',level==='municipal'?'Edite os dados do seu município.':'Bom Regresso é o único município do país.')+(canCreate?`<section class="panel"><h2>Novo município</h2><form id="municipioForm" class="form"><label class="field">Município<input name="nome" value="Bom Regresso" readonly></label><label class="field">Estado<select name="estado" required><option value="">Selecione</option>${allowedStates.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label class="field">Prefeito(a)<input name="prefeito" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="0" required></label><div class="field wide"><button class="btn" ${!allowedStates.length?'disabled':''}>Adicionar município</button></div></form>${!allowedStates.length?'<p class="note">É preciso cadastrar ou vincular um estado antes de adicionar municípios.</p>':''}</section>`:'')+(edit?`<section class="panel" style="margin-top:14px"><h2>Editar ${esc(edit.nome)}</h2><form id="cityEditForm" class="form"><input type="hidden" name="id" value="${edit.id}"><label class="field">Município<input name="nome" value="Bom Regresso" readonly></label>${national?`<label class="field">Estado<select name="estado" required>${data.estados.map(state=>`<option value="${state.id}" ${state.id===edit.estado?'selected':''}>${esc(state.nome)}</option>`).join('')}</select></label>`:`<label class="field">Estado<input value="${esc(data.estados.find(state=>state.id===edit.estado)?.nome||'—')}" readonly></label>`}<label class="field">Prefeito(a)<input name="prefeito" value="${esc(edit.prefeito||'')}" maxlength="80"></label><label class="field">População fictícia<input name= function municipios(){
  const level=scope(current());
  if(level==='estadual')return adminmunicipio();
  const city=municipalTargetCity();
  if(!city){
    if(level==='nacional')return heading('Municípios','O sistema municipal será exibido aqui depois que Bom Regresso for cadastrado.')+`<section class="panel municipal-empty"><h2>🏘️ Bom Regresso ainda não foi cadastrado</h2><p class="muted">Cadastre o município uma única vez. Depois disso, esta aba passa a abrir diretamente o aplicativo completo da Prefeitura.</p><button class="btn" data-page="adminmunicipio">Cadastrar Bom Regresso</button></section>`;
    return heading('Município','Este perfil ainda não está vinculado ao município de Bom Regresso.')
  }
  return prefeitura()
}

function cofre(){return heading('Cofre público','Registre receitas, gastos e repasses de verba.')+`<div class="cards">${card('Saldo atual',money(balance()),'Entradas menos saídas')}${card('Movimentações',num(data.lancamentos.length),'Registros')}</div><section class="panel"><h2>Novo lançamento</h2><form id="lancamentoForm" class="form"><label class="field">Tipo<select name="tipo"><option>Entrada</option><option>Saída</option></select></label><label class="field">Valor<input name="valor" type="number" min="0.01" step="0.01" required></label><label class="field">Data<input name="data" type="date" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}" required></label><label class="field">Destino / origem<select name="estado"><option value="">Cofre nacional</option>${data.estados.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label class="field wide">Descrição<input name="descricao" required maxlength="140" placeholder="Ex.: Repasse para obras"></label><div class="field wide"><button class="btn">Registrar lançamento</button></div></form></section><section class="panel" style="margin-top:14px"><h2>Histórico financeiro</h2>${tr(data.lancamentos.slice().reverse().map(x=>`<tr><td>${esc(x.data)}</td><td>${esc(x.descricao)}</td><td>${esc(data.estados.find(e=>e.id===x.estado)?.nome||'Cofre nacional')}</td><td>${esc(x.tipo)}</td><td>${money(x.valor)}</td><td><button class="btn danger" data-delete="lancamentos" data-id="${x.id}">Excluir</button></td></tr>`).join(''),['Data','Descrição','Destino / origem','Tipo','Valor','Ações'])}</section>`}
function aparencia(){return heading('Aparência','Escolha como o painel aparece neste aparelho.')+`<section class="panel"><h2>Tema do aplicativo</h2><form id="aparenciaForm" class="form"><label class="field">Modo<select name="tema"><option value="claro" ${theme==='claro'?'selected':''}>Claro</option><option value="escuro" ${theme==='escuro'?'selected':''}>Escuro</option><option value="sistema" ${theme==='sistema'?'selected':''}>Acompanhar aparelho</option></select></label><div class="field" style="align-self:end"><button class="btn">Salvar aparência</button></div></form><p class="note">A escolha fica salva neste navegador.</p></section>`}function economia(){return heading('Economia e PIB','Indicadores simples definidos para a história de Bom Regresso.')+`<div class="cards">${card('PIB anual',money(data.pib),`Ano ${esc(data.ano)}`)}${card('População cadastrada',num(data.municipios.reduce((s,x)=>s+Number(x.populacao),0)),'Soma dos municípios')}${card('PIB por habitante',data.municipios.reduce((s,x)=>s+Number(x.populacao),0)?money(data.pib/data.municipios.reduce((s,x)=>s+Number(x.populacao),0)):'—','Estimativa simples')}</div><section class="panel"><h2>Atualizar indicadores</h2><form id="economiaForm" class="form"><label class="field">Ano<input name="ano" type="number" min="1900" max="9999" value="${esc(data.ano)}" required></label><label class="field">PIB anual estimado<input name="pib" type="number" min="0" step="0.01" value="${esc(data.pib)}" required></label><label class="field wide">Saldo inicial do cofre<input name="cofreInicial" type="number" min="0" step="0.01" value="${esc(data.cofreInicial)}" required></label><div class="field wide"><button class="btn">Salvar indicadores</button></div></form><p class="note">O PIB é um indicador informado manualmente. Ele não altera o dinheiro disponível no cofre.</p></section>`}
document.addEventListener('click',e=>{if(e.target.closest('[data-country-local]')){countryEnabled=false;countryLoading=false;countryNotice='⚠ Dados salvos neste aparelho';render();return}if(e.target.closest('[data-register-profile]')){loginMode='create';renderLogin();return}if(e.target.closest('[data-cancel-register]')){loginMode='select';renderLogin();return}const login=e.target.closest('[data-login]');if(login){const p=data.profiles.find(x=>x.id===login.dataset.login);if(!p)return;loginMode='select';p.lastUsedAt=Date.now();data.currentProfileId=p.id;saveLocal();return}const emoji=e.target.closest('[data-emoji]');if(emoji){const target=$(emoji.parentElement.dataset.target);if(target){target.value=emoji.dataset.emoji;target.dispatchEvent(new Event('input',{bubbles:true}))}return}if(e.target.closest('[data-logout]')){loginMode='select';data.currentProfileId='';photoDraft='';page='inicio';saveLocal();return}if(e.target.closest('[data-cancel-photo]')){photoDraft='';page='perfil';render();return}if(e.target.closest('[data-remove-photo]')){photoDraft='';const p=current();p.photo='';save();page='perfil';render();return}const userEdit=e.target.closest('[data-edit-user]');if(userEdit&&scope(current())==='nacional'){editUserId=userEdit.dataset.editUser;page='usuarios';render();return}if(e.target.closest('[data-cancel-user]')){editUserId='';render();return}const stateEdit=e.target.closest('[data-edit-state]');if(stateEdit){const x=data.estados.find(v=>v.id===stateEdit.dataset.editState);if(x&&canState(x)){editStateId=x.id;page='estados';render();setTimeout(()=>$('stateEditForm')?.scrollIntoView({behavior:'smooth',block:'start'}),0)}return}const cityEdit=e.target.closest('[data-edit-city]');if(cityEdit){const x=data.municipios.find(v=>v.id===cityEdit.dataset.editCity);if(x&&canCity(x)){editCityId=x.id;page='adminmunicipio';render();setTimeout(()=>$('cityEditForm')?.scrollIntoView({behavior:'smooth',block:'start'}),0)}return}if(e.target.closest('[data-cancel-edit]')){editStateId='';editCityId='';render();return}if(e.target.closest('[data-more]')){$('moreBackdrop').hidden=false;return}if(e.target.closest('[data-close-more]')||e.target.id==='moreBackdrop'){$('moreBackdrop').hidden=true;return}const nav=e.target.closest('[data-page]');if(nav){if(!canPage(nav.dataset.page))return;$('moreBackdrop').hidden=true;page=nav.dataset.page;render();window.scrollTo(0,0)}const del=e.target.closest('[data-delete]');if(del&&confirm('Excluir este registro?')){const type=del.dataset.delete;const key=del.dataset.id;if(type==='lancamentos'&&scope(current())!=='nacional')return;if(type==='estados'&&scope(current())!=='nacional')return;if(type==='municipios'&&scope(current())==='municipal')return;if(type==='municipios'&&!canCity(data.municipios.find(x=>x.id===key)))return;if(type==='estados'&&data.municipios.some(x=>x.estado===key)){alert('Remova primeiro os municípios deste estado.');return}if(type==='estados'&&data.lancamentos.some(x=>x.estado===key)){alert('Remova primeiro os lançamentos vinculados a este estado.');return}if(type==='estados'||type==='municipios')for(const profile of data.profiles){if(profile.jurisdictionId===key)profile.jurisdictionId=''}data[type]=data[type].filter(x=>x.id!==key);save()}});document.addEventListener('submit',e=>{if(!['createProfileForm','profileForm','adminCreateForm','adminEditForm','stateEditForm','cityEditForm','estadoForm','municipioForm','lancamentoForm','economiaForm','aparenciaForm'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());if(e.target.id==='createProfileForm'){if(!ROLE_GROUPS[o.mode]?.roles.includes(o.role))return alert('Selecione uma função válida para o modo escolhido.');const p={id:id(),name:o.name.trim(),role:o.role,sector:o.sector.trim(),emoji:(o.emoji||'').trim(),photo:'',jurisdictionId:o.jurisdictionId||'',lastUsedAt:Date.now()};if(!p.name||!p.sector||!roles.includes(p.role))return;if(!validateRoleAvailability(p.role,'',p.jurisdictionId))return;if(scope(p)==='administrativo'&&!p.jurisdictionId)p.jurisdictionId=municipalTargetCity()?.id||'';if(p.jurisdictionId&&!((scope(p)==='estadual'?data.estados:data.municipios).some(x=>x.id===p.jurisdictionId))){alert('Escolha um território cadastrado para este cargo.');return}data.profiles.push(p);data.currentProfileId=p.id;loginMode='select';save();return}if(e.target.id==='adminCreateForm'){if(scope(current())!=='nacional')return;if(!ROLE_GROUPS[o.mode]?.roles.includes(o.role))return alert('Selecione uma função válida para o modo escolhido.');const p={id:id(),name:o.name.trim(),role:o.role,sector:o.sector.trim(),jurisdictionId:o.jurisdictionId||'',emoji:(o.emoji||'').trim(),photo:'',lastUsedAt:0};if(!p.name||!p.sector||!roles.includes(p.role))return;if(!validateRoleAvailability(p.role,'',p.jurisdictionId))return;if(scope(p)==='administrativo'&&!p.jurisdictionId)p.jurisdictionId=municipalTargetCity()?.id||'';if(p.jurisdictionId&&!((scope(p)==='estadual'?data.estados:data.municipios).some(x=>x.id===p.jurisdictionId))){alert('Escolha um território cadastrado para este cargo.');return}data.profiles.push(p);save();return}if(e.target.id==='adminEditForm'){if(scope(current())!=='nacional')return;const p=data.profiles.find(x=>x.id===o.id&&x.id!==current().id);if(!p||!roles.includes(o.role)||!ROLE_GROUPS[o.mode]?.roles.includes(o.role))return alert('Selecione uma função válida para o modo escolhido.');if(!validateRoleAvailability(o.role,p.id,o.jurisdictionId||''))return;if(o.jurisdictionId&&!((stateRoles.includes(o.role)?data.estados:data.municipios).some(x=>x.id===o.jurisdictionId))){alert('Escolha um território cadastrado para este cargo.');return}p.role=o.role;p.jurisdictionId=o.jurisdictionId||(scope({role:o.role})==='administrativo'?municipalTargetCity()?.id:'')||'';p.sector=o.sector.trim();editUserId='';save();return}if(e.target.id==='profileForm'){const p=current();if(!p)return;if(photoBusy)return alert('Aguarde a foto terminar de carregar.');p.name=o.name.trim();p.sector=o.sector.trim();p.emoji=o.emoji.trim();if(photoDraft)p.photo=photoDraft;photoDraft='';save();return}if(e.target.id==='stateEditForm'){const x=data.estados.find(v=>v.id===o.id);if(!x||!canState(x))return;const name=o.nome.trim(),sigla=o.sigla.trim().toUpperCase(),verba=Number(o.verba);if(!name||!sigla||!Number.isFinite(verba)||verba<0)return alert('Preencha os dados válidos do estado.');if(data.estados.some(v=>v.id!==x.id&&(v.nome.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')||v.sigla.toUpperCase()===sigla)))return alert('Já existe um estado com esse nome ou sigla.');x.nome=name;x.sigla=sigla;x.governante=o.governante.trim();x.verba=verba;editStateId='';save();return}if(e.target.id==='cityEditForm'){const x=data.municipios.find(v=>v.id===o.id);if(!x||!canCity(x))return;if(scope(current())==='nacional'){if(!data.estados.some(state=>state.id===o.estado))return alert('Escolha um estado cadastrado.');x.estado=o.estado}const population=Number(o.populacao);if(!Number.isInteger(population)||population<0)return alert('Informe uma população válida.');x.nome='Bom Regresso';x.prefeito=o.prefeito.trim();x.populacao=population;editCityId='';save();return}if(e.target.id==='aparenciaForm'){theme=o.tema;localStorage.setItem(THEME_KEY,theme);applyTheme();render();return}if(e.target.id==='economiaForm'){if(scope(current())!=='nacional')return;data.ano=Number(o.ano);data.pib=Number(o.pib);data.cofreInicial=Number(o.cofreInicial)}else if(e.target.id==='estadoForm'){if(scope(current())!=='nacional')return;if(data.estados.some(x=>x.nome.toLowerCase()===o.nome.trim().toLowerCase()||x.sigla.toLowerCase()===o.sigla.trim().toLowerCase())){alert('Já existe um estado com este nome ou sigla.');return}data.estados.push({...o,id:id(),nome:o.nome.trim(),sigla:o.sigla.trim().toUpperCase(),verba:Number(o.verba)})}else if(e.target.id==='municipioForm'){if(scope(current())==='municipal'||data.municipios.length||!data.estados.some(x=>x.id===o.estado&&canState(x)))return;const city={...o,id:id(),nome:'Bom Regresso',populacao:Number(o.populacao)};data.municipios.push(city);for(const profile of data.profiles){if(scope(profile)==='administrativo'&&!profile.jurisdictionId)profile.jurisdictionId=city.id}}else{if(scope(current())!=='nacional')return;if(o.tipo==='Saída'&&Number(o.valor)>balance()){alert('O valor supera o saldo do cofre.');return}data.lancamentos.push({...o,id:id(),valor:Number(o.valor)})}save()});document.addEventListener('change',e=>{
  if(e.target.id==='photoInput'){processPhoto(e.target.files?.[0]);return}

  }
