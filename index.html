function connectFederatedFrame(frameId,statusId,payload,successLabel='Perfil conectado.'){
  const frame=$(frameId),status=$(statusId),p=payload;
  if(!frame||!p)return;
  const requestId='federation-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  let handoffSent=false,finished=false;
  const setStatus=(text,ok=false)=>{if(status){status.textContent=text;status.dataset.ok=ok?'1':'0'}};
  const target=/^https?:$/.test(location.protocol)?location.origin:'*';
  const onMessage=e=>{
    const msg=e.data;
    if(e.source!==frame.contentWindow||!msg||msg.protocol!==FEDERATION_PROTOCOL||msg.requestId!==requestId)return;
    if(msg.type==='MUNICIPAL_SYSTEM_DESCRIPTOR'&&!handoffSent){
      handoffSent=true;setStatus('Conectando seu perfil…');
      frame.contentWindow.postMessage({protocol:FEDERATION_PROTOCOL,type:'HANDOFF_PROFILE',requestId,payload:p},target);
      return
    }
    if(msg.type==='HANDOFF_RESULT'){
      finished=true;
      if(msg.payload?.ok)setStatus(msg.payload.requiresPassword?'Perfil sincronizado. Confirme a senha para continuar.':successLabel,true);
      else setStatus(msg.payload?.reason||'Não foi possível conectar este perfil.');
      setTimeout(()=>window.removeEventListener('message',onMessage),3500)
    }
  };
  window.addEventListener('message',onMessage);
  const discover=()=>{if(!finished){try{frame.contentWindow?.postMessage({protocol:FEDERATION_PROTOCOL,type:'DISCOVER_MUNICIPAL_SYSTEM',requestId},target)}catch{}}};
  frame.addEventListener('load',()=>setTimeout(discover,120),{once:true});
  setTimeout(discover,320);
  setTimeout(()=>{if(!finished&&!handoffSent)setStatus('O módulo abriu, mas a integração automática ainda está conectando…')},3200)
}

function lastMonths(n=6){const d=new Date(),out=[];for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({key:`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`,label:MONTH_NAMES[x.getMonth()]})}return out}
function monthlyFlows(deltaOf){
  return lastMonths(6).map(m=>{let inflow=0,outflow=0;for(const [date,delta] of deltaOf())if(monthKey(date)===m.key){if(delta>0)inflow+=delta;else outflow-=delta}return{label:m.label,inflow,outflow}})
}
const stateEntries=st=>()=>[...data.lancamentos.filter(l=>l.estado===st.id).map(l=>[l.data,unionFlow(l)]),...data.movimentos.map(m=>[m.data,stateDelta(m,st.id)])];
const cityEntries=c=>()=>data.movimentos.map(m=>[m.data,cityDelta(m,c.id)]);

// ---- gráficos (SVG simples, seguem o tema claro/escuro pelo CSS)
function flowChart(rows){
  const W=320,H=150,left=6,base=H-20,max=Math.max(1,...rows.flatMap(r=>[r.inflow,r.outflow])),bw=(W-left)/rows.length;
  const bars=rows.map((r,i)=>{const x=left+i*bw,h1=Math.round((base-8)*r.inflow/max),h2=Math.round((base-8)*r.outflow/max);
    return `<rect class="gov-bar-in" x="${(x+bw*.16).toFixed(1)}" y="${base-h1}" width="${(bw*.3).toFixed(1)}" height="${h1}" rx="3"><title>Entradas em ${esc(r.label)}: ${esc(money(r.inflow))}</title></rect><rect class="gov-bar-out" x="${(x+bw*.54).toFixed(1)}" y="${base-h2}" width="${(bw*.3).toFixed(1)}" height="${h2}" rx="3"><title>Saídas em ${esc(r.label)}: ${esc(money(r.outflow))}</title></rect><text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(r.label)}</text>`}).join('');
  return `<svg class="gov-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas nos últimos 6 meses"><line x1="0" y1="${base}" x2="${W}" y2="${base}" class="gov-axis"/>${bars}</svg><div class="gov-legend"><span><i class="gov-dot in"></i>Entradas</span><span><i class="gov-dot out"></i>Saídas</span></div>`
}
function rankBars(items){
  items=items.filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,7);
  if(!items.length)return '<p class="gov-empty">Nada registrado ainda.</p>';
  const max=Math.max(...items.map(x=>x.value));
  return `<div class="gov-rank">${items.map(x=>`<div class="gov-rank-row"><span title="${esc(x.label)}">${esc(x.label)}</span><div class="gov-rank-track"><i style="width:${Math.max(3,Math.round(100*x.value/max))}%"></i></div><b>${esc(moneyShort(x.value))}</b></div>`).join('')}</div>`
}
function donut(items){
  items=items.filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const total=items.reduce((a,x)=>a+x.value,0);if(!total)return '<p class="gov-empty">Nada registrado ainda.</p>';
  let acc=0;const segs=items.map((x,i)=>{const pct=100*x.value/total,seg=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke-width="6.5" class="gov-seg s${i%8}" stroke-dasharray="${pct.toFixed(2)} ${(100-pct).toFixed(2)}" stroke-dashoffset="${(25-acc).toFixed(2)}"><title>${esc(x.label)}: ${esc(money(x.value))}</title></circle>`;acc+=pct;return seg}).join('');
  return `<div class="gov-donut"><svg viewBox="0 0 42 42" role="img" aria-label="Distribuição por finalidade"><circle r="15.9155" cx="21" cy="21" fill="none" stroke-width="6.5" class="gov-seg-bg"/>${segs}<text x="21" y="22.6" text-anchor="middle" class="gov-donut-total">${esc(moneyShort(total))}</text></svg><ul>${items.map((x,i)=>`<li><i class="gov-dot s${i%8}"></i>${esc(x.label)} <b>${Math.round(100*x.value/total)}%</b></li>`).join('')}</ul></div>`
}
const byCategory=list=>{const m=new Map();for(const x of list)m.set(x.categoria||'Outros',(m.get(x.categoria||'Outros')||0)+(Number(x.valor)||0));return [...m].map(([label,value])=>({label,value}))};

// ---- blocos visuais
const govCard=(label,value,detail,tone='')=>`<div class="gov-card ${tone}"><small>${esc(label)}</small><strong title="${esc(value)}">${value}</strong><span>${esc(detail)}</span></div>`;
const govHead=(title,desc,extra='')=>`<div class="gov-head"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`;
const signed=v=>`<span class="gov-amount ${v<0?'neg':'pos'}">${v<0?'−':'+'} ${esc(money(Math.abs(v)))}</span>`;
function movLabel(m){
  if(m.tipo==='repasse')return `Repasse para ${cityName(m.municipio)}${m.descricao?' · '+m.descricao:''}`;
  if(m.tipo==='arrecadacao')return `Tributos de ${cityName(m.municipio)}`;
  return m.descricao||m.categoria||(m.tipo==='receita'?'Receita':'Despesa')
}
const movSort=(a,b)=>String(b.data||'').localeCompare(String(a.data||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||''));
const categoryOptions=(selected='')=>GOV_CATEGORIES.map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join('');
const movDelete=m=>`<button type="button" class="btn danger gov-mini" data-mov-del="${esc(m.id)}" title="Excluir">✕</button>`;

function govShell({title,subtitle,tabs,active,tabAttr,exit,body}){
  const btn=(short)=>([k,icon,label,shortLabel])=>`<button type="button" class="${k===active?'active':''}" ${tabAttr}="${k}"><span aria-hidden="true">${icon}</span>${esc(short?shortLabel:label)}</button>`;
  return `<div class="gov-app"><header class="gov-top"><button class="btn secondary" type="button" data-page="inicio">← República</button><div class="grow"><b>${title}</b><small>${subtitle}</small></div>${exit||''}</header><div class="gov-body"><nav class="gov-side" aria-label="Seções">${tabs.map(btn(false)).join('')}</nav><main class="gov-main">${body}</main></div><nav class="gov-bottom" aria-label="Seções">${tabs.map(btn(true)).join('')}</nav></div>`
}

// ---- quem abre o quê
function govOpenState(){const p=current();if(!p)return null;const level=scope(p);if(level==='estadual')return data.estados.find(x=>x.id===p.jurisdictionId)||null;if(level!=='nacional')return null;return data.estados.find(x=>x.id===govStateId)||null}
const govAllowedCities=()=>data.municipios.filter(c=>canCity(c)||(isBomRegresso(c)&&municipalSystem()));
function govOpenCity(){
  const p=current();if(!p)return null;const level=scope(p),allowed=govAllowedCities(),chosen=allowed.find(c=>c.id===govCityId);
  if(chosen)return chosen;
  if(level==='municipal'||level==='administrativo')return allowed.find(c=>c.id===p.jurisdictionId)||(municipalSystem()?municipalTargetCity():null);
  return null
}

// ---- Estados: seleção (Presidência) e app do governo estadual
function estados(){
  const p=current(),level=scope(p);
  if(level==='estadual'&&!govOpenState())return heading('Governo estadual','Este perfil ainda não está vinculado a um estado.')+`<section class="panel"><h2>Aguardando estado</h2><p>A Presidência precisa cadastrar um estado e selecionar <b>Perfis → Atribuir</b> para vincular este governo.</p></section>`;
  const st=govOpenState();
  if(st)return govStateApp(st);
  govStateId='';
  return govPicker('estados')
}

function govStateApp(st){
  const tab=GOV_TABS.some(([k])=>k===govTab)?govTab:'painel';
  const body=({painel:govPainel,municipios:govMunicipios,repasses:govRepasses,arrecadacao:govArrecadacao,financas:govFinancas,dados:govDados})[tab](st);
  const national=scope(current())==='nacional';
  return govShell({title:`🗺️ Governo de ${esc(st.nome)}`,subtitle:`${esc(st.sigla)} · Governante: ${esc(st.governante||'—')} · Caixa ${esc(moneyShort(stateCash(st)))}`,tabs:GOV_TABS,active:tab,tabAttr:'data-gov-tab',exit:national&&data.estados.filter(canState).length>1?'<button class="btn secondary" type="button" data-gov-exit title="Trocar estado"><span class="gov-long">Trocar estado</span><span class="gov-short">⇄ Estados</span></button>':'',body})
}
const stateCities=st=>data.municipios.filter(c=>c.estado===st.id);
function govPainel(st){
  const cities=stateCities(st),year=String(new Date().getFullYear());
  const sent=sumMov(m=>m.estado===st.id&&m.tipo==='repasse'&&yearKey(m.data)===year),collected=sumMov(m=>m.estado===st.id&&m.tipo==='arrecadacao'&&yearKey(m.data)===year);
  const recent=[...data.movimentos.filter(m=>m.estado===st.id&&stateDelta(m,st.id)),...data.lancamentos.filter(l=>l.estado===st.id).map(l=>({...l,_union:true}))].sort(movSort).slice(0,8);
  const spending=data.movimentos.filter(m=>m.estado===st.id&&(m.tipo==='repasse'||(m.nivel==='estado'&&m.tipo==='despesa')));
  return govHead('Painel estadual','Visão geral das contas e dos municípios do estado.',`<div class="gov-quick"><button class="btn" type="button" data-gov-tab="repasses">💸 Mandar verba</button><button class="btn secondary" type="button" data-gov-tab="municipios">＋ Município</button><button class="btn secondary" type="button" data-gov-collect-all>🧾 Arrecadar</button></div>`)+
  `<div class="gov-cards">${govCard('Caixa estadual',esc(moneyShort(stateCash(st))),'Disponível agora')}${govCard('Municípios',num(cities.length),'Neste estado')}${govCard('População',num(cities.reduce((a,c)=>a+(Number(c.populacao)||0),0)),'Soma dos municípios')}${govCard('Repassado em '+year,esc(moneyShort(sent)),'Verba enviada às cidades')}${govCard('Arrecadado em '+year,esc(moneyShort(collected)),'Tributos estaduais')}</div>`+
  `<div class="gov-grid"><section class="panel"><h2>Fluxo de caixa</h2><p class="muted">Entradas e saídas dos últimos 6 meses.</p>${flowChart(monthlyFlows(stateEntries(st)))}</section><section class="panel"><h2>Repasses por município</h2><p class="muted">Total enviado a cada cidade.</p>${rankBars(cities.map(c=>({label:c.nome,value:sumMov(m=>m.estado===st.id&&m.tipo==='repasse'&&m.municipio===c.id)})))}</section><section class="panel"><h2>Para onde vai a verba</h2><p class="muted">Repasses e despesas por finalidade.</p>${donut(byCategory(spending))}</section><section class="panel"><h2>Atividades recentes</h2><p class="muted">Últimas movimentações do estado.</p>${recent.length?`<div class="gov-feed">${recent.map(m=>`<div class="gov-feed-row"><span>${esc(m._union?(m.tipo==='Saída'?'Repasse da União':'Pagamento à União'):movLabel(m))}<small>${esc(m.data||'')}</small></span>${signed(m._union?unionFlow(m):stateDelta(m,st.id))}</div>`).join('')}</div>`:'<p class="gov-empty">Nenhuma movimentação ainda.</p>'}</section></div>`
}
function govMunicipios(st){
  const cities=stateCities(st);
  return govHead('Municípios',`Cadastre e acompanhe as cidades de ${esc(st.nome)}.`)+
  `<section class="panel"><h2>Cadastrar município</h2><form id="municipioForm" class="form"><input type="hidden" name="estado" value="${esc(st.id)}"><label class="field">Nome do município<input name="nome" required maxlength="60" placeholder="Ex.: Vila Serena"></label><label class="field">Prefeito(a)<input name="prefeito" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="0" required></label><label class="field">Renda mensal fictícia<input name="renda" type="number" min="0" step="0.01" value="0"></label><div class="field wide"><button class="btn">Cadastrar município</button></div></form></section>`+
  `<div class="gov-picks" style="margin-top:16px">${cities.map(c=>`<div class="gov-pick static"><div class="gov-pick-top"><span class="gov-badge city">🏘️</span><span><b>${esc(c.nome)}</b><small>Prefeito(a): ${esc(c.prefeito||'—')}</small></span>${isBomRegresso(c)?'<span class="gov-tag">Sistema completo</span>':''}</div><div class="gov-pick-stats"><span>👥 <b>${num(c.populacao)}</b></span><span>📈 <b>${esc(moneyShort(c.renda||0))}</b>/mês</span><span>💰 <b>${esc(moneyShort(cityCash(c)))}</b></span></div><div class="gov-pick-actions"><button class="btn secondary gov-mini" type="button" data-city-open="${esc(c.id)}">Abrir painel</button><button class="btn gov-mini" type="button" data-gov-send="${esc(c.id)}">💸 Mandar verba</button></div></div>`).join('')||'<p class="gov-empty">Nenhum município neste estado ainda. Use o formulário acima.</p>'}</div>`
}
function govRepasses(st){
  const cities=stateCities(st),list=data.movimentos.filter(m=>m.estado===st.id&&m.tipo==='repasse').sort(movSort);
  return govHead('Repasses',`Envie verba do caixa de ${esc(st.nome)} para os municípios.`)+
  `<div class="gov-grid"><section class="panel"><h2>Mandar verba</h2><p class="muted">Caixa disponível: <b>${esc(money(stateCash(st)))}</b></p>${cities.length?`<form id="govTransferForm" class="form"><label class="field">Município<select name="municipio" required>${cities.map(c=>`<option value="${esc(c.id)}" ${c.id===govSendTo?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label class="field">Finalidade<select name="categoria">${categoryOptions('Obras')}</select></label><label class="field">Valor<input name="valor" type="number" min="0.01" step="0.01" required></label><label class="field">Data<input name="data" type="date" value="${todayISO()}" required></label><label class="field wide">Descrição<input name="descricao" maxlength="120" placeholder="Ex.: Reforma do posto de saúde"></label><div class="field wide"><button class="btn">💸 Enviar repasse</button></div></form>`:'<p class="gov-empty">Cadastre um município para enviar verba.</p>'}</section><section class="panel"><h2>Quem mais recebeu</h2>${rankBars(cities.map(c=>({label:c.nome,value:sumMov(m=>m.estado===st.id&&m.tipo==='repasse'&&m.municipio===c.id)})))}</section></div>`+
  `<section class="panel" style="margin-top:14px"><h2>Histórico de repasses</h2>${tr(list.map(m=>`<tr><td>${esc(m.data)}</td><td>${esc(cityName(m.municipio))}</td><td>${esc(m.categoria||'—')}</td><td>${esc(m.descricao||'—')}</td><td>${esc(money(m.valor))}</td><td class="actions-cell">${movDelete(m)}</td></tr>`).join(''),['Data','Município','Finalidade','Descrição','Valor',''])}</section>`
}
function govArrecadacao(st){
  const cities=stateCities(st),month=monthKey(todayISO()),rate=govRate(st);
  const done=c=>data.movimentos.some(m=>m.tipo==='arrecadacao'&&m.municipio===c.id&&m.estado===st.id&&monthKey(m.data)===month);
  const pending=cities.filter(c=>!done(c)&&(Number(c.renda)||0)>0);
  return govHead('Arrecadação',`O estado recolhe ${num(rate)}% da renda mensal de cada município.`,pending.length?`<button class="btn" type="button" data-gov-collect-all>🧾 Arrecadar de todos (${num(pending.length)})</button>`:'')+
  `<div class="gov-grid"><section class="panel gov-compact"><h2>Tributos deste mês</h2>${tr(cities.map(c=>{const due=(Number(c.renda)||0)*rate/100;return `<tr><td>${esc(c.nome)}<small class="gov-sub">Renda ${esc(moneyShort(c.renda||0))}/mês</small></td><td>${esc(money(due))}</td><td>${done(c)?'<span class="gov-tag ok">✓ Arrecadado</span>':due>0?`<button class="btn gov-mini" type="button" data-gov-collect="${esc(c.id)}">Arrecadar</button>`:'<span class="muted">Sem renda</span>'}</td></tr>`}).join(''),['Município','Tributo','Situação'])}</section><section class="panel"><h2>Alíquota estadual</h2><p class="muted">Percentual cobrado sobre a renda das cidades (0 a 50%).</p><form id="govRateForm" class="form"><label class="field">Alíquota (%)<input name="aliquota" type="number" min="0" max="50" step="0.5" value="${esc(rate)}" required></label><div class="field"><button class="btn secondary">Salvar alíquota</button></div></form><h2 style="margin-top:18px">Arrecadado por cidade</h2>${rankBars(cities.map(c=>({label:c.nome,value:sumMov(m=>m.estado===st.id&&m.tipo==='arrecadacao'&&m.municipio===c.id)})))}</section></div>`
}
function govFinancas(st){
  const rows=[...data.movimentos.filter(m=>m.estado===st.id&&stateDelta(m,st.id)),...data.lancamentos.filter(l=>l.estado===st.id).map(l=>({...l,_union:true}))].sort(movSort);
  return govHead('Finanças estaduais','Receitas e despesas próprias do estado, além de repasses e tributos.')+

  `<section class="panel" style="margin-top:14px"><h2>Extrato do estado</h2><p class="muted">Inclui a verba inicial de ${esc(money(st.verba||0))} e os repasses da União registrados no Cofre nacional.</p>${tr(rows.map(m=>`<tr><td>${esc(m.data||'—')}</td><td>${esc(m._union?(m.tipo==='Saída'?'Repasse da União':'Pagamento à União'):movLabel(m))}</td><td>${esc(m._union?'União':m.categoria||'—')}</td><td>${signed(m._union?unionFlow(m):stateDelta(m,st.id))}</td><td class="actions-cell">${m._union?'':movDelete(m)}</td></tr>`).join(''),['Data','Descrição','Categoria','Valor',''])}</section>`

// ---- Seleção de estado/município no mesmo formato da tela "Entrar" dos perfis
function govPicker(kind){
  const level=scope(current()),isState=kind==='estados',canCreate=isState?level==='nacional':['nacional','estadual'].includes(level);
  const creating=govPickerMode==='create'&&canCreate;
  const top=`${creating?'<button class="entry-back" type="button" data-gov-list>← Voltar para a lista</button>':'<button class="entry-back" type="button" data-page="inicio">← Voltar para a República</button>'}<img class="login-logo" src="pais/brasao.svg" alt="Brasão de Bom Regresso"><div class="login-kicker">REPÚBLICA BOM REGRESSENSE</div>`;
  let body;
  if(isState){
    const list=data.estados.filter(canState);
    const row=st=>{const cities=stateCities(st);return `<button type="button" class="login-user" data-gov-open="${esc(st.id)}"><span class="avatar gov-avatar">${esc(st.sigla||'?')}</span><span><b>${esc(st.nome)}</b><small>${esc(st.governante||'Sem governante')} · ${num(cities.length)} ${cities.length===1?'município':'municípios'} · ${esc(moneyShort(stateCash(st)))}</small></span><span class="login-arrow" aria-hidden="true">›</span></button>`};
    body=creating?`<h1>Novo estado</h1><p class="muted">Informe os dados do estado.</p><form id="estadoForm" class="profile-form"><label class="field">Nome<input name="nome" required maxlength="80" placeholder="Ex.: Serra Dourada"></label><label class="field">Sigla<input name="sigla" required maxlength="3" placeholder="Ex.: SD"></label><label class="field">Governante<input name="governante" maxlength="80"></label><label class="field">Verba inicial do estado<input name="verba" type="number" min="0" step="0.01" value="0" required></label><div class="actions"><button class="btn login-submit" type="submit">Cadastrar estado</button><button class="btn secondary" type="button" data-gov-list>Voltar</button></div></form>`
      :`<h1>Estados</h1><p class="muted">Toque no estado para abrir o governo estadual.${canCreate?' Para criar um novo, use o botão abaixo.':''}</p><div class="login-list">${list.map(row).join('')||'<p class="empty">Nenhum estado cadastrado ainda.</p>'}</div>${canCreate?'<button type="button" class="btn add-profile" data-gov-new>＋ Cadastrar novo estado</button>':''}<small class="login-note">O estado abre o painel do governo estadual.</small>`;
  }else{
    const allowed=govAllowedCities(),states=data.estados.filter(st=>allowed.some(c=>c.estado===st.id)),orphans=allowed.filter(c=>!data.estados.some(st=>st.id===c.estado));

      :`<h1>Municípios</h1><p class="muted">Toque no município para abrir o painel municipal.${canCreate?' Para criar um novo, use o botão abaixo.':''}</p><div class="login-list">${states.map(st=>`<div class="login-group-title">🗺️ ${esc(st.nome)} · ${esc(st.sigla)}</div>${allowed.filter(c=>c.estado===st.id).map(row).join('')}`).join('')}${orphans.length?`<div class="login-group-title">Sem estado</div>${orphans.map(row).join('')}`:''}${allowed.length?'':'<p class="empty">Nenhum município cadastrado ainda.</p>'}</div>${canCreate?'<button type="button" class="btn add-profile" data-gov-new>＋ Cadastrar novo município</button>':''}<small class="login-note">Bom Regresso abre o sistema completo da Prefeitura; as demais cidades abrem o painel municipal.</small>`;
  }
  return `<div class="login-screen gov-picker"><div class="login-card">${top}${body}</div></div>`
}

}
function govCityApp(c){
  const tab=CITY_TABS.some(([k])=>k===cityTab)?cityTab:'painel',st=data.estados.find(x=>x.id===c.estado);

}

// ---- ações
const govCanMov=m=>{const st=data.estados.find(x=>x.id===m.estado),c=data.municipios.find(x=>x.id===m.municipio);return m.nivel==='municipio'?!!c&&canCity(c):!!st&&canState(st)};
function govCollect(st,cities){
  const month=monthKey(todayISO()),rate=govRate(st),author=current()?.name||'';let count=0;
  for(const c of cities){
    const due=Math.round((Number(c.renda)||0)*rate)/100;
    if(due<=0||data.movimentos.some(m=>m.tipo==='arrecadacao'&&m.municipio===c.id&&m.estado===st.id&&monthKey(m.data)===month))continue;
    data.movimentos.push({id:id(),tipo:'arrecadacao',nivel:'estado',estado:st.id,municipio:c.id,categoria:'Impostos',valor:due,data:todayISO(),descricao:`${num(rate)}% da renda de ${MONTH_NAMES[new Date().getMonth()]}`,autor:author,createdAt:new Date().toISOString()});count++
  }
  if(!count)return alert('Nada a arrecadar: os tributos deste mês já foram recolhidos ou as cidades estão sem renda.');
  save()
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-page]:not(body)'))govPickerMode='list';
  const t=e.target.closest('[data-gov-tab],[data-city-tab],[data-gov-open],[data-gov-exit],[data-city-open],[data-city-exit],[data-gov-send],[data-gov-collect],[data-gov-collect-all],[data-mov-del],[data-city-income],[data-gov-new],[data-gov-list]');
  if(!t||!current())return;
  formEditing=false;
  if(t.hasAttribute('data-gov-new')){govPickerMode='create';render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-gov-list')){govPickerMode='list';render();window.scrollTo(0,0);return}
  govPickerMode='list';
  if(t.dataset.govTab){govTab=t.dataset.govTab;render();window.scrollTo(0,0);return}
  if(t.dataset.cityTab){cityTab=t.dataset.cityTab;render();window.scrollTo(0,0);return}
  if(t.dataset.govOpen){govStateId=t.dataset.govOpen;govTab='painel';render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-gov-exit')){govStateId='';render();window.scrollTo(0,0);return}
  if(t.dataset.cityOpen){if(!canPage('municipios'))return;govCityId=t.dataset.cityOpen;cityTab='painel';page='municipios';render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-city-exit')){govCityId='';render();window.scrollTo(0,0);return}
  if(t.dataset.govSend){govSendTo=t.dataset.govSend;govTab='repasses';render();window.scrollTo(0,0);return}
  const st=govOpenState();
  if(t.dataset.govCollect){const c=data.municipios.find(x=>x.id===t.dataset.govCollect);if(st&&c&&c.estado===st.id&&canState(st))govCollect(st,[c]);return}
  if(t.hasAttribute('data-gov-collect-all')){if(st&&canState(st))govCollect(st,stateCities(st));return}
  if(t.dataset.movDel){const m=data.movimentos.find(x=>x.id===t.dataset.movDel);if(!m||!govCanMov(m))return;if(!confirm('Excluir esta movimentação?'))return;data.movimentos=data.movimentos.filter(x=>x.id!==m.id);save();return}
  if(t.hasAttribute('data-city-income')){
    const c=govOpenCity();if(!c||!canCity(c))return;const renda=Number(c.renda)||0;
    if(renda<=0)return alert('Defina a renda mensal do município em Dados.');
    const month=monthKey(todayISO());
    if(data.movimentos.some(m=>m.municipio===c.id&&m.nivel==='municipio'&&m.tipo==='receita'&&m.renda===true&&monthKey(m.data)===month))return alert('A renda deste mês já foi registrada.');
    data.movimentos.push({id:id(),tipo:'receita',nivel:'municipio',municipio:c.id,estado:c.estado,categoria:'Impostos',valor:renda,data:todayISO(),descricao:'Renda do mês',renda:true,autor:current().name,createdAt:new Date().toISOString()});save()
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;if(f.id==='estadoForm'||f.id==='municipioForm'){govPickerMode='list';return}
  if(!['govTransferForm','govRateForm','govFinForm','cityFinForm'].includes(f.id))return;
  e.preventDefault();
  const o=Object.fromEntries(new FormData(f).entries()),author=current()?.name||'',now=new Date().toISOString();
  if(f.id==='cityFinForm'){
    const c=govOpenCity();if(!c||!canCity(c))return;const valor=Number(o.valor);if(!(valor>0))return alert('Informe um valor válido.');
    data.movimentos.push({id:id(),tipo:o.tipo==='despesa'?'despesa':'receita',nivel:'municipio',municipio:c.id,estado:c.estado,categoria:o.categoria,valor,data:o.data||todayISO(),descricao:String(o.descricao||'').trim(),autor:author,createdAt:now});save();return
  }
  const st=govOpenState();if(!st||!canState(st))return;
  if(f.id==='govRateForm'){const rate=Number(o.aliquota);if(!(rate>=0&&rate<=50))return alert('A alíquota deve ficar entre 0 e 50%.');st.aliquota=rate;save();return}
  const valor=Number(o.valor);if(!(valor>0))return alert('Informe um valor válido.');
  if(f.id==='govTransferForm'){
    const c=data.municipios.find(x=>x.id===o.municipio&&x.estado===st.id);if(!c)return alert('Escolha um município do estado.');
    if(valor>stateCash(st))return alert(`Caixa estadual insuficiente. Disponível: ${money(stateCash(st))}.`);
    data.movimentos.push({id:id(),tipo:'repasse',nivel:'estado',estado:st.id,municipio:c.id,categoria:o.categoria,valor,data:o.data||todayISO(),descricao:String(o.descricao||'').trim(),autor:author,createdAt:now});govSendTo='';save();return
  }
  if(f.id==='govFinForm'){
    if(o.tipo==='despesa'&&valor>stateCash(st))return alert(`Caixa estadual insuficiente. Disponível: ${money(stateCash(st))}.`);
    data.movimentos.push({id:id(),tipo:o.tipo==='despesa'?'despesa':'receita',nivel:'estado',estado:st.id,categoria:o.categoria,valor,data:o.data||todayISO(),descricao:String(o.descricao||'').trim(),autor:author,createdAt:now});save()
  }
});
function adminmunicipio(){const level=scope(current()),national=level==='nacional',allowedStates=data.estados.filter(canState),items=data.municipios.filter(canCity),edit=items.find(x=>x.id===editCityId),canCreate=level!=='municipal';return heading('Municípios',level==='municipal'?'Edite os dados do seu município.':'Cadastre e edite os municípios de cada estado.')+(canCreate?`<section class="panel"><h2>Novo município</h2><form id="municipioForm" class="form"><label class="field">Município<input name="nome" required maxlength="60" placeholder="Nome do município"></label><label class="field">Estado<select name="estado" required><option value="">Selecione</option>${allowedStates.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label class="field">Prefeito(a)<input name="prefeito" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="0" required></label><label class="field">Renda mensal fictícia<input name="renda" type="number" min="0" step="0.01" value="0"></label><div class="field wide"><button class="btn" ${!allowedStates.length?'disabled':''}>Adicionar município</button></div></form>${!allowedStates.length?'<p class="note">É preciso cadastrar ou vincular um estado antes de adicionar municípios.</p>':''}</section>`:'')+(edit?`<section class="panel" style="margin-top:14px"><h2>Editar ${esc(edit.nome)}</h2><form id="cityEditForm" class="form"><input type="hidden" name="id" value="${edit.id}"><label class="field">Município<input name="nome" value="${esc(edit.nome)}" ${isBomRegresso(edit)?'readonly':'required maxlength="60"'}></label>${national?`<label class="field">Estado<select name="estado" required>${data.estados.map(state=>`<option value="${state.id}" ${state.id===edit.estado?'selected':''}>${esc(state.nome)}</option>`).join('')}</select></label>`:`<label class="field">Estado<input value="${esc(data.estados.find(state=>state.id===edit.estado)?.nome||'—')}" readonly></label>`}<label class="field">Prefeito(a)<input name="prefeito" value="${esc(edit.prefeito||'')}" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="${esc(edit.populacao)}" required></label><label class="field">Renda mensal fictícia<input name="renda" type="number" min="0" step="0.01" value="${esc(edit.renda||0)}"></label><div class="field wide actions"><button class="btn">Salvar município</button><button type="button" class="btn secondary" data-cancel-edit>Cancelar</button></div></form></section>`:'')+`<section class="panel" style="margin-top:14px"><h2>${level==='municipal'?'Meu município':'Municípios cadastrados'}</h2>${tr(items.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(data.estados.find(e=>e.id===x.estado)?.nome||'—')}</td><td>${esc(x.prefeito||'—')}</td><td>${num(x.populacao)}</td><td class="actions-cell"><button class="btn secondary" data-edit-city="${x.id}">Editar</button>${level!=='municipal'?` <button class="btn danger" data-delete="municipios" data-id="${x.id}">Excluir</button>`:''}</td></tr>`).join(''),['Município','Estado','Prefeito(a)','População','Ações'])}</section>`}

function cofre(){return heading('Cofre público','Registre receitas, gastos e repasses de verba.')+`<div class="cards">${card('Saldo atual',money(balance()),'Entradas menos saídas')}${card('Movimentações',num(data.lancamentos.length),'Registros')}</div><section class="panel"><h2>Novo lançamento</h2><form id="lancamentoForm" class="form"><label class="field">Tipo<select name="tipo"><option>Entrada</option><option>Saída</option></select></label><label class="field">Valor<input name="valor" type="number" min="0.01" step="0.01" required></label><label class="field">Data<input name="data" type="date" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}" required></label><label class="field">Destino / origem<select name="estado"><option value="">Cofre nacional</option>${data.estados.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label class="field wide">Descrição<input name="descricao" required maxlength="140" placeholder="Ex.: Repasse para obras"></label><div class="field wide"><button class="btn">Registrar lançamento</button></div></form></section><section class="panel" style="margin-top:14px"><h2>Histórico financeiro</h2>${tr(data.lancamentos.slice().reverse().map(x=>`<tr><td>${esc(x.data)}</td><td>${esc(x.descricao)}</td><td>${esc(data.estados.find(e=>e.id===x.estado)?.nome||'Cofre nacional')}</td><td>${esc(x.tipo)}</td><td>${money(x.valor)}</td><td><button class="btn danger" data-delete="lancamentos" data-id="${x.id}">Excluir</button></td></tr>`).join(''),['Data','Descrição','Destino / origem','Tipo','Valor','Ações'])}</section>`}
function aparencia(){return heading('Aparência','Escolha como o painel aparece neste aparelho.')+`<section class="panel"><h2>Tema do aplicativo</h2><form id="aparenciaForm" class="form"><label class="field">Modo<select name="tema"><option value="claro" ${theme==='claro'?'selected':''}>Claro</option><option value="escuro" ${theme==='escuro'?'selected':''}>Escuro</option><option value="sistema" ${theme==='sistema'?'selected':''}>Acompanhar aparelho</option></select></label><div class="field" style="align-self:end"><button class="btn">Salvar aparência</button></div></form><p class="note">A escolha fica salva neste navegador.</p></section>`}function economia(){return heading('Economia e PIB','Indicadores simples definidos para a história de Bom Regresso.')+`<div class="cards">${card('PIB anual',money(data.pib),`Ano ${esc(data.ano)}`)}${card('População cadastrada',num(data.municipios.reduce((s,x)=>s+Number(x.populacao),0)),'Soma dos municípios')}${card('PIB por habitante',data.municipios.reduce((s,x)=>s+Number(x.populacao),0)?money(data.pib/data.municipios.reduce((s,x)=>s+Number(x.populacao),0)):'—','Estimativa simples')}</div><section class="panel"><h2>Atualizar indicadores</h2><form id="economiaForm" class="form"><label class="field">Ano<input name="ano" type="number" min="1900" max="9999" value="${esc(data.ano)}" required></label><label class="field">PIB anual estimado<input name="pib" type="number" min="0" step="0.01" value="${esc(data.pib)}" required></label><label class="field wide">Saldo inicial do cofre<input name="cofreInicial" type="number" min="0" step="0.01" value="${esc(data.cofreInicial)}" required></label><div class="field wide"><button class="btn">Salvar indicadores</button></div></form><p class="note">O PIB é um indicador informado manualmente. Ele não altera o dinheiro disponível no cofre.</p></section>`}
