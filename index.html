<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0B2E59" />
<title>Prefeitura de Bom Regresso — Sistema Municipal</title>
<!-- Brasão oficial usado no sistema: Bom Regresso -->
<style>
:root{
  --navy:#0B2E59;--navy2:#123F73;--navy3:#1A528D;--gold:#D7A93E;--gold2:#F3D98F;
  --bg:#EEF3F7;--card:#fff;--text:#26323D;--muted:#687987;--border:#D9E2EA;
  --ok:#287A58;--warn:#AD7620;--danger:#A84545;--info:#2D6FA8;--shadow:0 10px 30px rgba(11,46,89,.08)
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.center{display:grid;place-items:center;min-height:100vh;padding:22px}
.login-card{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:26px;text-align:center}
.logo{width:240px;max-height:200px;object-fit:contain}.login-card h1{font-size:24px;color:var(--navy);margin:8px 0 4px}.login-card p{color:var(--muted);margin:0 0 22px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.btn-primary{background:var(--gold);color:var(--navy)}.btn-primary:hover{background:var(--gold2)}
.btn-secondary{background:#E7EDF3;color:var(--navy)}.btn-danger{background:#F8E7E7;color:var(--danger)}.btn-ok{background:#E8F5EE;color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;margin:10px 0}.field label{font-size:12px;font-weight:800;color:var(--navy)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(26,82,141,.1)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.sep{height:1px;background:var(--border);margin:14px 0}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:14px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{text-align:center;padding:4px 8px 12px}.brand img{width:180px;max-height:150px;object-fit:contain}.brand small{display:block;color:var(--gold2);font-weight:800;letter-spacing:.06em}
.operator-chip{display:flex;gap:10px;align-items:center;background:var(--navy2);border-radius:14px;padding:10px;margin:8px 2px 14px}.avatar{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900}.operator-chip small{color:var(--gold2);font-weight:800}.operator-chip strong{display:block}
.nav{display:flex;flex-direction:column;gap:3px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#fff;border-radius:11px;padding:12px 12px;font-weight:800}.nav button:hover,.nav button.active{background:var(--navy2)}
.sidebar-footer{margin-top:22px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}.content-wrap{min-width:0}.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.topbar strong{color:var(--navy)}.content{padding:24px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.page-head h2{margin:0;color:var(--navy);font-size:28px}.page-head p{margin:4px 0 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(11,46,89,.04)}.card .label{font-size:11px;color:var(--muted);font-weight:900}.card .value{font-size:28px;color:var(--navy);font-weight:900;margin:4px 0}.card .mini{font-size:12px;color:var(--muted)}.accent{height:5px;border-radius:14px 14px 0 0;margin:-16px -16px 13px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px}.panel h3{margin:0 0 4px;color:var(--navy)}.panel .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--border);background:#fff;color:var(--navy);padding:9px 12px;border-radius:10px;font-weight:800}.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}.table th,.table td{padding:11px 10px;border-bottom:1px solid #EDF1F4;text-align:left;font-size:13px}.table th{background:#E8EEF3;color:var(--navy);font-size:12px;position:sticky;top:0}.table tr:last-child td{border-bottom:0}.status{font-weight:800}.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-bad{color:var(--danger)}.s-info{color:var(--info)}.s-muted{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid .wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.listbox{border:1px solid var(--border);border-radius:10px;min-height:90px;padding:8px;background:#FAFCFE}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border-radius:999px;background:#EDF3F8;margin:4px 4px 0 0;font-size:12px}.pill button{border:0;background:transparent;color:var(--danger);font-weight:900;padding:0}.note{white-space:pre-wrap;background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:14px;min-height:290px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.muted{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(7,25,45,.55);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h3{margin:0;color:var(--navy)}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:40;font-weight:700}
.topbar-city{display:none}.mobile-nav{display:none}.mobile-more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mobile-more-grid .btn{min-height:58px;text-align:left;padding:12px}.small-actions{display:flex;gap:6px;flex-wrap:wrap}.small-actions .btn{padding:7px 9px;font-size:12px}.kpi-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEF2F5}.kpi-line:last-child{border-bottom:0}.kpi-line b{color:var(--navy)}
@media (max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.shell{grid-template-columns:220px 1fr}.sidebar{padding-left:8px;padding-right:8px}}
@media (max-width:760px){
  body{background:#F3F6FA;overscroll-behavior-y:none}
  .shell{display:block}.sidebar{display:none}
  .topbar{height:58px;padding:8px 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(11,46,89,.06)}
  .topbar strong{display:block;line-height:1.05;letter-spacing:.04em}.topbar-city{display:block;font-size:13px}.topbar-system{display:none}
  .topbar .muted{margin-left:auto;background:#EAF5EF;color:var(--ok);padding:7px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
  .content{padding:14px 10px calc(92px + env(safe-area-inset-bottom));max-width:none}
  .page-head{display:block;margin-bottom:14px}.page-head h2{font-size:22px;line-height:1.12}.page-head p{font-size:13px;line-height:1.4;margin-top:5px}.page-head>.pill{margin-top:9px;font-size:11px;padding:6px 9px}
  .cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px;border-radius:15px;box-shadow:0 4px 14px rgba(11,46,89,.05)}.card .accent{margin:-13px -13px 11px;height:4px}.card .label{font-size:10px}.card .value{font-size:25px;margin:4px 0 2px}.card .mini{font-size:11px;line-height:1.25}
  .cards .card:nth-child(n+5){grid-column:1/-1}
  .grid2{gap:10px;margin-top:10px}.panel{padding:14px;border-radius:15px}.panel h3{font-size:18px}.panel .sub{font-size:11px;line-height:1.35}
  .form-grid{grid-template-columns:1fr;gap:7px}.form-grid .wide{grid-column:auto}.field{margin:7px 0}.field input,.field select,.field textarea{min-height:44px;padding:10px 11px;border-radius:10px}.field textarea{min-height:92px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 7px;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;white-space:nowrap;padding:9px 11px}
  .actions{gap:7px}.actions .btn{min-height:42px}.row.stack-mobile{flex-direction:column;align-items:stretch}
  .table-wrap{border-radius:11px;-webkit-overflow-scrolling:touch}.table{min-width:620px}.table th,.table td{padding:10px 9px;font-size:12px}
  .login-card{padding:20px;border-radius:22px}.logo{width:190px}
  .modal-backdrop{padding:10px;align-items:end}.modal{width:100%;max-height:88vh;border-radius:20px 20px 14px 14px;padding:16px}.mobile-more-grid{grid-template-columns:1fr 1fr}
  .mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(14px);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(11,46,89,.08);z-index:10;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
  .mobile-nav button{border:0;background:transparent;color:#667684;font-size:9.5px;font-weight:800;padding:5px 2px;border-radius:12px;min-width:0}
  .mobile-nav button span{display:grid;place-items:center;width:34px;height:28px;margin:0 auto 2px;font-size:18px;border-radius:12px}
  .mobile-nav button.active{color:var(--navy)}.mobile-nav button.active span{background:#E8F0F8;color:var(--navy)}
}
@media (max-width:360px){.cards{grid-template-columns:1fr}.cards .card:nth-child(n+5){grid-column:auto}.mobile-more-grid{grid-template-columns:1fr}}

/* Mobile UI v4 — otimizada para celular */
@media (max-width:760px){
  :root{--mobile-pad:12px}
  html,body{width:100%;overflow-x:hidden}
  body{
    background:
      radial-gradient(circle at 100% 0,rgba(215,169,62,.10),transparent 28%),
      linear-gradient(180deg,#F4F7FB 0,#EEF3F8 100%);
  }

  .topbar{
    min-height:68px;
    padding:9px var(--mobile-pad);
    background:linear-gradient(135deg,#0B2E59 0%,#123F73 100%);
    border-bottom:3px solid var(--gold);
    box-shadow:0 6px 20px rgba(11,46,89,.16);
    color:#fff;
  }
  .topbar strong{
    display:flex;
    flex-direction:column;
    gap:2px;
    max-width:58%;
    color:#fff;
  }
  .topbar-city{
    display:block!important;
    font-size:15px;
    font-weight:900;
    letter-spacing:.06em;
    line-height:1.05;
  }
  .topbar-system{
    display:block!important;
    font-size:9px;
    font-weight:700;
    letter-spacing:.08em;
    opacity:.78;
    line-height:1.1;
  }
  .topbar .muted{
    margin-left:auto;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    padding:7px 9px;
    border-radius:999px;
    font-size:10px;
    font-weight:800;
    line-height:1.15;
    box-shadow:none;
  }

  .content{
    padding:16px var(--mobile-pad) calc(94px + env(safe-area-inset-bottom));
  }
  .page-head{
    margin:2px 0 15px;
  }
  .page-head h2{
    font-size:24px;
    font-weight:900;
    letter-spacing:-.02em;
    color:var(--navy);
  }
  .page-head p{
    color:#6D7B88;
    font-size:12.5px;
  }
  .page-head>.pill{
    display:inline-flex;
    margin-top:9px;
    background:#E8EEF5;
    color:var(--navy);
    border:1px solid #D6E0E9;
    font-size:10.5px;
    font-weight:800;
    padding:6px 9px;
    border-radius:999px;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }
  .card{
    position:relative;
    overflow:hidden;
    min-height:112px;
    padding:15px 14px;
    border:1px solid rgba(11,46,89,.08);
    border-radius:18px;
    background:rgba(255,255,255,.96);
    box-shadow:0 7px 20px rgba(11,46,89,.07);
  }
  .card .accent{
    height:5px;
    margin:-15px -14px 12px;
    border-radius:0;
  }
  .card .label{
    font-size:9.5px;
    letter-spacing:.055em;
    color:#758492;
  }
  .card .value{
    font-size:30px;
    line-height:1;
    margin:8px 0 5px;
    letter-spacing:-.03em;
  }
  .card .mini{
    font-size:11px;
    line-height:1.25;
    color:#758492;
  }
  .cards .card:nth-child(5){
    min-height:96px;
    grid-column:1/-1;
  }

  .home-grid{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-top:11px;
  }
  .home-finance-panel{order:-1}
  .panel{
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(11,46,89,.08);
    box-shadow:0 6px 20px rgba(11,46,89,.055);
    background:rgba(255,255,255,.97);
  }
  .panel h3{
    font-size:18px;
    font-weight:900;
    letter-spacing:-.015em;
  }
  .panel .sub{color:#778592}

  .home-finance-panel .kpi-line{
    min-height:42px;
    align-items:center;
    padding:9px 2px;
  }
  .home-finance-panel .kpi-line b{
    font-size:14px;
  }
  .home-finance-panel .small-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }
  .home-finance-panel .small-actions .btn{
    min-height:42px;
    font-size:11px;
    text-align:center;
    padding:8px 6px;
    background:#EDF2F7;
  }

  /* Atividades recentes viram cartões em vez de tabela horizontal. */
  .home-recent{
    border:0;
    overflow:visible;
    background:transparent;
  }
  .home-recent .table{
    display:block;
    min-width:0;
    background:transparent;
  }
  .home-recent thead{display:none}
  .home-recent tbody{display:flex;flex-direction:column;gap:8px}
  .home-recent tr{
    display:grid;
    grid-template-columns:1fr auto;
    gap:3px 10px;
    padding:11px 12px;
    border:1px solid #E4EAF0;
    border-radius:13px;
    background:#FAFCFE;
  }
  .home-recent td{
    display:block;
    border:0;
    padding:0;
    white-space:normal;
    font-size:11px;
  }
  .home-recent td:nth-child(1){
    grid-column:1;
    grid-row:1;
    color:var(--navy);
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .home-recent td:nth-child(2){
    grid-column:1/-1;
    grid-row:2;
    font-size:12px;
    color:var(--text);
    font-weight:700;
  }
  .home-recent td:nth-child(3){
    grid-column:2;
    grid-row:1;
    color:var(--muted);
    text-align:right;
    font-size:10px;
  }
  .home-recent td:nth-child(4){
    grid-column:1/-1;
    grid-row:3;
    font-size:10.5px;
    margin-top:2px;
  }
  .home-recent td.empty{
    grid-column:1/-1;
    padding:14px 4px;
    text-align:center;
    font-size:12px;
    font-weight:500;
  }

  .tabs{
    margin:0 -2px 10px;
    padding:2px 2px 7px;
    scroll-snap-type:x proximity;
  }
  .tabs button{
    scroll-snap-align:start;
    min-height:40px;
    border-radius:12px;
    font-size:11.5px;
    box-shadow:0 2px 8px rgba(11,46,89,.035);
  }

  .table-wrap:not(.home-recent){
    box-shadow:inset -14px 0 18px -18px rgba(11,46,89,.35);
  }

  .mobile-nav{
    min-height:72px;
    gap:2px;
    padding:5px 6px calc(7px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97);
    border-top:1px solid rgba(11,46,89,.08);
    box-shadow:0 -10px 30px rgba(11,46,89,.12);
  }
  .mobile-nav button{
    position:relative;
    min-height:56px;
    color:#778592;
    font-size:9px;
    transition:background .15s ease,color .15s ease,transform .15s ease;
  }
  .mobile-nav button:active{transform:scale(.96)}
  .mobile-nav button span{
    width:38px;
    height:29px;
    font-size:19px;
    margin:0 auto 3px;
  }
  .mobile-nav button.active{
    background:transparent;
    color:var(--navy);
  }
  .mobile-nav button.active span{
    background:#E6EEF7;
    box-shadow:inset 0 0 0 1px rgba(11,46,89,.05);
  }
  .mobile-nav button.active:after{
    content:"";
    position:absolute;
    left:50%;
    bottom:1px;
    width:18px;
    height:3px;
    transform:translateX(-50%);
    border-radius:999px;
    background:var(--gold);
  }

  .modal{
    border-radius:24px 24px 14px 14px;
    box-shadow:0 -18px 50px rgba(7,25,45,.22);
  }
  .mobile-more-grid .btn{
    border:1px solid #E2E9F0;
    background:#F7F9FC;
    border-radius:14px;
  }
}

@media (max-width:390px){
  :root{--mobile-pad:10px}
  .topbar-city{font-size:14px}
  .topbar-system{font-size:8.5px}
  .topbar .muted{font-size:9.5px;padding:6px 7px}
  .page-head h2{font-size:22px}
  .card{padding:13px;min-height:105px}
  .card .accent{margin:-13px -13px 10px}
  .card .value{font-size:27px}
  .panel{padding:13px}
}


/* Configurações, temas e instalação PWA */
.topbar-settings{
  border:1px solid var(--border);background:#fff;color:var(--navy);width:38px;height:38px;
  border-radius:12px;font-size:18px;display:grid;place-items:center;padding:0;margin-left:auto
}
.topbar-settings:hover{background:#F3F6F9}
.settings-section h4{margin:0 0 10px;color:var(--navy);font-size:15px}
.theme-preset-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.theme-preset{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.theme-preset b{font-size:10px}.theme-swatch{display:flex;width:42px;height:22px;border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.theme-swatch i{display:block;flex:1}.field input[type="color"]{padding:4px;height:46px}
html[data-appearance="dark"]{
  --bg:#10161D;--card:#17212B;--text:#EDF3F7;--muted:#9AA9B5;--border:#2C3A46;
  --shadow:0 10px 30px rgba(0,0,0,.24)
}
html[data-appearance="dark"] body{background:#10161D;color:var(--text)}
html[data-appearance="dark"] .content-wrap,
html[data-appearance="dark"] .content{background:#10161D}
html[data-appearance="dark"] .card,
html[data-appearance="dark"] .panel,
html[data-appearance="dark"] .login-card,
html[data-appearance="dark"] .modal,
html[data-appearance="dark"] .table,
html[data-appearance="dark"] .tabs button,
html[data-appearance="dark"] .listbox{background:#17212B;color:var(--text);border-color:var(--border)}
html[data-appearance="dark"] .field input,
html[data-appearance="dark"] .field select,
html[data-appearance="dark"] .field textarea{background:#101820;color:var(--text);border-color:#344552}
html[data-appearance="dark"] .table th{background:#22303C;color:#DCE8F1}
html[data-appearance="dark"] .table td{border-color:#253440}
html[data-appearance="dark"] .btn-secondary{background:#24333F;color:#DDE9F2}
html[data-appearance="dark"] .topbar:not(:has(.topbar-city)){background:#17212B}
html[data-appearance="dark"] .topbar-settings{background:#24333F;color:#fff;border-color:#364755}
html[data-appearance="dark"] .mobile-nav{background:rgba(23,33,43,.98);border-color:#2C3A46}
html[data-appearance="dark"] .mobile-nav button{color:#A6B5C0}
html[data-appearance="dark"] .mobile-nav button.active{color:#fff}
html[data-appearance="dark"] .mobile-nav button.active span{background:#2A3C4C}
html[data-appearance="dark"] .home-recent tr{background:#131C24;border-color:#2C3A46}
html[data-appearance="dark"] .kpi-line{border-color:#293844}
html[data-appearance="dark"] .sep{background:#2C3A46}
html[data-appearance="dark"] .pill{background:#24333F;color:#DDE9F2}
@media (max-width:760px){
  .topbar-settings{margin-left:auto;flex:0 0 36px;width:36px;height:36px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.16)}
  .topbar .muted{margin-left:0}
  .theme-preset-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  html[data-appearance="dark"] body{background:#10161D}
  html[data-appearance="dark"] .topbar-settings{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.16)}
}

@media print{.sidebar,.topbar,.mobile-nav,.actions,.tabs,.no-print{display:none!important}.shell{display:block}.content{padding:0}.panel,.card{box-shadow:none}.note{border:0;min-height:auto}}

/* Ajustes mobile — painel municipal */
@media (max-width:760px){
  body{background:#f3f6fa}
  .content-wrap{width:100%;overflow-x:hidden}
  .topbar{
    min-height:62px;
    padding:10px 14px;
    gap:10px;
    align-items:center;
    box-shadow:0 1px 0 rgba(11,46,89,.06)
  }
  .topbar strong{
    font-size:13px;
    line-height:1.15;
    max-width:46%;
  }
  .topbar .muted{
    font-size:12px;
    text-align:right;
    line-height:1.2;
  }
  .content{
    padding:18px 12px 96px;
    max-width:100%;
  }
  .page-head{
    margin-bottom:14px;
  }
  .page-head h2{
    font-size:25px;
    line-height:1.12;
    margin-bottom:5px;
  }
  .page-head p{
    font-size:13px;
    line-height:1.35;
  }
  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .card{
    border-radius:18px;
    padding:14px;
    min-height:108px;
  }
  .card .label{font-size:10px;letter-spacing:.02em}
  .card .value{font-size:27px;margin:5px 0 2px}
  .card .mini{font-size:11px;line-height:1.25}
  .cards .card:nth-child(5){
    grid-column:1/-1;
    min-height:100px;
  }
  .grid2{
    gap:12px;
    margin-top:12px;
  }
  .panel{
    border-radius:18px;
    padding:15px;
  }
  .panel h3{font-size:19px}
  .panel .sub{font-size:12px;line-height:1.35}
  .table-wrap{
    border-radius:14px;
    -webkit-overflow-scrolling:touch;
  }
  .table{
    min-width:620px;
  }
  .table th,.table td{
    padding:10px 9px;
    font-size:12px;
    white-space:nowrap;
  }
  .tabs{
    gap:6px;
    overflow-x:auto;
    flex-wrap:nowrap;
    padding-bottom:3px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    flex:0 0 auto;
    padding:9px 11px;
    font-size:12px;
  }
  .form-grid{
    grid-template-columns:1fr;
    gap:6px;
  }
  .field{
    margin:7px 0;
  }
  .field input,.field select,.field textarea{
    min-height:46px;
    font-size:16px;
    border-radius:12px;
  }
  .field textarea{min-height:100px}
  .actions{
    gap:7px;
  }
  .actions .btn{
    min-height:42px;
  }
  .btn{
    border-radius:12px;
    padding:10px 12px;
  }
  .mobile-nav{
    grid-template-columns:repeat(5,1fr);
    min-height:68px;
    padding:5px 4px calc(7px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(11,46,89,.09);
  }
  .mobile-nav button{
    min-width:0;
    padding:5px 1px;
    border-radius:10px;
    font-size:10px;
    line-height:1.05;
  }
  .mobile-nav button span{
    font-size:20px;
    line-height:1;
    margin-bottom:4px;
  }
  .mobile-nav button.active{
    background:#eef3f8;
    color:var(--navy);
  }
  .modal-backdrop{
    align-items:end;
    padding:8px;
  }
  .modal{
    width:100%;
    max-height:88vh;
    border-radius:20px 20px 14px 14px;
    padding:16px;
  }
  .toast{
    left:12px;
    right:12px;
    bottom:84px;
    text-align:center;
  }
  .login-card{
    border-radius:22px;
    padding:20px 16px;
  }
  .logo{
    width:170px;
    max-height:160px;
  }
}

@media (max-width:430px){
  .content{padding-left:10px;padding-right:10px}
  .topbar{padding-left:11px;padding-right:11px}
  .topbar strong{font-size:12px}
  .topbar .muted{font-size:11px}
  .cards{gap:8px}
  .card{padding:13px;min-height:104px}
  .card .value{font-size:25px}
  .panel{padding:13px}
  .page-head h2{font-size:23px}
  .mobile-nav button{font-size:9px}
}

</style>

<script>
(() => {
'use strict';
const KEY='bom_regresso_web_v1';
const THEME_KEY='bom_regresso_theme_v1';
let deferredInstallPrompt=null;
const FIREBASE_CONFIG={
  apiKey:'AIzaSyAZRB9eqv2GFqObXfOP_PZDPDg2VSyjyow',
  authDomain:'prefeitura-de-bom-regresso.firebaseapp.com',
  projectId:'prefeitura-de-bom-regresso',
  storageBucket:'prefeitura-de-bom-regresso.firebasestorage.app',
  messagingSenderId:'198816706059',
  appId:'1:198816706059:web:0cc06972a903b13867610e'
};
const SHARED_KEYS=['operators','machinery','implements','appointments','licitations','employees','payments','contracts','finance','trucks','trips'];
let fbAuth=null,fbStore=null,cloudDoc=null,cloudReady=false,applyingCloud=false,cloudUnsub=null;
const todayBR=()=>new Date().toLocaleDateString('pt-BR');
const nowISO=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const val=id=>(document.getElementById(id)?.value||'').trim();
const nval=id=>Number((val(id)||'0').replace(/\./g,'').replace(',','.'))||0;
const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return (p.length>1?p[0][0]+p.at(-1)[0]:p[0].slice(0,2)).toUpperCase()};
const defaults=()=>({
  operators:[], currentOperator:'',
  machinery:[
    {id:uid(),name:'Trator agrícola',category:'Trator',status:'Disponível',notes:''},
    {id:uid(),name:'Patrola',category:'Motoniveladora',status:'Disponível',notes:''},
    {id:uid(),name:'Retroescavadeira',category:'Retroescavadeira',status:'Disponível',notes:''},
    {id:uid(),name:'Escavadeira hidráulica',category:'Escavadeira',status:'Disponível',notes:''},
    {id:uid(),name:'Caminhão caçamba',category:'Caminhão',status:'Disponível',notes:''},
    {id:uid(),name:'Rolo compactador',category:'Compactação',status:'Disponível',notes:''}],
  implements:['Grade','Arado','Plantadeira','Subsolador','Perfurador de solo','Roçadeira','Distribuidor de adubo','Vagão basculante'].map(name=>({id:uid(),name,status:'Disponível',notes:''})),
  appointments:[], licitations:[], employees:[], payments:[], contracts:[], finance:[], trucks:[], trips:[]
});
let db=load(); let page='home'; let sub=''; let selectedImps=[];
function load(){try{const raw=localStorage.getItem(KEY); if(!raw)return defaults(); const d=JSON.parse(raw); return Object.assign(defaults(),d)}catch{return defaults()}}
function persistLocal(){localStorage.setItem(KEY,JSON.stringify(db))}
function cloudPayload(){const out={updatedAt:nowISO()};for(const k of SHARED_KEYS)out[k]=db[k]||[];return out}
function applyCloud(data){const operator=db.currentOperator||'';applyingCloud=true;db=Object.assign(defaults(),data||{});db.currentOperator=operator;persistLocal();applyingCloud=false}
function save(){persistLocal();if(cloudReady&&!applyingCloud&&cloudDoc){cloudDoc.set(cloudPayload(),{merge:true}).catch(err=>{console.error('Falha ao sincronizar Firebase:',err);toast('Não foi possível sincronizar agora. Os dados ficaram salvos neste aparelho.')})}}
function loadingScreen(){const root=document.getElementById('login');document.getElementById('main').classList.add('hidden');root.classList.remove('hidden');root.innerHTML='<div class="login-card"><h1>Prefeitura de Bom Regresso</h1><p>Conectando ao banco de dados compartilhado…</p><div class="muted">☁ Firebase</div></div>'}
async function initCloud(){loadingScreen();try{if(!window.firebase)throw new Error('SDK do Firebase não carregou');firebase.initializeApp(FIREBASE_CONFIG);fbAuth=firebase.auth();fbStore=firebase.firestore();await fbAuth.signInAnonymously();cloudDoc=fbStore.collection('municipio').doc('dados');const snap=await cloudDoc.get();if(snap.exists){applyCloud(snap.data())}else{await cloudDoc.set(cloudPayload())}cloudReady=true;cloudUnsub=cloudDoc.onSnapshot(s=>{if(!s.exists)return;const before=JSON.stringify(cloudPayload());applyCloud(s.data());const after=JSON.stringify(cloudPayload());if(before!==after){if(document.getElementById('main')&&!document.getElementById('main').classList.contains('hidden'))renderPage();else loginScreen()}},err=>{console.error('Listener Firestore:',err);toast('Sincronização em tempo real indisponível.')});loginScreen()}catch(err){console.error('Firebase indisponível:',err);cloudReady=false;loginScreen();setTimeout(()=>toast('Firebase indisponível. Modo local ativado.'),300)}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2300)}
function statusClass(s){s=String(s||'').toLowerCase();if(/concl|pago|ativo|disponível|confirmad/.test(s))return's-ok';if(/aguard|pend|andamento|manutenção|agend/.test(s))return's-warn';if(/cancel|indispon|inativo/.test(s))return's-bad';if(/receita/.test(s))return's-ok';return's-info'}
const THEME_PRESETS={
  classic:{primary:'#0B2E59',accent:'#D7A93E'},
  green:{primary:'#145A45',accent:'#D7A93E'},
  wine:{primary:'#6B2031',accent:'#D7A93E'},
  royal:{primary:'#3E3A86',accent:'#E4B441'},
  graphite:{primary:'#263238',accent:'#C89B3C'}
};
function safeHex(v,fallback){return /^#[0-9a-f]{6}$/i.test(String(v||''))?v:fallback}
function shade(hex,percent){const h=safeHex(hex,'#0B2E59').slice(1),n=parseInt(h,16),amt=Math.round(2.55*percent),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function getTheme(){try{return Object.assign({primary:'#0B2E59',accent:'#D7A93E',appearance:'light'},JSON.parse(localStorage.getItem(THEME_KEY)||'{}'))}catch{return{primary:'#0B2E59',accent:'#D7A93E',appearance:'light'}}}
function applyTheme(theme=getTheme()){
  const primary=safeHex(theme.primary,'#0B2E59'),accent=safeHex(theme.accent,'#D7A93E');
  const root=document.documentElement;
  root.style.setProperty('--navy',primary);
  root.style.setProperty('--navy2',shade(primary,10));
  root.style.setProperty('--navy3',shade(primary,20));
  root.style.setProperty('--gold',accent);
  root.style.setProperty('--gold2',shade(accent,18));
  const dark=theme.appearance==='dark'||(theme.appearance==='auto'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches);
  root.dataset.appearance=dark?'dark':'light';
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=primary;
}
function saveTheme(theme){localStorage.setItem(THEME_KEY,JSON.stringify(theme));applyTheme(theme)}
function setThemePreset(name){
  const p=THEME_PRESETS[name]||THEME_PRESETS.classic;
  const a=document.getElementById('themePrimary'),b=document.getElementById('themeAccent');
  if(a)a.value=p.primary;if(b)b.value=p.accent;
  previewTheme();
}
function previewTheme(){
  applyTheme({primary:document.getElementById('themePrimary')?.value||'#0B2E59',accent:document.getElementById('themeAccent')?.value||'#D7A93E',appearance:document.getElementById('themeAppearance')?.value||'light'});
}
function saveThemeSettings(){
  const theme={primary:document.getElementById('themePrimary')?.value||'#0B2E59',accent:document.getElementById('themeAccent')?.value||'#D7A93E',appearance:document.getElementById('themeAppearance')?.value||'light'};
  saveTheme(theme);closeModal();toast('Tema atualizado.');
}
function resetTheme(){saveTheme({primary:'#0B2E59',accent:'#D7A93E',appearance:'light'});closeModal();toast('Tema padrão restaurado.')}
function isStandalone(){return window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true}
function openSettings(){
  const t=getTheme();
  const presets=[['classic','#0B2E59','#D7A93E','Clássico'],['green','#145A45','#D7A93E','Verde'],['wine','#6B2031','#D7A93E','Vinho'],['royal','#3E3A86','#E4B441','Real'],['graphite','#263238','#C89B3C','Grafite']];
  showModal('Configurações',`<div class="settings-section"><h4>🎨 Tema do sistema</h4><div class="theme-preset-grid">${presets.map(([k,p,a,n])=>`<button class="theme-preset" onclick="App.setThemePreset('${k}')"><span class="theme-swatch"><i style="background:${p}"></i><i style="background:${a}"></i></span><b>${n}</b></button>`).join('')}</div><div class="form-grid" style="margin-top:10px"><div class="field"><label>Cor principal</label><input id="themePrimary" type="color" value="${safeHex(t.primary,'#0B2E59')}" oninput="App.previewTheme()"></div><div class="field"><label>Cor de destaque</label><input id="themeAccent" type="color" value="${safeHex(t.accent,'#D7A93E')}" oninput="App.previewTheme()"></div><div class="field wide"><label>Aparência</label><select id="themeAppearance" onchange="App.previewTheme()"><option value="light" ${t.appearance==='light'?'selected':''}>Claro</option><option value="dark" ${t.appearance==='dark'?'selected':''}>Escuro</option><option value="auto" ${t.appearance==='auto'?'selected':''}>Automático (celular)</option></select></div></div><div class="actions"><button class="btn btn-secondary" onclick="App.resetTheme()">Restaurar padrão</button><button class="btn btn-primary" onclick="App.saveThemeSettings()">Salvar tema</button></div></div><div class="sep"></div><div class="settings-section"><h4>📲 Aplicativo no celular</h4><p class="muted">Instale o sistema na tela inicial para abrir como aplicativo, sem precisar procurar o site no navegador.</p><button class="btn btn-primary install-btn" style="width:100%;min-height:48px" onclick="App.installApp()">⬇ ${isStandalone()?'Aplicativo instalado':'Instalar Prefeitura de Bom Regresso'}</button></div>`)
}
async function installApp(){
  if(isStandalone()){toast('O aplicativo já está instalado neste aparelho.');return}
  if(deferredInstallPrompt){
    const p=deferredInstallPrompt;deferredInstallPrompt=null;
    p.prompt();
    const result=await p.userChoice.catch(()=>({outcome:'dismissed'}));
    if(result.outcome==='accepted')toast('Instalação iniciada.');
    return;
  }
  showModal('Instalar aplicativo',`<p>Se o botão automático não apareceu, abra este site no <b>Chrome</b> e use o menu <b>⋮</b>.</p><div class="panel" style="box-shadow:none"><b>Android / Chrome</b><p class="muted" style="margin-bottom:0">⋮ → <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p></div><p class="muted">Depois disso, o sistema aparecerá junto dos outros aplicativos do celular.</p>`);
}

function addOperator(){showModal('Cadastrar operador',`<div class="field"><label>Nome do operador</label><input id="opName" placeholder="Ex.: Vitor"></div><div class="actions"><button class="btn btn-primary" onclick="App.saveOperator()">Salvar operador</button></div>`,()=>document.getElementById('opName').focus())}
function saveOperator(){const name=val('opName');if(!name)return toast('Digite o nome do operador.');db.operators.push({id:uid(),name,active:true});save();closeModal();loginScreen();toast('Operador cadastrado.')}
function manageOperators(){const rows=db.operators.map(o=>`<tr><td>${esc(o.name)}</td><td><span class="status ${o.active!==false?'s-ok':'s-muted'}">${o.active!==false?'Ativo':'Inativo'}</span></td><td class="small-actions"><button class="btn btn-secondary" onclick="App.renameOperator('${o.id}')">Editar</button><button class="btn btn-danger" onclick="App.toggleOperator('${o.id}')">${o.active!==false?'Desativar':'Ativar'}</button></td></tr>`).join('');showModal('Editar perfis',`<button class="btn btn-primary" onclick="App.closeModal();App.addOperator()">＋ Novo operador</button><div class="table-wrap" style="margin-top:12px"><table class="table" style="min-width:0"><thead><tr><th>Nome</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">Nenhum perfil.</td></tr>'}</tbody></table></div>`)}
function renameOperator(id){const o=db.operators.find(x=>x.id===id);if(!o)return;showModal('Editar operador',`<div class="field"><label>Nome</label><input id="renameOp" value="${esc(o.name)}"></div><div class="actions"><button class="btn btn-primary" onclick="App.saveRenameOperator('${id}')">Salvar</button></div>`)}
function saveRenameOperator(id){const o=db.operators.find(x=>x.id===id);const name=val('renameOp');if(o&&name){const old=o.name;o.name=name;if(db.currentOperator===old)db.currentOperator=name;save();closeModal();loginScreen();toast('Perfil atualizado.')}}
function toggleOperator(id){const o=db.operators.find(x=>x.id===id);if(o){o.active=o.active===false;save();manageOperators()}}
function enter(){const id=val('loginOp');const o=db.operators.find(x=>x.id===id);if(!o)return;db.currentOperator=o.name;save();page='home';render()}
function logout(){db.currentOperator='';save();loginScreen()}
function navItems(){return[

function card(t,v,m,a='var(--navy)'){return`<div class="card"><div class="accent" style="background:${a}"></div><div class="label">${t}</div><div class="value">${v}</div><div class="mini">${m}</div></div>`}
function home(c){const openA=db.appointments.filter(x=>!['Concluído','Cancelado'].includes(x.status)).length, pendL=db.licitations.filter(x=>x.status==='Aguardando confirmação').length, emp=db.employees.filter(x=>x.status!=='Inativo').length, ctr=db.contracts.filter(x=>!['Encerrado','Cancelado'].includes(x.status)).length, tr=db.trips.filter(x=>!['Concluída','Cancelada'].includes(x.status)).length;const rev=db.finance.filter(x=>x.type==='Receita'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0), exp=db.finance.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0);
  const recent=[...db.appointments.map(x=>({sector:'Agricultura',txt:`${x.producer||'Agendamento'} • ${x.machine||'-'}`,date:x.date,status:x.status,at:x.createdAt})),...db.licitations.map(x=>({sector:'Licitação',txt:x.title||'Sem título',date:x.date,status:x.status,at:x.createdAt})),...db.trips.map(x=>({sector:'Frota',txt:`${x.origin||'-'} → ${x.destination||'-'}`,date:x.date,status:x.status,at:x.createdAt}))].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,10);
  c.innerHTML=head('Painel Municipal','Visão geral dos setores e registros.',`Operador: ${esc(db.currentOperator)}`)+`<div class="cards">${card('AGRICULTURA',openA,'serviços em aberto','var(--ok)')}${card('LICITAÇÕES',pendL,'aguardando confirmação','var(--gold)')}${card('RH',emp,'servidores cadastrados','var(--info)')}${card('CONTRATOS',ctr,'ativos / abertos','var(--navy3)')}${card('VIAGENS',tr,'em aberto','var(--warn)')}</div><div class="grid2 home-grid"><div class="panel home-activity-panel"><h3>Atividades recentes</h3><div class="sub">Últimos registros dos principais setores.</div><div class="table-wrap home-recent"><table class="table"><thead><tr><th>Setor</th><th>Registro</th><th>Data</th><th>Status</th></tr></thead><tbody>${recent.map(r=>`<tr><td>${esc(r.sector)}</td><td>${esc(r.txt)}</td><td>${esc(r.date||'-')}</td><td class="status ${statusClass(r.status)}">${esc(r.status||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhuma atividade ainda.</td></tr>'}</tbody></table></div></div><div class="panel home-finance-panel"><h3>Resumo financeiro</h3><div class="sub">Lançamentos marcados como pagos.</div><div class="kpi-line"><span>Receitas</span><b class="s-ok">${money(rev)}</b></div><div class="kpi-line"><span>Despesas</span><b class="s-bad">${money(exp)}</b></div><div class="kpi-line"><span>Saldo</span><b>${money(rev-exp)}</b></div><div class="sep"></div><div class="small-actions"><button class="btn btn-secondary" onclick="App.go('agri','new')">＋ Agendamento</button><button class="btn btn-secondary" onclick="App.go('licit','send')">＋ Licitação</button><button class="btn btn-secondary" onclick="App.go('finance','new')">＋ Lançamento</button><button class="btn btn-secondary" onclick="App.go('fleet','trip')">＋ Viagem</button></div></div></div>`}
function tabs(items,active){return`<div class="tabs">${items.map(([k,label])=>`<button class="${active===k?'active':''}" onclick="App.go('${page}','${k}')">${label}</button>`).join('')}</div>`}
function agri(c){const t=sub||'list';c.innerHTML=head('Agricultura','Agendamentos, máquinas e implementos municipais.')+tabs([['list','📋 Agendamentos'],['new','＋ Novo agendamento'],['machines','🚜 Máquinas'],['implements','⚙ Implementos']],t)+`<div id="subview"></div>`; const v=document.getElementById('subview');if(t==='new')agriNew(v);else if(t==='machines')assets(v,'machinery');else if(t==='implements')assets(v,'implements');else agriList(v)}
function agriList(v){v.innerHTML=`<div class="panel"><div class="row wrap"><input id="agSearch" class="grow" placeholder="Pesquisar produtor, localidade ou máquina" style="padding:10px;border:1px solid var(--border);border-radius:10px"><button class="btn btn-secondary" onclick="App.filterAgri()">Pesquisar</button></div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Data</th><th>Produtor</th><th>Localidade</th><th>Máquina</th><th>Horas</th><th>Operador</th><th>Status</th><th>Ações</th></tr></thead><tbody id="agBody"></tbody></table></div></div>`;filterAgri()}
function filterAgri(){const q=(val('agSearch')||'').toLowerCase();const rows=db.appointments.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));document.getElementById('agBody').innerHTML=rows.map(x=>`<tr><td>${esc(x.date||'-')}</td><td>${esc(x.producer||'-')}</td><td>${esc(x.locality||'-')}</td><td>${esc(x.machine||'-')}</td><td>${esc(x.hours||0)}</td><td>${esc(x.operator||'-')}</td><td class="status ${statusClass(x.status)}">${esc(x.status)}</td><td class="small-actions"><button class="btn btn-ok" onclick="App.setAgStatus('${x.id}','Concluído')">Concluir</button><button class="btn btn-secondary" onclick="App.setAgStatus('${x.id}','Em andamento')">Andamento</button><button class="btn btn-secondary" onclick="App.noteFrom('appointment','${x.id}')">Nota</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum agendamento.</td></tr>'}
function setAgStatus(id,s){const x=db.appointments.find(r=>r.id===id);if(x){x.status=s;save();filterAgri();toast('Status atualizado.')}}
function agriNew(v){selectedImps=[];const ms=db.machinery.filter(x=>x.status==='Disponível'), im=db.implements.filter(x=>x.status==='Disponível');v.innerHTML=`<div class="panel"><h3>Novo agendamento</h3><div class="sub">Preencha somente o que fizer sentido. Campos vazios recebem valores simples.</div><div class="form-grid"><div class="field"><label>Nome do produtor</label><input id="aProducer" placeholder="Opcional"></div><div class="field"><label>Localidade</label><input id="aLoc" placeholder="Opcional"></div><div class="field"><label>Máquina</label><select id="aMachine"><option value="">Sem máquina definida</option>${ms.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Implemento</label><div class="row"><select id="aImp" class="grow"><option value="">Selecione</option>${im.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select><button class="btn btn-secondary" onclick="App.addImp()">＋</button></div></div><div class="wide"><div id="impPills" class="listbox"><span class="muted">Nenhum implemento adicionado.</span></div></div><div class="field"><label>Data</label><input id="aDate" value="${todayBR()}"></div><div class="field"><label>Horas</label><input id="aHours" type="number" step="0.5" placeholder="0"></div><div class="field wide"><label>Observações</label><textarea id="aNotes" rows="3"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="App.saveAppointment()">Salvar agendamento</button></div></div>`}
function addImp(){const x=val('aImp');if(x&&!selectedImps.includes(x)){selectedImps.push(x);drawImps()}}
function drawImps(){const r=document.getElementById('impPills');if(!r)return;r.innerHTML=selectedImps.length?selectedImps.map((x,i)=>`<span class="pill">${esc(x)} <button onclick="App.rmImp(${i})">×</button></span>`).join(''):'<span class="muted">Nenhum implemento adicionado.</span>'}
function rmImp(i){selectedImps.splice(i,1);drawImps()}
function saveAppointment(){db.appointments.push({id:uid(),producer:val('aProducer')||'Sem nome informado',locality:val('aLoc'),machine:val('aMachine'),implements:[...selectedImps],date:val('aDate')||todayBR(),hours:nval('aHours'),notes:val('aNotes'),operator:db.currentOperator,status:'Agendado',createdAt:nowISO()});save();toast('Agendamento salvo.');go('agri','list')}
function assets(v,type){const arr=db[type], isM=type==='machinery';v.innerHTML=`<div class="panel"><div class="row wrap"><h3 class="grow">${isM?'Maquinários':'Implementos'}</h3><button class="btn btn-primary" onclick="App.assetForm('${type}')">＋ Adicionar</button></div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Nome</th>${isM?'<th>Categoria</th>':''}<th>Status</th><th>Observações</th><th>Ações</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.name)}</td>${isM?`<td>${esc(x.category||'-')}</td>`:''}<td class="status ${statusClass(x.status)}">${esc(x.status)}</td><td>${esc(x.notes||'-')}</td><td><button class="btn btn-secondary" onclick="App.assetForm('${type}','${x.id}')">Editar</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">Nenhum registro.</td></tr>`}</tbody></table></div></div>`}
function assetForm(type,id=''){const x=db[type].find(r=>r.id===id)||{};showModal(id?'Editar item':'Adicionar item',`<div class="field"><label>Nome</label><input id="assetName" value="${esc(x.name||'')}"></div>${type==='machinery'?`<div class="field"><label>Categoria</label><input id="assetCat" value="${esc(x.category||'')}"></div>`:''}<div class="field"><label>Status</label><select id="assetStatus">${['Disponível','Em manutenção','Indisponível'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Observações</label><textarea id="assetNotes">${esc(x.notes||'')}</textarea></div><div class="actions"><button class="btn btn-primary" onclick="App.saveAsset('${type}','${id}')">Salvar</button></div>`)}
function saveAsset(type,id){let x=db[type].find(r=>r.id===id);if(!x){x={id:uid()};db[type].push(x)}x.name=val('assetName')||(type==='machinery'?'Maquinário sem nome':'Implemento sem nome');if(type==='machinery')x.category=val('assetCat');x.status=val('assetStatus')||'Disponível';x.notes=val('assetNotes');save();closeModal();renderPage();toast('Cadastro salvo.')}
function licit(c){const t=sub||'send';c.innerHTML=head('Licitações','Fluxo fictício e simplificado de envio e confirmação.')+tabs([['send','📨 Enviar'],['confirm','✓ Confirmar'],['history','📋 Histórico']],t)+`<div id="subview"></div>`;const v=document.getElementById('subview');if(t==='confirm')licitConfirm(v);else if(t==='history')licitHistory(v);else licitSend(v)}
function licitSend(v){v.innerHTML=`<div class="panel"><h3>Enviar licitação</h3><div class="sub">Somente nome e data são suficientes; os demais campos são opcionais.</div><div class="form-grid"><div class="field"><label>Nome da licitação</label><input id="lTitle"></div><div class="field"><label>Data</label><input id="lDate" value="${todayBR()}"></div><div class="field wide"><label>Resumo / itens</label><textarea id="lItem" rows="3"></textarea></div><div class="field wide"><label>Observações</label><textarea id="lNotes" rows="3"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="App.saveLicit()">Enviar licitação</button></div></div>`}
function saveLicit(){db.licitations.push({id:uid(),title:val('lTitle')||'Licitação sem título',date:val('lDate')||todayBR(),item:val('lItem'),notes:val('lNotes'),status:'Aguardando confirmação',sentBy:db.currentOperator,confirmedBy:'',confirmedAt:'',createdAt:nowISO()});save();toast('Licitação enviada.');go('licit','confirm')}
function licitConfirm(v){const rows=db.licitations.filter(x=>x.status==='Aguardando confirmação');v.innerHTML=`<div class="panel"><h3>Aguardando confirmação</h3><div class="sub">Selecione uma licitação e use o botão Confirmar.</div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>Data</th><th>Nome</th><th>Resumo</th><th>Enviado por</th></tr></thead><tbody>${rows.map(x=>`<tr><td><input type="radio" name="licsel" value="${x.id}"></td><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.item||'-')}</td><td>${esc(x.sentBy)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma licitação pendente.</td></tr>'}</tbody></table></div><div class="actions"><button class="btn btn-primary" onclick="App.confirmLicit()">✓ CONFIRMAR LICITAÇÃO</button></div></div>`}
function confirmLicit(){const id=document.querySelector('input[name=licsel]:checked')?.value;if(!id)return toast('Selecione uma licitação.');const x=db.licitations.find(r=>r.id===id);x.status='Confirmada';x.confirmedBy=db.currentOperator;x.confirmedAt=nowISO();save();renderPage();toast('Licitação confirmada.')}
function licitHistory(v){v.innerHTML=`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Nome</th><th>Status</th><th>Enviado por</th><th>Confirmado por</th><th></th></tr></thead><tbody>${db.licitations.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td class="status ${statusClass(x.status)}">${esc(x.status)}</td><td>${esc(x.sentBy)}</td><td>${esc(x.confirmedBy||'-')}</td><td><button class="btn btn-secondary" onclick="App.noteFrom('licitation','${x.id}')">Nota</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma licitação.</td></tr>'}</tbody></table></div></div>`}
function hr(c){const t=sub||'employees';c.innerHTML=head('RH / Servidores','Cadastros simples e pagamentos fictícios.')+tabs([['employees','👥 Servidores'],['new','＋ Cadastrar'],['payments','💵 Pagamentos']],t)+`<div id="subview"></div>`;const v=document.getElementById('subview');if(t==='new')employeeForm(v);else if(t==='payments')paymentList(v);else employeeList(v)}
function employeeList(v){v.innerHTML=`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Função</th><th>Setor</th><th>Admissão</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.employees.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.role||'-')}</td><td>${esc(x.department||'-')}</td><td>${esc(x.admission||'-')}</td><td class="status ${statusClass(x.status)}">${esc(x.status)}</td><td class="small-actions"><button class="btn btn-primary" onclick="App.paymentForm('${x.id}')">Pagar</button><button class="btn btn-secondary" onclick="App.employeeModal('${x.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum servidor cadastrado.</td></tr>'}</tbody></table></div></div>`}
function employeeForm(v){v.innerHTML=`<div class="panel"><h3>Cadastrar servidor</h3><div class="sub">Cadastro fictício: use somente os campos que desejar.</div><div class="form-grid"><div class="field"><label>Nome</label><input id="eName"></div><div class="field"><label>Função</label><input id="eRole"></div><div class="field"><label>Setor</label><input id="eDept"></div><div class="field"><label>Data de admissão</label><input id="eAdm" value="${todayBR()}"></div><div class="field"><label>Status</label><select id="eStatus"><option>Ativo</option><option>Férias</option><option>Inativo</option></select></div><div class="field wide"><label>Observações</label><textarea id="eNotes"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="App.saveEmployee()">Salvar servidor</button></div></div>`}
function saveEmployee(){db.employees.push({id:uid(),name:val('eName')||'Servidor sem nome',role:val('eRole'),department:val('eDept'),admission:val('eAdm')||todayBR(),status:val('eStatus')||'Ativo',notes:val('eNotes'),createdAt:nowISO()});save();toast('Servidor salvo.');go('hr','employees')}
function employeeModal(id){const x=db.employees.find(r=>r.id===id);if(!x)return;showModal('Editar servidor',`<div class="field"><label>Nome</label><input id="emName" value="${esc(x.name)}"></div><div class="field"><label>Função</label><input id="emRole" value="${esc(x.role||'')}"></div><div class="field"><label>Setor</label><input id="emDept" value="${esc(x.department||'')}"></div><div class="field"><label>Status</label><select id="emStatus">${['Ativo','Férias','Inativo'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions"><button class="btn btn-primary" onclick="App.saveEmployeeEdit('${id}')">Salvar</button></div>`)}
function saveEmployeeEdit(id){const x=db.employees.find(r=>r.id===id);if(x){x.name=val('emName')||x.name;x.role=val('emRole');x.department=val('emDept');x.status=val('emStatus')||'Ativo';save();closeModal();renderPage();toast('Servidor atualizado.')}}
function paymentForm(empId=''){if(!db.employees.length)return toast('Cadastre um servidor primeiro.');const opts=db.employees.map(e=>`<option value="${e.id}" ${e.id===empId?'selected':''}>${esc(e.name)}</option>`).join('');showModal('Fazer pagamento',`<div class="field"><label>Servidor</label><select id="pEmp">${opts}</select></div><div class="field"><label>Data</label><input id="pDate" value="${todayBR()}"></div><div class="field"><label>Referência</label><input id="pRef" placeholder="Ex.: 09/2026"></div><div class="field"><label>Valor</label><input id="pValue" placeholder="0,00"></div><div class="field"><label>Observações</label><textarea id="pNotes"></textarea></div><div class="actions"><button class="btn btn-primary" onclick="App.savePayment()">Registrar e gerar nota</button></div>`)}
function savePayment(){const emp=db.employees.find(e=>e.id===val('pEmp'));if(!emp)return toast('Selecione um servidor.');const p={id:uid(),employeeId:emp.id,employeeName:emp.name,role:emp.role,department:emp.department,date:val('pDate')||todayBR(),reference:val('pRef'),value:nval('pValue'),notes:val('pNotes'),operator:db.currentOperator,createdAt:nowISO()};db.payments.push(p);db.finance.push({id:uid(),date:p.date,type:'Despesa',category:'Pagamento de servidor',description:`Pagamento - ${emp.name}`,value:p.value,status:'Pago',notes:p.notes,operator:db.currentOperator,createdAt:nowISO()});save();closeModal();toast('Pagamento registrado.');noteFrom('payment',p.id)}
function paymentList(v){v.innerHTML=`<div class="panel"><div class="row wrap"><h3 class="grow">Pagamentos</h3><button class="btn btn-primary" onclick="App.paymentForm()">＋ Fazer pagamento</button></div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Data</th><th>Servidor</th><th>Referência</th><th>Valor</th><th>Operador</th><th></th></tr></thead><tbody>${db.payments.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.employeeName)}</td><td>${esc(x.reference||'-')}</td><td>${money(x.value)}</td><td>${esc(x.operator)}</td><td><button class="btn btn-secondary" onclick="App.noteFrom('payment','${x.id}')">Nota</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum pagamento.</td></tr>'}</tbody></table></div></div>`}
function contracts(c){const t=sub||'list';c.innerHTML=head('Contratos','Controle simplificado de contratos fictícios.')+tabs([['list','📋 Contratos'],['new','＋ Novo contrato']],t)+`<div id="subview"></div>`;const v=document.getElementById('subview');if(t==='new'){v.innerHTML=`<div class="panel"><div class="form-grid"><div class="field"><label>Número / identificação</label><input id="cNum"></div><div class="field"><label>Contratado</label><input id="cWho"></div><div class="field wide"><label>Objeto</label><input id="cObj"></div><div class="field"><label>Início</label><input id="cStart" value="${todayBR()}"></div><div class="field"><label>Fim</label><input id="cEnd"></div><div class="field"><label>Valor</label><input id="cVal"></div><div class="field"><label>Status</label><select id="cStatus"><option>Ativo</option><option>Vigente</option><option>Encerrado</option><option>Cancelado</option></select></div><div class="field wide"><label>Observações</label><textarea id="cNotes"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="App.saveContract()">Salvar contrato</button></div></div>`}else v.innerHTML=`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Nº</th><th>Contratado</th><th>Objeto</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${db.contracts.slice().reverse().map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.contractor)}</td><td>${esc(x.object||'-')}</td><td>${money(x.value)}</td><td class="status ${statusClass(x.status)}">${esc(x.status)}</td><td><button class="btn btn-secondary" onclick="App.noteFrom('contract','${x.id}')">Nota</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum contrato.</td></tr>'}</tbody></table></div></div>`}
function saveContract(){db.contracts.push({id:uid(),number:val('cNum')||`CTR-${db.contracts.length+1}`,contractor:val('cWho')||'Não informado',object:val('cObj'),start:val('cStart')||todayBR(),end:val('cEnd'),value:nval('cVal'),status:val('cStatus')||'Ativo',notes:val('cNotes'),operator:db.currentOperator,createdAt:nowISO()});save();toast('Contrato salvo.');go('contracts','list')}
function finance(c){const t=sub||'list';const rev=db.finance.filter(x=>x.type==='Receita'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0),exp=db.finance.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0);c.innerHTML=head('Finanças','Receitas, despesas e saldo fictício.')+`<div class="cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">${card('RECEITAS',money(rev),'pagas','var(--ok)')}${card('DESPESAS',money(exp),'pagas','var(--danger)')}${card('SALDO',money(rev-exp),'atual','var(--navy)')}</div>`+tabs([['list','📋 Lançamentos'],['new','＋ Novo lançamento']],t)+`<div id="subview"></div>`;const v=document.getElementById('subview');if(t==='new')v.innerHTML=`<div class="panel"><div class="form-grid"><div class="field"><label>Data</label><input id="fDate" value="${todayBR()}"></div><div class="field"><label>Tipo</label><select id="fType"><option>Receita</option><option>Despesa</option></select></div><div class="field"><label>Categoria</label><input id="fCat"></div><div class="field"><label>Valor</label><input id="fVal"></div><div class="field wide"><label>Descrição</label><input id="fDesc"></div><div class="field"><label>Status</label><select id="fStatus"><option>Pago</option><option>Pendente</option></select></div><div class="field wide"><label>Observações</label><textarea id="fNotes"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="App.saveFinance()">Salvar lançamento</button></div></div>`;else v.innerHTML=`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead><tbody>${db.finance.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td class="status ${statusClass(x.type)}">${esc(x.type)}</td><td>${esc(x.category||'-')}</td><td>${esc(x.description||'-')}</td><td>${money(x.value)}</td><td class="status ${statusClass(x.status)}">${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum lançamento.</td></tr>'}</tbody></table></div></div>`}
function saveFinance(){db.finance.push({id:uid(),date:val('fDate')||todayBR(),type:val('fType')||'Receita',category:val('fCat')||'Geral',description:val('fDesc')||'Sem descrição',value:nval('fVal'),status:val('fStatus')||'Pago',notes:val('fNotes'),operator:db.currentOperator,createdAt:nowISO()});save();toast('Lançamento salvo.');go('finance','list')}
function fleet(c){const t=sub||'trips';c.innerHTML=head('Frota e Viagens','Caminhões e viagens em áreas separadas.')+tabs([['trips','🚚 Viagens'],['trip','＋ Registrar viagem'],['trucks','🔧 Caminhões'],['truck','＋ Cadastrar caminhão']],t)+`<div id="subview"></div>`;const v=document.getElementById('subview');if(t==='trip')tripForm(v);else if(t==='trucks')truckList(v);else if(t==='truck')truckForm(v);else tripList(v)}
function truckList(v){v.innerHTML=`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Identificação</th><th>Modelo</th><th>Status</th><th>KM</th><th></th></tr></thead><tbody>${db.trucks.map(x=>`<tr><td>${esc(x.plate)}</td><td>${esc(x.model||'-')}</td><td class="status ${statusClass(x.status)}">${esc(x.status)}</td><td>${esc(x.odometer||0)}</td><td><button class="btn btn-secondary" onclick="App.noteFrom('truck','${x.id}')">Nota</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum caminhão cadastrado.</td></tr>'}</tbody></table></div></div>`}
function truckForm(v){v.innerHTML=`<div class="panel"><h3>Cadastrar caminhão</h3><div class="form-grid"><div class="field"><label>Placa / identificação</label><input id="tPlate"></div><div class="field"><label>Modelo</label><input id="tModel"></div><div class="field"><label>Status</label><select id="tStatus"><option>Disponível</option><option>Em manutenção</option><option>Indisponível</option></select></div><div class="field"><label>Quilometragem</label><input id="tKm"></div><div class="field wide"><label>Observações</label><textarea id="tNotes"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="App.saveTruck()">Salvar caminhão</button></div></div>`}
function saveTruck(){db.trucks.push({id:uid(),plate:val('tPlate')||`CAM-${db.trucks.length+1}`,model:val('tModel'),status:val('tStatus')||'Disponível',odometer:nval('tKm'),notes:val('tNotes'),createdAt:nowISO()});save();toast('Caminhão salvo.');go('fleet','trucks')}
function tripList(v){v.innerHTML=`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Caminhão</th><th>Motorista</th><th>Origem</th><th>Destino</th><th>Carga / motivo</th><th>Status</th><th></th></tr></thead><tbody>${db.trips.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.truck||'-')}</td><td>${esc(x.driver||'-')}</td><td>${esc(x.origin||'-')}</td><td>${esc(x.destination||'-')}</td><td>${esc(x.cargo||'-')}</td><td class="status ${statusClass(x.status)}">${esc(x.status)}</td><td class="small-actions"><button class="btn btn-ok" onclick="App.setTripStatus('${x.id}','Concluída')">Concluir</button><button class="btn btn-secondary" onclick="App.noteFrom('trip','${x.id}')">Nota</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma viagem.</td></tr>'}</tbody></table></div></div>`}
function tripForm(v){v.innerHTML=`<div class="panel"><h3>Registrar viagem</h3><div class="sub">O cadastro de caminhão fica em outra aba; este formulário registra somente a viagem.</div><div class="form-grid"><div class="field"><label>Data</label><input id="rDate" value="${todayBR()}"></div><div class="field"><label>Caminhão</label><select id="rTruck"><option value="">Sem caminhão definido</option>${db.trucks.map(x=>`<option>${esc(x.plate)}${x.model?' - '+esc(x.model):''}</option>`).join('')}</select></div><div class="field"><label>Motorista</label><input id="rDriver"></div><div class="field"><label>Status</label><select id="rStatus"><option>Agendada</option><option>Em andamento</option><option>Concluída</option><option>Cancelada</option></select></div><div class="field"><label>Origem</label><input id="rOrigin"></div><div class="field"><label>Destino</label><input id="rDest"></div><div class="field wide"><label>Carga / motivo</label><input id="rCargo"></div><div class="field"><label>KM inicial</label><input id="rStart"></div><div class="field"><label>KM final</label><input id="rEnd"></div><div class="field wide"><label>Observações</label><textarea id="rNotes"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="App.saveTrip()">Salvar viagem</button></div></div>`}
function saveTrip(){db.trips.push({id:uid(),date:val('rDate')||todayBR(),truck:val('rTruck'),driver:val('rDriver'),origin:val('rOrigin'),destination:val('rDest'),cargo:val('rCargo'),startKm:nval('rStart'),endKm:nval('rEnd'),status:val('rStatus')||'Agendada',notes:val('rNotes'),operator:db.currentOperator,createdAt:nowISO()});save();toast('Viagem salva.');go('fleet','trips')}
function setTripStatus(id,s){const x=db.trips.find(r=>r.id===id);if(x){x.status=s;save();renderPage();toast('Status atualizado.')}}
function notes(c){c.innerHTML=head('Notas e Resumos','Geração automática de documentos fictícios com os dados cadastrados.')+`<div class="grid2"><div class="panel"><h3>Gerar nota</h3><div class="field"><label>Tipo de nota</label><select id="noteType" onchange="App.refreshNoteTargets()"><option value="general">Resumo geral da prefeitura</option><option value="finance">Resumo de saldo</option><option value="trip">Viagem</option><option value="appointment">Agendamento da Agricultura</option><option value="licitation">Licitação</option><option value="payment">Pagamento de servidor</option><option value="contract">Contrato</option><option value="truck">Caminhão</option></select></div><div class="field"><label>Registro</label><select id="noteTarget"><option value="">Não se aplica</option></select></div><div class="actions" style="justify-content:flex-start"><button class="btn btn-primary" onclick="App.generateSelectedNote()">Gerar nota</button></div></div><div class="panel"><h3>Documento</h3><div class="sub">Pode copiar, imprimir ou salvar em TXT.</div><div id="noteBox" class="note">Selecione um tipo de nota.</div><div class="actions"><button class="btn btn-secondary" onclick="App.copyNote()">Copiar</button><button class="btn btn-secondary" onclick="window.print()">Imprimir</button><button class="btn btn-primary" onclick="App.downloadNote()">Salvar TXT</button></div></div></div>`;refreshNoteTargets()}
function refreshNoteTargets(){const t=val('noteType');let arr=[];if(t==='trip')arr=db.trips.map(x=>[x.id,`${x.date} • ${x.origin||'-'} → ${x.destination||'-'}`]);if(t==='appointment')arr=db.appointments.map(x=>[x.id,`${x.date} • ${x.producer}`]);if(t==='licitation')arr=db.licitations.map(x=>[x.id,`${x.date} • ${x.title}`]);if(t==='payment')arr=db.payments.map(x=>[x.id,`${x.date} • ${x.employeeName} • ${money(x.value)}`]);if(t==='contract')arr=db.contracts.map(x=>[x.id,`${x.number} • ${x.contractor}`]);if(t==='truck')arr=db.trucks.map(x=>[x.id,`${x.plate} • ${x.model||'-'}`]);document.getElementById('noteTarget').innerHTML=arr.length?arr.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join(''):'<option value="">Não se aplica / sem registros</option>'}
function noteHeader(title){return`PREFEITURA MUNICIPAL DE BOM REGRESSO\n${'='.repeat(58)}\n${title.toUpperCase()}\n${'='.repeat(58)}\n\n`}
function generateNote(type,id=''){if(!type)type=val('noteType');if(!id)id=val('noteTarget');let s='';if(type==='general'){const rev=db.finance.filter(x=>x.type==='Receita'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0),exp=db.finance.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0);s=noteHeader('Resumo Geral')+`Operador: ${db.currentOperator}\nData: ${todayBR()}\n\nServidores: ${db.employees.length}\nAgendamentos: ${db.appointments.length}\nLicitações: ${db.licitations.length}\nContratos: ${db.contracts.length}\nCaminhões: ${db.trucks.length}\nViagens: ${db.trips.length}\n\nReceitas pagas: ${money(rev)}\nDespesas pagas: ${money(exp)}\nSaldo: ${money(rev-exp)}`}
else if(type==='finance'){const rev=db.finance.filter(x=>x.type==='Receita'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0),exp=db.finance.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0);s=noteHeader('Resumo de Saldo')+`Data: ${todayBR()}\nOperador: ${db.currentOperator}\n\nReceitas: ${money(rev)}\nDespesas: ${money(exp)}\nSaldo: ${money(rev-exp)}\n\nLançamentos registrados: ${db.finance.length}`}
else if(type==='trip'){const x=db.trips.find(r=>r.id===id);if(x)s=noteHeader('Nota de Viagem')+`Data: ${x.date}\nCaminhão: ${x.truck||'-'}\nMotorista: ${x.driver||'-'}\nOrigem: ${x.origin||'-'}\nDestino: ${x.destination||'-'}\nCarga / motivo: ${x.cargo||'-'}\nKM inicial: ${x.startKm||0}\nKM final: ${x.endKm||0}\nStatus: ${x.status}\nOperador: ${x.operator}\nObservações: ${x.notes||'-'}`}
else if(type==='appointment'){const x=db.appointments.find(r=>r.id===id);if(x)s=noteHeader('Ordem / Resumo da Agricultura')+`Produtor: ${x.producer}\nLocalidade: ${x.locality||'-'}\nData: ${x.date}\nMáquina: ${x.machine||'-'}\nImplementos: ${(x.implements||[]).join(', ')||'-'}\nHoras: ${x.hours||0}\nStatus: ${x.status}\nOperador: ${x.operator}\nObservações: ${x.notes||'-'}`}
else if(type==='licitation'){const x=db.licitations.find(r=>r.id===id);if(x)s=noteHeader('Nota de Licitação')+`Nome: ${x.title}\nData de envio: ${x.date}\nResumo / itens: ${x.item||'-'}\nStatus: ${x.status}\nEnviado por: ${x.sentBy}\nConfirmado por: ${x.confirmedBy||'-'}\nObservações: ${x.notes||'-'}`}
else if(type==='payment'){const x=db.payments.find(r=>r.id===id);if(x)s=noteHeader('Pagamento de Servidor')+`Servidor: ${x.employeeName}\nFunção: ${x.role||'-'}\nSetor: ${x.department||'-'}\nData do pagamento: ${x.date}\nReferência: ${x.reference||'-'}\nValor pago: ${money(x.value)}\nRegistrado por: ${x.operator}\nObservações: ${x.notes||'-'}\n\n${'-'.repeat(58)}\nDocumento fictício para uso no sistema de Bom Regresso.`}
else if(type==='contract'){const x=db.contracts.find(r=>r.id===id);if(x)s=noteHeader('Resumo de Contrato')+`Número: ${x.number}\nContratado: ${x.contractor}\nObjeto: ${x.object||'-'}\nInício: ${x.start||'-'}\nFim: ${x.end||'-'}\nValor: ${money(x.value)}\nStatus: ${x.status}\nOperador: ${x.operator}\nObservações: ${x.notes||'-'}`}
else if(type==='truck'){const x=db.trucks.find(r=>r.id===id);if(x)s=noteHeader('Resumo de Caminhão')+`Identificação: ${x.plate}\nModelo: ${x.model||'-'}\nStatus: ${x.status}\nQuilometragem: ${x.odometer||0}\nObservações: ${x.notes||'-'}`}
if(!s)s='Registro não encontrado.';return s}
function generateSelectedNote(){document.getElementById('noteBox').textContent=generateNote()}
function noteFrom(type,id){page='notes';sub='';render();setTimeout(()=>{document.getElementById('noteType').value=type;refreshNoteTargets();document.getElementById('noteTarget').value=id;document.getElementById('noteBox').textContent=generateNote(type,id)},0)}
async function copyNote(){const s=document.getElementById('noteBox')?.textContent||'';try{await navigator.clipboard.writeText(s);toast('Nota copiada.')}catch{toast('Não foi possível copiar automaticamente.')}}
function downloadNote(){const s=document.getElementById('noteBox')?.textContent||'';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.download=`nota_bom_regresso_${Date.now()}.txt`;a.click();URL.revokeObjectURL(a.href)}
function dataTools(){showModal('Dados e backup',`<p class="muted">Os registros municipais são sincronizados pelo Firebase entre os aparelhos. O backup continua disponível para guardar uma cópia dos dados.</p><p class="muted"><b>Status:</b> ${cloudReady?'☁ Conectado e sincronizando':'⚠ Modo local / sem conexão com Firebase'}</p><div class="actions" style="justify-content:flex-start"><button class="btn btn-primary" onclick="App.exportData()">⬇ Exportar backup</button><button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">⬆ Importar backup</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="App.importData(this.files[0])"></div><div class="sep"></div><button class="btn btn-secondary" onclick="App.resetData()">Limpar cache deste aparelho</button>`)}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download=`bom_regresso_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exportado.')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{db=Object.assign(defaults(),JSON.parse(r.result));save();closeModal();render();toast('Dados importados.')}catch{toast('Arquivo de backup inválido.')}};r.readAsText(file)}
function resetData(){if(confirm('Limpar apenas o cache deste aparelho? Os dados compartilhados no Firebase não serão apagados.')){localStorage.removeItem(KEY);closeModal();location.reload()}}
window.App={closeModal,enter,logout,go,mobileMore,openSettings,setThemePreset,previewTheme,saveThemeSettings,resetTheme,installApp,addOperator,saveOperator,manageOperators,renameOperator,saveRenameOperator,toggleOperator,filterAgri,setAgStatus,addImp,rmImp,saveAppointment,assetForm,saveAsset,saveLicit,confirmLicit,saveEmployee,employeeModal,saveEmployeeEdit,paymentForm,savePayment,saveContract,saveFinance,saveTruck,saveTrip,setTripStatus,refreshNoteTargets,generateSelectedNote,noteFrom,copyNote,downloadNote,dataTools,exportData,importData,resetData};
applyTheme();
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(getTheme().appearance==='auto')applyTheme()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('Prefeitura de Bom Regresso instalada.')});
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
initCloud();
})();
</script>
