const territoryOf=p=>p.jurisdictionId?` de ${stNameIn(data.estados,p.jurisdictionId)||stNameIn(data.municipios,p.jurisdictionId)||'território removido'}`:'';
const LOOK=['photo','emoji','color'];
function fieldChanges(a,b,fields){
  const out=fields.filter(([k])=>JSON.stringify(a?.[k]??'')!==JSON.stringify(b?.[k]??'')).map(([k,label,f=v=>v||'—'])=>`${label}: ${f(a?.[k])} → ${f(b?.[k])}`);
  if(LOOK.some(k=>JSON.stringify(a?.[k]??'')!==JSON.stringify(b?.[k]??'')))out.push('aparência alterada');
  return out
}
const movText=m=>(m.tipo==='repasse'?`Repasse de ${money(m.valor)} de ${stName(m.estado)} para ${ctName(m.municipio)}`
  :m.tipo==='arrecadacao'?`Arrecadação de ${money(m.valor)} de ${ctName(m.municipio)} para ${stName(m.estado)}`
  :`${m.tipo==='despesa'?'Despesa':'Receita'} de ${money(m.valor)} em ${m.nivel==='municipio'?ctName(m.municipio):stName(m.estado)}`)+(m.categoria?` · ${m.categoria}`:'')+(m.descricao?` — ${m.descricao}`:'');
const movArea=m=>({repasse:'Repasses',arrecadacao:'Arrecadação'})[m.tipo]||'Finanças';
const movPlace=m=>({nivel:m.nivel==='municipio'?'municipio':'estado',estado:m.estado||'',municipio:m.municipio||''});
const lancText=l=>`${l.tipo} de ${money(l.valor)} no cofre nacional${l.estado?` · ${stName(l.estado)}`:''}${l.descricao?` — ${l.descricao}`:''}`;
function logChanges(actor=current()){
  const before=logBase,after=logSnapshot();if(!after)return;if(!before){logBase=after;return}
  const me=actor,now=new Date().toISOString(),out=[];
  const add=e=>out.push({id:id(),at:now,autor:me?.name||'Sistema',autorId:me?.id||'',cargo:me?.role||'',nivel:'republica',estado:'',municipio:'',...e});
  const diff=(key,onAdd,onDel,onEdit)=>{const old=new Map((before[key]||[]).map(x=>[x.id,x])),cur=new Map((after[key]||[]).map(x=>[x.id,x]));for(const [k,x] of cur){if(!old.has(k))onAdd(x);else if(JSON.stringify(old.get(k))!==JSON.stringify(x))onEdit(old.get(k),x)}for(const [k,x] of old)if(!cur.has(k))onDel(x)};
  const ST=[['nome','Nome'],['sigla','Sigla'],['governante','Governante'],['verba','Verba inicial',money]];
  diff('estados',x=>add({nivel:'estado',estado:x.id,area:'Estados',acao:'Criação',texto:`Estado ${x.nome} (${x.sigla}) cadastrado · verba inicial ${money(x.verba)}`}),
    x=>add({nivel:'estado',estado:x.id,area:'Estados',acao:'Exclusão',texto:`Estado ${x.nome} (${x.sigla}) excluído`}),
    (a,b)=>{const c=fieldChanges(a,b,ST);if(c.length)add({nivel:'estado',estado:b.id,area:'Estados',acao:'Edição',texto:`Estado ${b.nome}: ${c.join('; ')}`})});
  const CT=[['nome','Nome'],['estado','Estado',stName],['prefeito','Prefeito(a)'],['populacao','População',v=>num(v||0)],['renda','Renda mensal',v=>money(v||0)]];
  diff('municipios',x=>add({nivel:'municipio',municipio:x.id,estado:x.estado,area:'Municípios',acao:'Criação',texto:`Município ${x.nome} cadastrado em ${stName(x.estado)}`}),
    x=>add({nivel:'municipio',municipio:x.id,estado:x.estado,area:'Municípios',acao:'Exclusão',texto:`Município ${x.nome} excluído`}),
    (a,b)=>{const c=fieldChanges(a,b,CT);if(c.length)add({nivel:'municipio',municipio:b.id,estado:b.estado,area:'Municípios',acao:'Edição',texto:`Município ${b.nome}: ${c.join('; ')}`})});
  const LC=[['tipo','Tipo'],['valor','Valor',money],['data','Data'],['estado','Destino',v=>v?stName(v):'Cofre nacional'],['descricao','Descrição']];
  diff('lancamentos',x=>add({estado:x.estado||'',area:'Cofre',acao:x.tipo==='Saída'?'Saída':'Entrada',texto:lancText(x)}),
    x=>add({estado:x.estado||'',area:'Cofre',acao:'Exclusão',texto:`Lançamento excluído: ${lancText(x)}`}),
    (a,b)=>{const c=fieldChanges(a,b,LC);if(c.length)add({estado:b.estado||'',area:'Cofre',acao:'Edição',texto:`Lançamento "${b.descricao||b.tipo}": ${c.join('; ')}`})});
  const collected=[];
  const MV=[['valor','Valor',money],['categoria','Categoria'],['data','Data'],['descricao','Descrição'],['municipio','Município',ctName]];
  diff('movimentos',x=>{if(x.tipo==='arrecadacao')collected.push(x);else add({...movPlace(x),area:movArea(x),acao:x.renda?'Renda do mês':x.tipo==='repasse'?'Repasse':x.tipo==='despesa'?'Despesa':'Receita',texto:movText(x)})},
    x=>add({...movPlace(x),area:movArea(x),acao:'Exclusão',texto:`Excluído: ${movText(x)}`}),
    (a,b)=>{const c=fieldChanges(a,b,MV);if(c.length)add({...movPlace(b),area:movArea(b),acao:'Edição',texto:`${movArea(b)} editado: ${c.join('; ')}`})});
  // A "Arrecadar de todos" can add dozens of rows at once: keep it as one entry per state.
  for(const st of [...new Set(collected.map(m=>m.estado))]){const rows=collected.filter(m=>m.estado===st);if(rows.length===1)add({...movPlace(rows[0]),area:'Arrecadação',acao:'Arrecadação',texto:movText(rows[0])});else add({nivel:'estado',estado:st,area:'Arrecadação',acao:'Arrecadação',texto:`Arrecadação de ${num(rows.length)} municípios para ${stName(st)}: ${money(rows.reduce((a,m)=>a+(Number(m.valor)||0),0))}`})}
  const pibYears=new Set();
  diff('pibHistorico',x=>{pibYears.add(String(x.ano));add({area:'Economia',acao:'Criação',texto:`PIB de ${x.ano} registrado: ${money(x.valor)}`})},
    x=>add({area:'Economia',acao:'Exclusão',texto:`PIB de ${x.ano} removido`}),
    (a,b)=>{pibYears.add(String(b.ano));const c=fieldChanges(a,b,[['ano','Ano'],['valor','Valor',money]]);if(c.length)add({area:'Economia',acao:'Edição',texto:`PIB de ${b.ano}: ${c.join('; ')}`})});
  if(before.cofreInicial!==after.cofreInicial)add({area:'Cofre',acao:'Edição',texto:`Saldo inicial do cofre: ${money(before.cofreInicial)} → ${money(after.cofreInicial)}`});
  if(before.ano!==after.ano)add({area:'Economia',acao:'Edição',texto:`Ano de referência: ${before.ano} → ${after.ano}`});
  if(before.pib!==after.pib&&!pibYears.has(String(after.ano)))add({area:'Economia',acao:'Edição',texto:`PIB atual: ${money(before.pib)} → ${money(after.pib)}`});
  const PF=[['name','Nome'],['sector','Setor'],['status','Frase de status']];
  diff('profiles',x=>add({nivel:levelOf(x),...placeOfProfile(x),area:'Perfis',acao:'Cadastro',texto:`Perfil ${x.name} cadastrado como ${x.role}${territoryOf(x)}`}),
    x=>add({nivel:levelOf(x),...placeOfProfile(x),area:'Perfis',acao:'Remoção',texto:`Perfil ${x.name} (${x.role}) removido`}),
    (a,b)=>{
      if(a.role!==b.role||(a.jurisdictionId||'')!==(b.jurisdictionId||''))add({nivel:levelOf(b),...placeOfProfile(b),area:'Perfis',acao:'Atribuição',texto:`${b.name}: ${a.role}${territoryOf(a)} → ${b.role}${territoryOf(b)}`});
      const c=fieldChanges(a,b,PF);if(c.length)add({nivel:levelOf(b),...placeOfProfile(b),area:'Perfis',acao:'Edição',texto:`${me?.id===b.id?`${b.name} atualizou o próprio perfil`:`Perfil de ${b.name} editado`}: ${c.join('; ')}`})
    });
  for(const e of out){e.estadoNome=stName(e.estado);e.municipioNome=ctName(e.municipio)}
  logBase=after;
  if(!out.length)return;
  data.atividades=[...out.reverse(),...(Array.isArray(data.atividades)?data.atividades:[])].sort((x,y)=>String(y.at).localeCompare(String(x.at))).slice(0,LOG_LIMIT)
}

// ---- Leitura: histórico da República + histórico do sistema completo da Prefeitura de Bom Regresso
const ACT_ICON={Estados:'🗺️',Municípios:'🏘️',Cofre:'💰',Repasses:'💸',Arrecadação:'🧾',Finanças:'📊',Economia:'📈',Perfis:'👤',Agricultura:'🌱',Frota:'🚚',RH:'👥',Licitações:'📨',Contratos:'📄',Usuários:'👤',Sistema:'↩️'};
const MUNICIPAL_AREAS={agri:'Agricultura',fleet:'Frota',hr:'RH',licit:'Licitações',finance:'Finanças',contracts:'Contratos',users:'Usuários',system:'Sistema'};
const municipalLog={at:0,items:[],error:'',loading:false};
function loadMunicipalLog(force){
  const city=municipalTargetCity();if(!city||!countryStore||municipalLog.loading)return;
  if(!force&&municipalLog.at&&Date.now()-municipalLog.at<60000)return;
  municipalLog.loading=true;municipalLog.error='';refreshActivityLists();
  countryStore.collection('municipio').doc('dados_v5').get().then(snap=>{
    const log=snap.exists?(snap.data()?.activityLog||[]):[];
    municipalLog.items=(Array.isArray(log)?log:[]).filter(e=>!(e?.area==='users'&&e.action==='Integração'&&/ foi sincronizado a partir da República Bom Regressense\.$/.test(e.description||''))).slice(0,300).map(e=>({id:'pm-'+e.id,at:e.at||'',autor:e.actor||'Sistema',cargo:e.role||'',nivel:'prefeitura',estado:city.estado||'',municipio:city.id,area:MUNICIPAL_AREAS[e.area]||'Prefeitura',acao:e.action||'Alteração',texto:e.description||'',desfeito:!!e.undoneAt}))
  }).catch(()=>{municipalLog.error='Não foi possível carregar o histórico do sistema da Prefeitura agora.'}).finally(()=>{municipalLog.loading=false;municipalLog.at=Date.now();refreshActivityLists()})
}
const actFilters={},actFilterFor=ctx=>actFilters[ctx]||(actFilters[ctx]={nivel:'',estado:'',municipio:'',periodo:'',q:'',limit:50});
const actSt=e=>stNameIn(data.estados,e.estado)||e.estadoNome||stName(e.estado),actCt=e=>stNameIn(data.municipios,e.municipio)||e.municipioNome||ctName(e.municipio);
const placeName=e=>e.nivel==='republica'?'República'+(e.estado?` · ${actSt(e)}`:''):e.nivel==='estado'?actSt(e)+(e.municipio?` · ${actCt(e)}`:''):e.nivel==='prefeitura'?`Sistema da Prefeitura · ${actCt(e)}`:actCt(e);
const PLACE_ICON={republica:'🏛️',estado:'🗺️',municipio:'🏘️',prefeitura:'🏢'};
function activityMatches(e,f,fixedEstado){
  const est=fixedEstado||f.estado;
  if(est&&e.estado!==est&&data.municipios.find(c=>c.id===e.municipio)?.estado!==est)return false;
  if(f.municipio&&e.municipio!==f.municipio)return false;
  if(f.nivel==='municipio'?!['municipio','prefeitura'].includes(e.nivel):f.nivel&&e.nivel!==f.nivel)return false;
  if(f.periodo){const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-Number(f.periodo));if(new Date(e.at)<start)return false}
  if(f.q&&!plainText([e.autor,e.cargo,e.acao,e.area,e.texto,placeName(e)].join(' ')).includes(plainText(f.q.trim())))return false;
  return true
}
const dayLabel=iso=>{const d=new Date(iso),t=new Date();t.setHours(0,0,0,0);const diff=Math.round((t-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return diff===0?'Hoje':diff===1?'Ontem':d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:d.getFullYear()===t.getFullYear()?undefined:'numeric'})};
function activityRow(e){
  const person=data.profiles.find(p=>p.id===e.autorId);
  return `<div class="act-item${e.desfeito?' is-undone':''}"><div class="act-who">${person?avatar(person):`<span class="avatar act-icon">${ACT_ICON[e.area]||'📌'}</span>`}</div><div class="act-main"><div class="act-line"><b>${esc(e.autor||'Sistema')}</b><span class="act-badge">${esc(e.acao||'Alteração')}</span><small>${ACT_ICON[e.area]||'📌'} ${esc(e.area||'')}</small></div><div class="act-text">${esc(e.texto||'—')}</div><div class="act-meta">${esc(new Date(e.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))}${e.cargo?' · '+esc(e.cargo):''} · ${PLACE_ICON[e.nivel]||''} ${esc(placeName(e))}${e.desfeito?' · desfeito':''}</div></div></div>`
}
function activityListHTML(ctx,fixedEstado){
  const f=actFilterFor(ctx),pool=[...(Array.isArray(data.atividades)?data.atividades:[]),...municipalLog.items].sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const list=pool.filter(e=>activityMatches(e,f,fixedEstado)),shown=list.slice(0,f.limit);let day='';
  const rows=shown.map(e=>{const d=dayLabel(e.at),head=d!==day?`<div class="act-day">${esc(d)}</div>`:'';day=d;return head+activityRow(e)}).join('');
  const status=municipalLog.loading?'<p class="muted act-note">Carregando o histórico do sistema da Prefeitura…</p>':municipalLog.error?`<p class="muted act-note">⚠ ${esc(municipalLog.error)}</p>`:'';
  return `<p class="act-count">${num(list.length)} ${list.length===1?'atividade':'atividades'}${list.length>shown.length?` · mostrando ${num(shown.length)}`:''}</p>${status}${rows||`<p class="gov-empty">${pool.length?'Nenhuma atividade com esses filtros.':'Nenhuma atividade registrada ainda. As próximas alterações aparecem aqui automaticamente.'}</p>`}${list.length>shown.length?'<button type="button" class="btn secondary act-more" data-act-more>Mostrar mais</button>':''}`
}
function refreshActivityLists(){document.querySelectorAll('#content [data-act-ctx]').forEach(box=>{const list=box.querySelector('[data-act-list]');if(list)list.innerHTML=activityListHTML(box.dataset.actCtx,box.dataset.actEstado||'')})}
function activityPanel(ctx,fixedEstado=''){
  const f=actFilterFor(ctx),hasBR=!!municipalTargetCity()&&(!fixedEstado||municipalTargetCity().estado===fixedEstado);
  if(hasBR)setTimeout(()=>loadMunicipalLog(false),0);
  const chip=(v,label)=>`<button type="button" data-act-nivel="${v}" aria-pressed="${f.nivel===v}">${label}</button>`;
  const states=data.estados.slice().sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const cities=data.municipios.filter(c=>(fixedEstado||f.estado)?c.estado===(fixedEstado||f.estado):true).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const opt=(v,label,sel)=>`<option value="${esc(v)}"${sel===v?' selected':''}>${esc(label)}</option>`;
  return `<section class="panel act-panel" data-act-ctx="${esc(ctx)}" data-act-estado="${esc(fixedEstado)}"><div class="act-filters"><div class="act-chips" role="group" aria-label="Filtrar por nível">${chip('','Tudo')}${fixedEstado?'':chip('republica','🏛️ República')}${chip('estado',fixedEstado?'🗺️ Governo estadual':'🗺️ Estados')}${chip('municipio','🏘️ Municípios')}${hasBR?chip('prefeitura','🏢 Sistema da Prefeitura'):''}</div><div class="act-fields">${fixedEstado?'':`<label class="field">Estado<select data-act-filter="estado">${opt('','Todos os estados',f.estado)}${states.map(s=>opt(s.id,s.nome,f.estado)).join('')}</select></label>`}<label class="field">Município<select data-act-filter="municipio">${opt('','Todos os municípios',f.municipio)}${cities.map(c=>opt(c.id,c.nome,f.municipio)).join('')}</select></label><label class="field">Período<select data-act-filter="periodo">${opt('','Todo o período',f.periodo)}${opt('0','Hoje',f.periodo)}${opt('6','Últimos 7 dias',f.periodo)}${opt('29','Últimos 30 dias',f.periodo)}</select></label><label class="field">Buscar<input type="search" data-act-filter="q" value="${esc(f.q)}" placeholder="Pessoa, ação ou descrição" autocomplete="off"></label></div>${hasBR?'<button type="button" class="btn secondary gov-mini act-reload" data-act-reload>↻ Atualizar Prefeitura</button>':''}</div><div data-act-list>${activityListHTML(ctx,fixedEstado)}</div></section>`
}
function atividades(){return heading('Atividades','Tudo o que acontece na República, nos estados e nos municípios, do mais recente ao mais antigo.')+activityPanel('geral')}
function govHistorico(st){return govHead('Histórico',`Atividades do governo de ${esc(st.nome)} e dos municípios dele.`)+activityPanel('estado:'+st.id,st.id)}
function recentActivities(){
  const list=(Array.isArray(data.atividades)?data.atividades:[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,5);

document.addEventListener('click',e=>{

// ---- Cartões do Painel da Presidência: cofre e PIB editáveis com um toque, estados e municípios abrem a página
let quickEdit='';
const QUICK_UNITS=Object.fromEntries(MONEY_SCALES.flatMap(([size,unit])=>[[plainText(unit),size],[plainText(unit.replace('ão','ões')),size]]).concat([['mi',1e6],['bi',1e9],['tri',1e12]]));
// Aceita "5.000.000,00", "5000000", "1e30" e também "10 decilhões" ou "2,5 milhões".
function parseMoneyInput(raw){
  let t=plainText(String(raw||'')).replace(/r\$/g,'').trim();if(!t)return NaN;
  const m=t.match(/^(-?[\d.,]+(?:e[+-]?\d+)?)\s*([a-z]+)?$/);if(!m)return NaN;
  let num=m[1],mult=1;
  if(m[2]){mult=QUICK_UNITS[m[2]];if(!mult)return NaN}
  if(/e/.test(num))return Number(num)*mult;
  if(num.includes(','))num=num.replace(/\./g,'').replace(',','.');
  else if((num.match(/\./g)||[]).length>1||/\.\d{3}$/.test(num))num=num.replace(/\./g,'');
  const v=Number(num)*mult;return Number.isFinite(v)?Math.round(v*100)/100:NaN
}
const moneyField=v=>money(v).replace(/^R\$\s?/,'');
function quickCard(kind,label,value,detail,raw){
  if(scope(current())!=='nacional')return card(label,value,detail);
  if(quickEdit!==kind)return `<button type="button" class="card card-edit" data-quick-edit="${kind}" title="Toque para editar">${card(label,value,detail).replace(/^<div class="card">|<\/div>$/g,'')}<em class="card-hint">✎ Toque para editar</em></button>`;
  const help=kind==='cofre'?'Novo saldo disponível. Os lançamentos continuam no histórico.':`PIB de ${esc(data.ano)}. Também atualiza o gráfico.`;
  return `<form id="quickEditForm" class="card card-editing" data-kind="${kind}"><small>${label}</small><label class="quick-field"><span>R$</span><input id="quickEditInput" name="valor" value="${esc(moneyField(raw))}" inputmode="decimal" autocomplete="off" aria-label="${label}"></label><small id="quickPreview">${esc(money(raw))}</small><small class="muted">${help}</small><div class="quick-actions"><button class="btn" type="submit">Salvar</button><button class="btn secondary" type="button" data-quick-cancel>Cancelar</button></div></form>`
}
const linkCard=(target,label,value,detail)=>scope(current())==='nacional'?`<button type="button" class="card card-edit" data-page="${target}">${card(label,value,detail).replace(/^<div class="card">|<\/div>$/g,'')}<em class="card-hint">Abrir ›</em></button>`:card(label,value,detail);
function closeQuickEdit(){quickEdit='';formEditing=false;render()}
document.addEventListener('click',e=>{if(quickEdit&&e.target.closest('[data-page]:not(body)'))quickEdit=''},true);
document.addEventListener('click',e=>{
  const open=e.target.closest('[data-quick-edit]');
  if(open&&scope(current())==='nacional'){quickEdit=open.dataset.quickEdit;formEditing=false;render();const input=$('quickEditInput');if(input){input.focus();input.select()}return}

function countUpCards(root){

  root.querySelectorAll('.card strong,.gov-card strong').forEach(el=>{
    const text=el.textContent,m=text.match(/^(-?)(R\$\s?)?(\d[\d.]*(?:,\d+)?)(.*)$/);if(!m||el.children.length)return;
    const dec=(m[3].split(',')[1]||'').length,target=Number(m[3].replace(/\./g,'').replace(',','.'));if(!Number.isFinite(target)||target<=0)return;

function connectFederatedFrame(frameId,statusId,payload,successLabel='Perfil conectado.'){
  const frame=$(frameId),status=$(statusId),p=payload;
  if(!frame||!p)return;
  const requestId='federation-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  let handoffSent=false,finished=false;
  const setStatus=(text,ok=false)=>{if(status){status.textContent=text;status.dataset.ok=ok?'1':'0'}};
  const target=/^https?:$/.test(location.protocol)?location.origin:'*';
  const onMessage=e=>{
    const msg=e.data;
    if(e.source!==frame.contentWindow||!msg||msg.protocol!==FEDERATION_PROTOCOL||msg.requestId!==requestId)return;
    if(msg.type==='MUNICIPAL_SYSTEM_DESCRIPTOR'&&!handoffSent){
      handoffSent=true;setStatus('Conectando seu perfil…');
      frame.contentWindow.postMessage({protocol:FEDERATION_PROTOCOL,type:'HANDOFF_PROFILE',requestId,payload:p},target);
      return
    }
    if(msg.type==='HANDOFF_RESULT'){
      finished=true;
      if(msg.payload?.ok)setStatus(msg.payload.requiresPassword?'Perfil sincronizado. Confirme a senha para continuar.':successLabel,true);
      else setStatus(msg.payload?.reason||'Não foi possível conectar este perfil.');
      setTimeout(()=>window.removeEventListener('message',onMessage),3500)
    }
  };
  window.addEventListener('message',onMessage);
  const discover=()=>{if(!finished){try{frame.contentWindow?.postMessage({protocol:FEDERATION_PROTOCOL,type:'DISCOVER_MUNICIPAL_SYSTEM',requestId},target)}catch{}}};
  frame.addEventListener('load',()=>setTimeout(discover,120),{once:true});
  setTimeout(discover,320);
  setTimeout(()=>{if(!finished&&!handoffSent)setStatus('O módulo abriu, mas a integração automática ainda está conectando…')},3200)
}

  const btn=(short)=>([k,icon,label,shortLabel])=>`<button type="button" class="${k===active?'active':''}" ${tabAttr}="${k}"><span aria-hidden="true">${icon}</span>${esc(short?shortLabel:label)}</button>`;
  return `<div class="gov-app"><header class="gov-top"><button class="btn secondary" type="button" data-page="inicio">← República</button>${avatar||''}<div class="grow"><b>${title}</b><small>${subtitle}</small></div>${exit||''}</header><div class="gov-body"><nav class="gov-side" aria-label="Seções">${tabs.map(btn(false)).join('')}</nav><main class="gov-main">${body}</main></div><nav class="gov-bottom" aria-label="Seções">${tabs.map(btn(true)).join('')}</nav></div>`
}

// ---- quem abre o quê
function govOpenState(){const p=current();if(!p)return null;const level=scope(p);if(level==='estadual')return data.estados.find(x=>x.id===p.jurisdictionId)||null;if(level!=='nacional')return null;return data.estados.find(x=>x.id===govStateId)||null}
const govAllowedCities=()=>data.municipios.filter(c=>canCity(c)||(isBomRegresso(c)&&municipalSystem()));
function govOpenCity(){
  const p=current();if(!p)return null;const level=scope(p),allowed=govAllowedCities(),chosen=allowed.find(c=>c.id===govCityId);
  if(chosen)return chosen;
  if(level==='municipal'||level==='administrativo')return allowed.find(c=>c.id===p.jurisdictionId)||(municipalSystem()?municipalTargetCity():null);
  return null
}

// ---- Estados: seleção (Presidência) e app do governo estadual
function estados(){
  const p=current(),level=scope(p);
  if(level==='estadual'&&!govOpenState())return heading('Governo estadual','Este perfil ainda não está vinculado a um estado.')+`<section class="panel"><h2>Aguardando estado</h2><p>A Presidência precisa cadastrar um estado e selecionar <b>Perfis → Atribuir</b> para vincular este governo.</p></section>`;
  const st=govOpenState();
  if(st)return govStateApp(st);
  govStateId='';
  return govPicker('estados')
}

function govStateApp(st){
  const tab=GOV_TABS.some(([k])=>k===govTab)?govTab:'painel';
  const body=({painel:govPainel,municipios:govMunicipios,repasses:govRepasses,arrecadacao:govArrecadacao,financas:govFinancas,dados:govDados,historico:govHistorico})[tab](st);
  const national=scope(current())==='nacional';
  return govShell({title:`Governo de ${esc(st.nome)}`,avatar:entityAvatar(st,'estado','mini'),subtitle:`${esc(st.sigla)} · Governante: ${esc(st.governante||'—')} · Caixa ${esc(moneyShort(stateCash(st)))}`,tabs:GOV_TABS,active:tab,tabAttr:'data-gov-tab',exit:national&&data.estados.filter(canState).length>1?'<button class="btn secondary" type="button" data-gov-exit title="Trocar estado"><span class="gov-long">Trocar estado</span><span class="gov-short">⇄ Estados</span></button>':'',body})
}
const stateCities=st=>data.municipios.filter(c=>c.estado===st.id);
function govPainel(st){
  const cities=stateCities(st),year=String(new Date().getFullYear());
  const sent=sumMov(m=>m.estado===st.id&&m.tipo==='repasse'&&yearKey(m.data)===year),collected=sumMov(m=>m.estado===st.id&&m.tipo==='arrecadacao'&&yearKey(m.data)===year);
  const recent=[...data.movimentos.filter(m=>m.estado===st.id&&stateDelta(m,st.id)),...data.lancamentos.filter(l=>l.estado===st.id).map(l=>({...l,_union:true}))].sort(movSort).slice(0,8);
  const spending=data.movimentos.filter(m=>m.estado===st.id&&(m.tipo==='repasse'||(m.nivel==='estado'&&m.tipo==='despesa')));
  return govHead('Painel estadual','Visão geral das contas e dos municípios do estado.',`<div class="gov-quick"><button class="btn" type="button" data-gov-tab="repasses">💸 Mandar verba</button><button class="btn secondary" type="button" data-gov-tab="municipios">＋ Município</button><button class="btn secondary" type="button" data-gov-collect-all>🧾 Arrecadar</button></div>`)+
  `<div class="gov-cards">${govCard('Caixa estadual',esc(moneyShort(stateCash(st))),'Disponível agora')}${govCard('Municípios',num(cities.length),'Neste estado')}${govCard('População',num(cities.reduce((a,c)=>a+(Number(c.populacao)||0),0)),'Soma dos municípios')}${govCard('Repassado em '+year,esc(moneyShort(sent)),'Verba enviada às cidades')}${govCard('Arrecadado em '+year,esc(moneyShort(collected)),'Tributos estaduais')}</div>`+
  `<div class="gov-grid"><section class="panel"><h2>Fluxo de caixa</h2><p class="muted">Entradas e saídas dos últimos 6 meses.</p>${flowChart(monthlyFlows(stateEntries(st)))}</section><section class="panel"><h2>Repasses por município</h2><p class="muted">Total enviado a cada cidade.</p>${rankBars(cities.map(c=>({label:c.nome,value:sumMov(m=>m.estado===st.id&&m.tipo==='repasse'&&m.municipio===c.id)})))}</section><section class="panel"><h2>Para onde vai a verba</h2><p class="muted">Repasses e despesas por finalidade.</p>${donut(byCategory(spending))}</section><section class="panel"><h2>Atividades recentes</h2><p class="muted">Últimas movimentações do estado.</p>${recent.length?`<div class="gov-feed">${recent.map(m=>`<div class="gov-feed-row"><span>${esc(m._union?(m.tipo==='Saída'?'Repasse da União':'Pagamento à União'):movLabel(m))}<small>${esc(fmtDate(m.data)||'')}</small></span>${signed(m._union?unionFlow(m):stateDelta(m,st.id))}</div>`).join('')}</div>`:'<p class="gov-empty">Nenhuma movimentação ainda.</p>'}</section></div>`
}
function govMunicipios(st){
  const cities=stateCities(st);
  return govHead('Municípios',`Cadastre e acompanhe as cidades de ${esc(st.nome)}.`)+
  `<section class="panel"><h2>Cadastrar município</h2><form id="municipioForm" class="form"><input type="hidden" name="estado" value="${esc(st.id)}"><label class="field">Nome do município<input name="nome" required maxlength="60" placeholder="Ex.: Vila Serena"></label><label class="field">Prefeito(a)<input name="prefeito" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="0" required></label><label class="field">Renda mensal fictícia<input name="renda" type="number" min="0" step="0.01" value="0"></label>${lookEditor('municipio','new-municipio')}<div class="field wide"><button class="btn">Cadastrar município</button></div></form></section>`+
  `<div class="gov-picks" style="margin-top:16px">${cities.map(c=>`<div class="gov-pick static"><div class="gov-pick-top">${entityAvatar(c,'municipio')}<span><b>${esc(c.nome)}</b><small>Prefeito(a): ${esc(c.prefeito||'—')}</small></span>${isBomRegresso(c)?'<span class="gov-tag">Sistema completo</span>':''}</div><div class="gov-pick-stats"><span>👥 <b>${num(c.populacao)}</b></span><span>📈 <b>${esc(moneyShort(c.renda||0))}</b>/mês</span><span>💰 <b>${esc(moneyShort(cityCash(c)))}</b></span></div><div class="gov-pick-actions"><button class="btn secondary gov-mini" type="button" data-city-open="${esc(c.id)}">Abrir painel</button><button class="btn secondary gov-mini" type="button" data-city-edit="${esc(c.id)}">✎ Editar</button><button class="btn gov-mini" type="button" data-gov-send="${esc(c.id)}">💸 Mandar verba</button></div></div>`).join('')||'<p class="gov-empty">Nenhum município neste estado ainda. Use o formulário acima.</p>'}</div>`
}
function govRepasses(st){
  const cities=stateCities(st),list=data.movimentos.filter(m=>m.estado===st.id&&m.tipo==='repasse').sort(movSort);
  return govHead('Repasses',`Envie verba do caixa de ${esc(st.nome)} para os municípios.`)+movEditPanel()+
  `<div class="gov-grid"><section class="panel"><h2>Mandar verba</h2><p class="muted">Caixa disponível: <b>${esc(money(stateCash(st)))}</b></p>${cities.length?`<form id="govTransferForm" class="form"><label class="field">Município<select name="municipio" required>${cities.map(c=>`<option value="${esc(c.id)}" ${c.id===govSendTo?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label class="field">Finalidade<select name="categoria">${categoryOptions('Obras')}</select></label><label class="field">Valor<input name="valor" type="number" min="0.01" step="0.01" required></label><label class="field">Data<input name="data" type="date" value="${todayISO()}" required></label><label class="field wide">Descrição<input name="descricao" maxlength="120" placeholder="Ex.: Reforma do posto de saúde"></label><div class="field wide"><button class="btn">💸 Enviar repasse</button></div></form>`:'<p class="gov-empty">Cadastre um município para enviar verba.</p>'}</section><section class="panel"><h2>Quem mais recebeu</h2>${rankBars(cities.map(c=>({label:c.nome,value:sumMov(m=>m.estado===st.id&&m.tipo==='repasse'&&m.municipio===c.id)})))}</section></div>`+
  `<section class="panel" style="margin-top:14px"><h2>Histórico de repasses</h2>${tr(list.map(m=>`<tr><td>${esc(fmtDate(m.data))}</td><td>${esc(cityName(m.municipio))}</td><td>${esc(m.categoria||'—')}</td><td>${esc(m.descricao||'—')}</td><td>${esc(money(m.valor))}</td><td class="actions-cell">${movActions(m)}</td></tr>`).join(''),['Data','Município','Finalidade','Descrição','Valor',''])}</section>`
}
function govArrecadacao(st){
  const cities=stateCities(st),month=monthKey(todayISO()),rate=govRate(st);
  const done=c=>data.movimentos.some(m=>m.tipo==='arrecadacao'&&m.municipio===c.id&&m.estado===st.id&&monthKey(m.data)===month);
  const pending=cities.filter(c=>!done(c)&&(Number(c.renda)||0)>0);
  return govHead('Arrecadação',`O estado recolhe ${num(rate)}% da renda mensal de cada município.`,pending.length?`<button class="btn" type="button" data-gov-collect-all>🧾 Arrecadar de todos (${num(pending.length)})</button>`:'')+
  `<div class="gov-grid"><section class="panel gov-compact"><h2>Tributos deste mês</h2>${tr(cities.map(c=>{const due=(Number(c.renda)||0)*rate/100;return `<tr><td>${esc(c.nome)}<small class="gov-sub">Renda ${esc(moneyShort(c.renda||0))}/mês</small></td><td>${esc(money(due))}</td><td>${done(c)?'<span class="gov-tag ok">✓ Arrecadado</span>':due>0?`<button class="btn gov-mini" type="button" data-gov-collect="${esc(c.id)}">Arrecadar</button>`:'<span class="muted">Sem renda</span>'}</td></tr>`}).join(''),['Município','Tributo','Situação'])}</section><section class="panel"><h2>Alíquota estadual</h2><p class="muted">Percentual cobrado sobre a renda das cidades (0 a 50%).</p><form id="govRateForm" class="form"><label class="field">Alíquota (%)<input name="aliquota" type="number" min="0" max="50" step="0.5" value="${esc(rate)}" required></label><div class="field"><button class="btn secondary">Salvar alíquota</button></div></form><h2 style="margin-top:18px">Arrecadado por cidade</h2>${rankBars(cities.map(c=>({label:c.nome,value:sumMov(m=>m.estado===st.id&&m.tipo==='arrecadacao'&&m.municipio===c.id)})))}</section></div>`
}
function govFinancas(st){
  const rows=[...data.movimentos.filter(m=>m.estado===st.id&&stateDelta(m,st.id)),...data.lancamentos.filter(l=>l.estado===st.id).map(l=>({...l,_union:true}))].sort(movSort);
  return govHead('Finanças estaduais','Receitas e despesas próprias do estado, além de repasses e tributos.')+movEditPanel()+
  `<div class="gov-grid"><section class="panel"><h2>Novo lançamento</h2><form id="govFinForm" class="form"><label class="field">Tipo<select name="tipo"><option value="receita">Receita</option><option value="despesa">Despesa</option></select></label><label class="field">Categoria<select name="categoria">${categoryOptions('Outros')}</select></label><label class="field">Valor<input name="valor" type="number" min="0.01" step="0.01" required></label><label class="field">Data<input name="data" type="date" value="${todayISO()}" required></label><label class="field wide">Descrição<input name="descricao" required maxlength="120" placeholder="Ex.: Folha de pagamento"></label><div class="field wide"><button class="btn">Registrar</button></div></form></section><section class="panel"><h2>Fluxo de caixa</h2><p class="muted">Últimos 6 meses · Caixa atual <b>${esc(money(stateCash(st)))}</b></p>${flowChart(monthlyFlows(stateEntries(st)))}</section></div>`+
  `<section class="panel" style="margin-top:14px"><h2>Extrato do estado</h2><p class="muted">Inclui a verba inicial de ${esc(money(st.verba||0))} e os repasses da União registrados no Cofre nacional.</p>${tr(rows.map(m=>`<tr><td>${esc(fmtDate(m.data)||'—')}</td><td>${esc(m._union?(m.tipo==='Saída'?'Repasse da União':'Pagamento à União'):movLabel(m))}</td><td>${esc(m._union?'União':m.categoria||'—')}</td><td>${signed(m._union?unionFlow(m):stateDelta(m,st.id))}</td><td class="actions-cell">${m._union?'':movActions(m)}</td></tr>`).join(''),['Data','Descrição','Categoria','Valor',''])}</section>`
}
function govDados(st){
  editStateId=st.id;
  const national=scope(current())==='nacional',governors=data.profiles.filter(p=>p.jurisdictionId===st.id&&scope(p)==='estadual');

}

// ---- Cofre nacional: saldo editável (atual ou inicial) e fluxo
function cofreOverview(){
  const sum=t=>data.lancamentos.filter(l=>l.tipo===t).reduce((a,l)=>a+(Number(l.valor)||0),0),inflow=sum('Entrada'),outflow=sum('Saída');
  const cards=`<div class="cards">${card('Saldo atual',money(balance()),'Disponível no cofre')}${card('Entradas',money(inflow),`${plural(data.lancamentos.filter(l=>l.tipo==='Entrada').length,'lançamento','lançamentos')}`)}${card('Saídas',money(outflow),`${plural(data.lancamentos.filter(l=>l.tipo==='Saída').length,'lançamento','lançamentos')}`)}${card('Saldo inicial',money(data.cofreInicial||0),'Base do cofre')}</div>`;
  if(scope(current())!=='nacional')return cards;
  return cards+`<div class="gov-grid" style="margin-bottom:14px"><section class="panel gov-edit-panel"><h2>Editar saldo do cofre</h2><p class="muted">Digite o saldo atual que o cofre deve ter, ou ajuste o saldo inicial. Os lançamentos continuam no histórico.</p><form id="cofreSaldoForm" class="form"><label class="field">Saldo atual<input name="saldoAtual" type="number" min="0" step="0.01" value="${esc(Math.round(balance()*100)/100)}" required></label><label class="field">Saldo inicial<input name="saldoInicial" type="number" step="0.01" value="${esc(Number(data.cofreInicial)||0)}" required></label><div class="field wide actions"><button class="btn">Salvar saldo</button></div></form></section><section class="panel"><h2>Fluxo do cofre</h2><p class="muted">Entradas e saídas dos últimos 6 meses.</p>${flowChart(monthlyFlows(()=>data.lancamentos.map(l=>[l.data,(l.tipo==='Entrada'?1:-1)*(Number(l.valor)||0)])))}</section></div>`
}

// ---- República editável: gráficos nacionais, histórico do PIB e edição de lançamentos/movimentos
function upsertPib(ano,valor){
  ano=Number(ano);if(!ano)return;const found=data.pibHistorico.find(x=>Number(x.ano)===ano);
  if(found)found.valor=Number(valor)||0;else data.pibHistorico.push({id:id(),ano,valor:Number(valor)||0})
}
function pibSeries(){
  const list=data.pibHistorico.map(x=>({ano:Number(x.ano),valor:Number(x.valor)||0})).filter(x=>x.ano);
  if(Number(data.ano)&&!list.some(x=>x.ano===Number(data.ano)))list.push({ano:Number(data.ano),valor:Number(data.pib)||0});
  return list.sort((a,b)=>a.ano-b.ano).slice(-8)
}
function barChart(rows,label){
  const W=320,H=150,base=H-20,max=Math.max(1,...rows.map(r=>r.value)),bw=W/rows.length;
  return `<svg class="gov-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line x1="0" y1="${base}" x2="${W}" y2="${base}" class="gov-axis"/>${rows.map((r,i)=>{const h=Math.round((base-20)*r.value/max),x=i*bw;return `<rect class="gov-bar-gold" x="${(x+bw*.2).toFixed(1)}" y="${base-h}" width="${(bw*.6).toFixed(1)}" height="${h}" rx="3"><title>${esc(r.label)}: ${esc(money(r.value))}</title></rect><text x="${(x+bw/2).toFixed(1)}" y="${base-h-4}" text-anchor="middle" class="gov-bar-val">${esc(moneyShort(r.value).replace('R$ ',''))}</text><text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(r.label)}</text>`}).join('')}</svg>`
}
function pibChart(){const rows=pibSeries();return rows.some(r=>r.valor>0)?barChart(rows.map(r=>({label:String(r.ano),value:r.valor})),'PIB por ano'):'<p class="gov-empty">Nenhum PIB informado ainda.</p>'}
function nationalInsights(){
  const cofreEntries=()=>data.lancamentos.map(l=>[l.data,(l.tipo==='Entrada'?1:-1)*(Number(l.valor)||0)]);
  const perState=data.estados.map(st=>({label:st.nome,value:data.lancamentos.filter(l=>l.estado===st.id&&l.tipo==='Saída').reduce((a,l)=>a+(Number(l.valor)||0),0)}));
  const states=data.estados.slice().sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const orphans=data.municipios.filter(c=>!data.estados.some(st=>st.id===c.estado));
  const cityRow=c=>`<div class="gov-feed-row gov-sub-row"><span>${entityAvatar(c,'municipio','mini')} ${esc(c.nome)}<small>${isBomRegresso(c)?'Sistema completo · ':''}${esc(c.prefeito||'Sem prefeito')} · ${num(c.populacao)} hab. · renda ${esc(moneyShort(c.renda||0))}/mês${isBomRegresso(c)?'':' · caixa '+esc(moneyShort(cityCash(c)))}</small></span><button class="btn secondary gov-mini" type="button" data-city-edit="${esc(c.id)}">✎ Editar</button></div>`;
  return `<div class="gov-grid" style="margin-top:14px"><section class="panel"><h2>Fluxo do cofre</h2><p class="muted">Entradas e saídas dos últimos 6 meses.</p>${flowChart(monthlyFlows(cofreEntries))}</section><section class="panel"><h2>Verba enviada aos estados</h2><p class="muted">Saídas do cofre nacional por estado.</p>${rankBars(perState)}<div class="actions"><button class="btn secondary" data-page="cofre">＋ Registrar verba</button></div></section><section class="panel"><h2>PIB por ano</h2><p class="muted">Série editável em Economia.</p>${pibChart()}<div class="actions"><button class="btn secondary" data-page="economia">✎ Editar PIB</button></div></section><section class="panel"><h2>Estados e municípios</h2><p class="muted">Edite nome, governante, verba, prefeito, população e renda.</p>${states.length||orphans.length?`<div class="gov-feed">${states.map(st=>`<div class="gov-feed-row"><span>${entityAvatar(st,'estado','mini')} <b>${esc(st.nome)}</b> · ${esc(st.sigla)}<small>${esc(st.governante||'Sem governante')} · verba inicial ${esc(moneyShort(st.verba||0))} · caixa ${esc(moneyShort(stateCash(st)))}</small></span><button class="btn secondary gov-mini" type="button" data-gov-edit="${esc(st.id)}">✎ Editar</button></div>${stateCities(st).map(cityRow).join('')}`).join('')}${orphans.map(cityRow).join('')}</div>`:'<p class="gov-empty">Nenhum estado cadastrado ainda.</p>'}</section>${recentActivities()}</div>`
}
function pibHistorySection(){
  const list=data.pibHistorico.slice().sort((a,b)=>Number(b.ano)-Number(a.ano)),edit=list.find(x=>x.id===editPibId);
  return `<section class="panel" style="margin-top:14px"><h2>Histórico do PIB</h2><p class="muted">Cada ano aparece no gráfico do Painel da Presidência.</p>${pibChart()}<form id="pibForm" class="form" style="margin-top:12px"><input type="hidden" name="id" value="${esc(edit?.id||'')}"><label class="field">Ano<input name="ano" type="number" min="1900" max="9999" value="${esc(edit?.ano||data.ano)}" required></label><label class="field">PIB do ano<input name="valor" type="number" min="0" step="0.01" value="${esc(edit?.valor??'')}" required></label><div class="field wide actions"><button class="btn">${edit?'Salvar ano':'＋ Adicionar ano'}</button>${edit?'<button class="btn secondary" type="button" data-pib-cancel>Cancelar</button>':''}</div></form>${tr(list.map(x=>`<tr><td>${esc(x.ano)}</td><td>${esc(money(x.valor))}</td><td class="actions-cell"><button class="btn secondary gov-mini" type="button" data-pib-edit="${esc(x.id)}">✎ Editar</button> <button class="btn danger gov-mini" type="button" data-pib-del="${esc(x.id)}">✕</button></td></tr>`).join(''),['Ano','PIB',''])}</section>`
}
function lancEditPanel(){
  const x=data.lancamentos.find(l=>l.id===editLancId);if(!x||scope(current())!=='nacional')return '';

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-gov-edit],[data-city-edit],[data-lanc-edit],[data-lanc-cancel],[data-mov-edit],[data-mov-cancel],[data-pib-edit],[data-pib-cancel],[data-pib-del]');
  if(!t||!current())return;
  formEditing=false;const national=scope(current())==='nacional';
  if(t.dataset.govEdit){const st=data.estados.find(x=>x.id===t.dataset.govEdit);if(!st||!canState(st))return;page='estados';govStateId=st.id;govTab='dados';render();window.scrollTo(0,0);return}
  if(t.dataset.cityEdit){const c=data.municipios.find(x=>x.id===t.dataset.cityEdit);if(!c||!canCity(c))return;if(isBomRegresso(c)||!canPage('municipios')){page='adminmunicipio';editCityId=c.id}else{page='municipios';govCityId=c.id;cityTab='dados'}render();window.scrollTo(0,0);return}
  if(t.dataset.lancEdit){if(!national)return;editLancId=t.dataset.lancEdit;render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-lanc-cancel')){editLancId='';render();return}
  if(t.dataset.movEdit){editMovId=t.dataset.movEdit;render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-mov-cancel')){editMovId='';render();return}
  if(t.dataset.pibEdit){if(!national)return;editPibId=t.dataset.pibEdit;render();return}
  if(t.hasAttribute('data-pib-cancel')){editPibId='';render();return}
  if(t.dataset.pibDel){if(!national||!confirm('Excluir este ano do histórico?'))return;data.pibHistorico=data.pibHistorico.filter(x=>x.id!==t.dataset.pibDel);editPibId='';save()}
});
document.addEventListener('submit',e=>{
  const f=e.target,fid=f.getAttribute('id');if(!['lancEditForm','movEditForm','pibForm','cofreSaldoForm'].includes(fid))return;
  e.preventDefault();const o=Object.fromEntries(new FormData(f).entries()),national=scope(current())==='nacional';
  if(fid==='cofreSaldoForm'){
    if(!national)return;const atual=Number(o.saldoAtual),inicial=Number(o.saldoInicial);
    if(!Number.isFinite(atual)||!Number.isFinite(inicial)||atual<0)return alert('Informe valores válidos.');
    const net=cofreNet(),changedCurrent=Math.abs(atual-Math.round(balance()*100)/100)>=0.005;
    // The current balance is what people think in; the stored base is adjusted so the ledger stays intact.
    const base=changedCurrent?Math.round((atual-net)*100)/100:inicial;
    if(base+net<0)return alert('Com esse saldo inicial o cofre ficaria negativo.');
    data.cofreInicial=base;save();return
  }
  if(fid==='pibForm'){
    if(!national)return;const ano=Number(o.ano),valor=Number(o.valor);if(!(ano>=1900&&ano<=9999)||!(valor>=0))return alert('Informe ano e PIB válidos.');
    const same=data.pibHistorico.find(x=>Number(x.ano)===ano&&x.id!==o.id);if(same&&o.id)return alert('Já existe um registro para este ano.');
    const x=data.pibHistorico.find(v=>v.id===o.id);if(x){x.ano=ano;x.valor=valor}else upsertPib(ano,valor);
    if(ano===Number(data.ano))data.pib=valor;editPibId='';save();return
  }
  if(fid==='lancEditForm'){
    if(!national)return;const x=data.lancamentos.find(l=>l.id===o.id);if(!x)return;const valor=Number(o.valor);if(!(valor>0))return alert('Informe um valor válido.');
    const effect=l=>(l.tipo==='Entrada'?1:-1)*(Number(l.valor)||0),next={...x,tipo:o.tipo==='Saída'?'Saída':'Entrada',valor,data:o.data||x.data,estado:o.estado||'',descricao:String(o.descricao||'').trim()||x.descricao};
    if(balance()-effect(x)+effect(next)<0)return alert('O valor supera o saldo do cofre.');
    Object.assign(x,next);editLancId='';save();return
  }
  const m=data.movimentos.find(x=>x.id===o.id);if(!m||!govCanMov(m))return;const valor=Number(o.valor);if(!(valor>0))return alert('Informe um valor válido.');
  const next={...m,valor,categoria:o.categoria||m.categoria,data:o.data||m.data,descricao:String(o.descricao||'').trim()};
  if(m.tipo==='repasse'&&o.municipio){const c=data.municipios.find(x=>x.id===o.municipio&&x.estado===m.estado);if(!c)return alert('Escolha um município do estado.');next.municipio=c.id}
  if((m.tipo==='receita'||m.tipo==='despesa')&&o.tipo)next.tipo=o.tipo==='despesa'?'despesa':'receita';
  const st=data.estados.find(x=>x.id===m.estado);
  if(st&&m.nivel==='estado'&&stateCash(st)-stateDelta(m,st.id)+stateDelta(next,st.id)<0)return alert(`Caixa estadual insuficiente. Disponível: ${money(stateCash(st))}.`);
  Object.assign(m,next);editMovId='';save()
});

// ---- Seleção de estado/município no mesmo formato da tela "Entrar" dos perfis
function govPicker(kind){

  let body;
  if(isState){
    const list=data.estados.filter(canState);
    const inState=data.municipios.filter(c=>list.some(st=>st.id===c.estado)),inPop=inState.reduce((a,c)=>a+(Number(c.populacao)||0),0);
    const summary=govSummary([['🗺️',num(list.length),list.length===1?'estado':'estados'],['🏘️',num(inState.length),inState.length===1?'município':'municípios'],['👥',num(inPop),inPop===1?'habitante':'habitantes'],...(level==='nacional'?[['💾',`${num(Math.round(payloadBytes()/1024))} KB`,'de 1.024 KB usados',payloadBytes()>PAYLOAD_LIMIT*.8]]:[])]);
    const row=st=>{const cities=stateCities(st);return `<button type="button" class="login-user" data-gov-open="${esc(st.id)}">${entityAvatar(st,'estado')}<span><b>${esc(st.nome)}</b><small>${esc(st.governante||'Sem governante')} · ${num(cities.length)} ${cities.length===1?'município':'municípios'} · ${esc(moneyShort(stateCash(st)))}</small></span><span class="login-arrow" aria-hidden="true">›</span></button>`};
    body=creating?`<h1>Novo estado</h1><p class="muted">Informe os dados do estado.</p><form id="estadoForm" class="profile-form"><label class="field">Nome<input name="nome" required maxlength="80" placeholder="Ex.: Serra Dourada"></label><label class="field">Sigla<input name="sigla" required maxlength="3" placeholder="Ex.: SD"></label><label class="field">Governante<input name="governante" maxlength="80"></label><label class="field">Verba inicial do estado<input name="verba" type="number" min="0" step="0.01" value="0" required></label>${lookEditor('estado','new-estado')}<div class="actions"><button class="btn login-submit" type="submit">Cadastrar estado</button><button class="btn secondary" type="button" data-gov-list>Voltar</button></div></form>`
      :`<h1>Estados</h1><p class="muted">Toque no estado para abrir o governo estadual.${canCreate?' Para criar um novo, use o botão abaixo.':''}</p>${list.length?summary:''}${govSearch('Buscar estado…',list.length)}<div class="login-list">${list.map(row).join('')||'<p class="empty">Nenhum estado cadastrado ainda.</p>'}</div>${canCreate?'<button type="button" class="btn add-profile" data-gov-new>＋ Cadastrar novo estado</button>':''}<small class="login-note">O estado abre o painel do governo estadual.</small>`;
  }else{
    const allowed=govAllowedCities(),states=data.estados.filter(st=>allowed.some(c=>c.estado===st.id)),orphans=allowed.filter(c=>!data.estados.some(st=>st.id===c.estado));
    const row=c=>`<button type="button" class="login-user" data-city-open="${esc(c.id)}">${entityAvatar(c,'municipio')}<span><b>${esc(c.nome)}</b><small>${isBomRegresso(c)?'Sistema completo':'Prefeito(a) '+esc(c.prefeito||'—')} · ${num(c.populacao)} hab.</small></span><span class="login-arrow" aria-hidden="true">›</span></button>`;
    const createStates=data.estados.filter(canState),allowedPop=allowed.reduce((a,c)=>a+(Number(c.populacao)||0),0);
    const summary=govSummary([['🏘️',num(allowed.length),allowed.length===1?'município':'municípios'],['👥',num(allowedPop),allowedPop===1?'habitante':'habitantes'],['📈',moneyShort(allowed.reduce((a,c)=>a+(Number(c.renda)||0),0)),'renda mensal']]);
    body=creating?`<h1>Novo município</h1><p class="muted">Informe os dados da cidade.</p><form id="municipioForm" class="profile-form"><label class="field">Nome do município<input name="nome" required maxlength="60" placeholder="Ex.: Vila Serena"></label>${createStates.length===1?`<input type="hidden" name="estado" value="${esc(createStates[0].id)}"><label class="field">Estado<input value="${esc(createStates[0].nome)}" readonly></label>`:`<label class="field">Estado<select name="estado" required><option value="">Selecione</option>${createStates.map(st=>`<option value="${esc(st.id)}">${esc(st.nome)}</option>`).join('')}</select></label>`}<label class="field">Prefeito(a)<input name="prefeito" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="0" required></label><label class="field">Renda mensal fictícia<input name="renda" type="number" min="0" step="0.01" value="0"></label>${lookEditor('municipio','new-municipio')}<div class="actions"><button class="btn login-submit" type="submit" ${createStates.length?'':'disabled'}>Cadastrar município</button><button class="btn secondary" type="button" data-gov-list>Voltar</button></div>${createStates.length?'':'<p class="note">Cadastre um estado antes de adicionar municípios.</p>'}</form>`

  }
  return `<div class="login-screen gov-picker"><div class="login-card">${top}${body}</div></div>`
}

// ---- Municípios: seleção e painel das cidades (Bom Regresso abre o sistema completo)
function municipios(){
  const p=current(),level=scope(p),open=govOpenCity();
  if(open){govCityId=open.id;return isBomRegresso(open)?prefeitura():govCityApp(open)}
  if(level==='municipal'||level==='administrativo')return heading('Município','Este perfil ainda não está vinculado a um município.');
  govCityId='';
  return govPicker('municipios')
}
function govCityApp(c){
  const tabs=CITY_TABS.filter(([k])=>k!=='dados'||cityManager()),tab=tabs.some(([k])=>k===cityTab)?cityTab:'painel',st=data.estados.find(x=>x.id===c.estado);
  const body=({painel:cityPainel,financas:cityFinancas,repasses:cityRepasses,dados:cityDados})[tab](c);
  const level=scope(current());
  return govShell({title:`Prefeitura de ${esc(c.nome)}`,avatar:entityAvatar(c,'municipio','mini'),subtitle:`${esc(st?.nome||'Sem estado')} · Prefeito(a): ${esc(c.prefeito||'—')}`,tabs,active:tab,tabAttr:'data-city-tab',exit:level==='nacional'||level==='estadual'?'<button class="btn secondary" type="button" data-city-exit title="Trocar município"><span class="gov-long">Trocar município</span><span class="gov-short">⇄ Cidades</span></button>':'',body})

// ---- ações
const govCanMov=m=>{const st=data.estados.find(x=>x.id===m.estado),c=data.municipios.find(x=>x.id===m.municipio);return m.nivel==='municipio'?!!c&&canCity(c):!!st&&canState(st)};
function govCollect(st,cities){
  const month=monthKey(todayISO()),rate=govRate(st),author=current()?.name||'';let count=0;
  for(const c of cities){
    const due=Math.round((Number(c.renda)||0)*rate)/100;
    if(due<=0||data.movimentos.some(m=>m.tipo==='arrecadacao'&&m.municipio===c.id&&m.estado===st.id&&monthKey(m.data)===month))continue;
    data.movimentos.push({id:id(),tipo:'arrecadacao',nivel:'estado',estado:st.id,municipio:c.id,categoria:'Impostos',valor:due,data:todayISO(),descricao:`${num(rate)}% da renda de ${MONTH_NAMES[new Date().getMonth()]}`,autor:author,createdAt:new Date().toISOString()});count++
  }
  if(!count)return alert('Nada a arrecadar: os tributos deste mês já foram recolhidos ou as cidades estão sem renda.');
  save()
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-page]:not(body)'))govPickerMode='list';

  if(t.dataset.govSend){govSendTo=t.dataset.govSend;govTab='repasses';render();window.scrollTo(0,0);return}
  const st=govOpenState();
  if(t.dataset.govCollect){const c=data.municipios.find(x=>x.id===t.dataset.govCollect);if(st&&c&&c.estado===st.id&&canState(st))govCollect(st,[c]);return}
  if(t.hasAttribute('data-gov-collect-all')){if(st&&canState(st))govCollect(st,stateCities(st));return}
  if(t.dataset.movDel){const m=data.movimentos.find(x=>x.id===t.dataset.movDel);if(!m||!govCanMov(m))return;if(!confirm('Excluir esta movimentação?'))return;data.movimentos=data.movimentos.filter(x=>x.id!==m.id);save();return}

  }
});
document.addEventListener('submit',e=>{
  const f=e.target,fid=f.getAttribute('id');if(fid==='estadoForm'||fid==='municipioForm'){govPickerMode='list';return}
  if(!['govTransferForm','govRateForm','govFinForm','cityFinForm'].includes(fid))return;

  const o=Object.fromEntries(new FormData(f).entries()),author=current()?.name||'',now=new Date().toISOString();
  if(fid==='cityFinForm'){
    const c=govOpenCity();if(!c||!canCity(c))return;const valor=Number(o.valor);if(!(valor>0))return alert('Informe um valor válido.');
    data.movimentos.push({id:id(),tipo:o.tipo==='despesa'?'despesa':'receita',nivel:'municipio',municipio:c.id,estado:c.estado,categoria:o.categoria,valor,data:o.data||todayISO(),descricao:String(o.descricao||'').trim(),autor:author,createdAt:now});save();return
  }
  const st=govOpenState();if(!st||!canState(st))return;
  if(fid==='govRateForm'){const rate=Number(o.aliquota);if(!(rate>=0&&rate<=50))return alert('A alíquota deve ficar entre 0 e 50%.');st.aliquota=rate;save();return}
  const valor=Number(o.valor);if(!(valor>0))return alert('Informe um valor válido.');
  if(fid==='govTransferForm'){
    const c=data.municipios.find(x=>x.id===o.municipio&&x.estado===st.id);if(!c)return alert('Escolha um município do estado.');
    if(valor>stateCash(st))return alert(`Caixa estadual insuficiente. Disponível: ${money(stateCash(st))}.`);
    data.movimentos.push({id:id(),tipo:'repasse',nivel:'estado',estado:st.id,municipio:c.id,categoria:o.categoria,valor,data:o.data||todayISO(),descricao:String(o.descricao||'').trim(),autor:author,createdAt:now});govSendTo='';save();return
  }
  if(fid==='govFinForm'){
    if(o.tipo==='despesa'&&valor>stateCash(st))return alert(`Caixa estadual insuficiente. Disponível: ${money(stateCash(st))}.`);
    data.movimentos.push({id:id(),tipo:o.tipo==='despesa'?'despesa':'receita',nivel:'estado',estado:st.id,categoria:o.categoria,valor,data:o.data||todayISO(),descricao:String(o.descricao||'').trim(),autor:author,createdAt:now});save()
  }
});
