const heading=(title,desc)=>`<h1>${title}</h1><p class="lead muted">${desc}</p>`,card=(label,value,detail)=>`<div class="card"><span class="card-icon" aria-hidden="true">${({'Cofre público':'💰','Estados':'🗺️','Municípios':'🏘️','PIB':'📈','Saldo atual':'💰','Movimentações':'📋','PIB anual':'📈','População cadastrada':'👥','PIB por habitante':'◫'})[label]||'◆'}</span><small>${label}</small><strong>${value}</strong><small>${detail}</small></div>`;

function perfil(){const p=current();return heading('Meu perfil','Personalize como seu nome aparece no aplicativo.')+`<section class="panel profile-panel"><div class="profile-hero">${avatar(p,'large')}<div><b>${esc(p.name)}</b><small>${esc(p.role)} · ${esc(p.sector)}</small></div></div><form id="profileForm" class="form"><label class="field">Nome<input name="name" value="${esc(p.name)}" required maxlength="60"></label><div class="field role-readonly"><b>Cargo e território</b><span>${esc(p.role)} · ${esc(data.estados.find(x=>x.id===p.jurisdictionId)?.nome||data.municipios.find(x=>x.id===p.jurisdictionId)?.nome||roleDescription(p.role))}</span><small>Alterações de cargo e território são feitas pela Presidência.</small></div><label class="field wide">Setor<input name="sector" value="${esc(p.sector)}" required maxlength="60" id="editSector"></label><label class="field">Emoji do perfil<div class="emoji-row" data-target="editEmoji"><button type="button" data-emoji="👑">👑</button><button type="button" data-emoji="🏛️">🏛️</button><button type="button" data-emoji="⭐">⭐</button><button type="button" data-emoji="👤">👤</button></div><input name="emoji" id="editEmoji" maxlength="8" value="${esc(p.emoji||'')}" placeholder="Ex.: 👑"></label><label class="field">Foto do perfil<input id="photoInput" name="photo" type="file" accept="image/*"><small>Escolha uma foto pequena do aparelho.</small></label><div class="field wide profile-actions"><button class="btn" type="submit">Salvar perfil</button><button class="btn secondary" type="button" data-remove-photo>Remover foto</button><button class="btn secondary" type="button" data-logout>Trocar de perfil</button></div></form></section><p class="muted profile-help">Este perfil escolhe o painel e o território exibido. Sem senha e sincronização online, os controles são apenas desta cópia local.</p>`}
async function processPhoto(file){if(!file)return;if(!file.type.startsWith('image/')){alert('Escolha um arquivo de imagem.');return}if(file.size>10*1024*1024){alert('A foto deve ter até 10 MB.');return}try{const url=URL.createObjectURL(file);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=256;canvas.height=256;const size=Math.min(img.naturalWidth,img.naturalHeight),x=(img.naturalWidth-size)/2,y=(img.naturalHeight-size)/2;ctx.drawImage(img,x,y,size,size,0,0,256,256);photoDraft=canvas.toDataURL('image/jpeg',.78);URL.revokeObjectURL(url);const preview=$('content')?.querySelector('.profile-hero .avatar');if(preview){preview.outerHTML=avatar({...current(),photo:photoDraft},'large')}}catch{alert('Não foi possível abrir a foto.')}}
function municipalProfilePayload(){
  const p=current(),city=municipalTargetCity();if(!p||!city)return null;
  const level=scope(p);
  if(level==='estadual')return null;
  if(level==='municipal'&&p.jurisdictionId!==city.id)return null;
  return {
    id:p.id,name:p.name,role:p.role,sector:p.sector||sectorForRole(p.role),
    jurisdictionId:level==='municipal'?'bom-regresso':city.id,
    parentJurisdictionId:city.estado||p.parentJurisdictionId||'',
    governmentLevel:level,sourceSystem:'pais-bom-regresso',
    photo:p.photo||'',emoji:p.emoji||''
  }
}
function connectMunicipalFrame(){
  const frame=$('municipalAppFrame'),status=$('municipalBridgeStatus'),p=municipalProfilePayload();
  if(!frame||!p||!municipalSystem())return;
  const requestId='municipal-'+Date.now().toString(36);
  let handoffSent=false,finished=false;
  const setStatus=(text,ok=false)=>{if(status){status.textContent=text;status.dataset.ok=ok?'1':'0'}};
  const target=/^https?:$/.test(location.protocol)?location.origin:'*';
  const onMessage=e=>{
    const msg=e.data;
    if(e.source!==frame.contentWindow||!msg||msg.protocol!==FEDERATION_PROTOCOL||msg.requestId!==requestId)return;
    if(msg.type==='MUNICIPAL_SYSTEM_DESCRIPTOR'&&!handoffSent){
      handoffSent=true;setStatus('Sistema municipal localizado. Entrando no perfil…');
      frame.contentWindow.postMessage({protocol:FEDERATION_PROTOCOL,type:'HANDOFF_PROFILE',requestId,payload:p},target);
      return
    }
    if(msg.type==='HANDOFF_RESULT'){
      finished=true;
      if(msg.payload?.ok)setStatus(msg.payload.requiresPassword?'Perfil sincronizado. Confirme a senha municipal para continuar.':'Perfil conectado ao sistema municipal.',true);
      else setStatus(msg.payload?.reason||'Não foi possível conectar o perfil municipal.');
      setTimeout(()=>window.removeEventListener('message',onMessage),4000)
    }
  };
  window.addEventListener('message',onMessage);
  const discover=()=>{
    if(finished)return;
    try{frame.contentWindow?.postMessage({protocol:FEDERATION_PROTOCOL,type:'DISCOVER_MUNICIPAL_SYSTEM',requestId},target)}catch{}
  };
  frame.addEventListener('load',()=>setTimeout(discover,140),{once:true});
  setTimeout(discover,380);
  setTimeout(()=>{if(!finished&&!handoffSent)setStatus('O sistema municipal abriu. Se o login integrado não responder, use o perfil municipal normalmente.')},3500)
}
function prefeitura(){
  const city=municipalTargetCity();
  if(!city)return heading('Municípios','Cadastre Bom Regresso para liberar o sistema municipal.');
  if(!municipalSystem()&&scope(current())!=='nacional')return heading('Sistema municipal','Este perfil não possui vínculo com Bom Regresso.');
  setTimeout(connectMunicipalFrame,0);
  const frame=location.protocol==='file:'&&MUNICIPAL_EMBED?`srcdoc="${esc(MUNICIPAL_EMBED)}"`:'src="../?embedded=1&federated=1"';
  return `<div class="municipal-tab-head"><div><span class="municipal-tab-kicker">MUNICÍPIO</span><h1>Bom Regresso</h1><p class="lead muted">Sistema municipal integrado à República Bom Regressense.</p></div><a class="btn secondary municipal-open-full" href="../" target="_top">Abrir em tela cheia</a></div><div class="municipal-integrated-head"><div><b>🏛️ Prefeitura de Bom Regresso</b><small id="municipalBridgeStatus">Conectando ao sistema municipal…</small></div></div><section class="panel municipal-app-panel"><iframe id="municipalAppFrame" class="municipal-app-frame" title="Sistema municipal de Bom Regresso" ${frame} loading="eager" allow="microphone; notifications; clipboard-read; clipboard-write"></iframe></section>`
}
function inicio(){const p=current(),level=scope(p);if(level!=='nacional'){const state=data.estados.find(x=>x.id===p.jurisdictionId),city=data.municipios.find(x=>x.id===p.jurisdictionId);if(level==='estadual'){if(!state)return heading('Governo estadual','Este perfil ainda não está vinculado a um estado.')+`<section class="panel"><h2>Aguardando estado</h2><p>A Presidência precisa cadastrar um estado e selecionar <b>Perfis → Atribuir</b> para vincular este governo.</p></section>`;const cities=data.municipios.filter(x=>x.estado===state.id),transfers=data.lancamentos.filter(x=>x.estado===state.id);return heading(`Governo de ${esc(state.nome)}`,`Governante: ${esc(state.governante||p.name)}`)+`<div class="cards">${card('Municípios',num(cities.length),'Neste estado')}${card('População cadastrada',num(cities.reduce((a,x)=>a+Number(x.populacao),0)),'Soma dos municípios')}${card('Verba prevista',money(state.verba),'Planejamento estadual')}${card('Movimentações',num(transfers.length),'Lançamentos ligados ao estado')}</div><div class="panel"><h2>Administração estadual</h2><p class="muted">Edite os dados do estado e acompanhe seus municípios.</p><div class="actions"><button class="btn secondary" data-page="estados">Editar meu estado</button><button class="btn secondary" data-page="adminmunicipio">Ver municípios</button></div></div>`}if(!city)return heading('Prefeitura','Este perfil ainda não está vinculado a um município.')+`<section class="panel"><h2>Aguardando município</h2><p>A Presidência precisa cadastrar um município e selecionar <b>Perfis → Atribuir</b> para vincular esta prefeitura.</p></section>`;const parent=data.estados.find(x=>x.id===city.estado);return heading(`Prefeitura de ${esc(city.nome)}`,`${esc(parent?.nome||'Estado não localizado')} · Prefeito(a): ${esc(city.prefeito||p.name)}`)+`<div class="cards">${card('População cadastrada',num(city.populacao),'Habitantes fictícios')}${card('Estado',esc(parent?.sigla||'—'),'Vínculo estadual')}</div><div class="panel"><h2>A const linkedGov=data.profiles.some(x=>scope(x)==='estadual'&&data.estados.some(e=>e.id===x.jurisdictionId)),linkedMayor=data.profiles.some(x=>scope(x)==='municipal'&&data.municipios.some(e=>e.id===x.jurisdictionId));const setupSteps=[['1','Cadastrar estado',data.estados.length>0,'estados'],['2','Vincular governador',linkedGov,'usuarios'],['3','Cadastrar município',data.municipios.length>0,'adminmunicipio'],['4','Vincular prefeito',linkedMayor,'usuarios']];const setup=setupSteps.every(x=>x[2])?'':`<section class="panel setup-panel"><h2>Organizar o país</h2><p class="muted">Siga as etapas para liberar os painéis estadual e municipal.</p><div class="setup-list">${setupSteps.map(([number,label,done,target])=>`<button class="setup-step ${done?'done':''}" data-page="${target}"><span>${done?'✓':number}</span><b>${label}</b><small>${done?'Concluído':'Abrir'}</small></button>`).join('')}</div></section>`;const despesas=data.lancamentos.filter(x=>x.tipo==='Saída').reduce((s,x)=>s+Number(x.valor),0),entradas=data.lancamentos.filter(x=>x.tipo==='Entrada').reduce((s,x)=>s+Number(x.valor),0);return heading('Painel da Presidência','Administração da República Bom Regressense.')+`<div class="cards">${card('Cofre público',money(balance()),'Saldo disponível')}${card('Estados',num(data.estados.length),'Cadastrados')}${card('Municípios',num(data.municipios.length),'Cadastrados')}${card('PIB',money(data.pib),`Ano ${esc(data.ano)}`)}</div>${setup}<div class="grid"><section class="panel"><h2>Movimentação recente</h2>${data.lancamentos.length?`<div class="recent-list">${data.lancamentos.slice().reverse().slice(0,6).map(x=>`<div class="recent-item"><span class="recent-icon">${x.tipo==='Entrada'?'↙':'↗'}</span><div><b>${esc(x.descricao)}</b><small>${esc(x.data)} · ${esc(x.tipo)}</small></div><strong>${x.tipo==='Entrada'?'+':'−'} ${money(x.valor)}</strong></div>`).join('')}</div>`:'<div class="empty-home"><span>📋</span><b>Nenhuma movimentação ainda</b><small>Os registros de verbas aparecerão aqui.</small></div>'}</section><section class="panel finance-panel"><h2>Resumo do cofre</h2><div class="kpi-line"><span>Entradas</span><b>${money(entradas)}</b></div><div class="kpi-line"><span>Saídas</span><b>${money(despesas)}</b></div><div class="kpi-line"><span>Saldo atual</span><b>${money(balance())}</b></div><div class="actions"><button class="btn secondary" data-page="cofre">＋ Registrar verba</button><button class="btn secondary" data-page="estados">🗺️ Administrar estados</button></div></section></div>`}
function estados(){const national=scope(current())==='nacional',items=data.estados.filter(canState),edit=items.find(x=>x.id===editStateId);return heading('Estados',national?'Administre os estados da República.':'Edite os dados do seu estado.')+(national?`<section class="panel"><h2>Novo estado</h2><form id="estadoForm" class="form"><label class="field">Nome<input name="nome" required maxlength="80"></label><label class="field">Sigla<input name="sigla" required maxlength="3"></label><label class="field">Governante<input name="governante" maxlength="80"></label><label class="field">Verba prevista<input name="verba" type="number" min="0" step="0.01" value="0" required></label><div class="field wide"><button class="btn">Adicionar estado</button></div></form></section>`:'')+(edit?`<section class="panel" style="margin-top:14px"><h2>Editar ${esc(edit.nome)}</h2><form id="stateEditForm" class="form"><input type="hidden" name="id" value="${edit.id}"><label class="field">Município<input name="nome" value="Bom Regresso" readonly></label><label class="field">Sigla<input name="sigla" value="${esc(edit.sigla)}" required maxlength="3"></label><label class="field">Governante<input name="governante" value="${esc(edit.governante||'')}" maxlength="80"></label><label class="field">Verba prevista<input name="verba" value="${esc(edit.verba)}" type="number" min="0" step="0.01" required></label><div class="field wide actions"><button class="btn">Salvar estado</button><button type="button" class="btn secondary" data-cancel-edit>Cancelar</button></div></form></section>`:'')+`<section class="panel" style="margin-top:14px"><h2>${national?'Estados cadastrados':'Meu estado'}</h2>${tr(items.map(x=>`<tr><td>${esc(x.nome)} <span class="pill">${esc(x.sigla)}</span></td><td>${esc(x.governante||'—')}</td><td>${money(x.verba)}</td><td class="actions-cell"><button class="btn secondary" data-edit-state="${x.id}">Editar</button>${national?` <button class="btn danger" data-delete="estados" data-id="${x.id}" function adminmunicipio(){const level=scope(current()),national=level==='nacional',allowedStates=data.estados.filter(canState),items=data.municipios.filter(canCity),edit=items.find(x=>x.id===editCityId),canCreate=level!=='municipal'&&!data.municipios.length;return heading('Municípios',level==='municipal'?'Edite os dados do seu município.':'Bom Regresso é o único município do país.')+(canCreate?`<section class="panel"><h2>Novo município</h2><form id="municipioForm" class="form"><label class="field">Município<input name="nome" value="Bom Regresso" readonly></label><label class="field">Estado<select name="estado" required><option value="">Selecione</option>${allowedStates.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label class="field">Prefeito(a)<input name="prefeito" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="0" required></label><div class="field wide"><button class="btn" ${!allowedStates.length?'disabled':''}>Adicionar município</button></div></form>${!allowedStates.length?'<p class="note">É preciso cadastrar ou vincular um estado antes de adicionar municípios.</p>':''}</section>`:'')+(edit?`<section class="panel" style="margin-top:14px"><h2>Editar ${esc(edit.nome)}</h2><form id="cityEditForm" class="form"><input type="hidden" name="id" value="${edit.id}"><label class="field">Município<input name="nome" value="Bom Regresso" readonly></label><label class="field">Prefeito(a)<input name="prefeito" value="${esc(edit.prefeito||'')}" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="${esc(edit.populacao)}" required></label><div class="field wide actions"><button class="btn">Salvar município</button><button type="button" class="btn secondary" data-cancel-edit>Cancelar</button></div></form></section>`:'')+`<section class="panel" style="margin-top:14px"><h2>${level==='municipal'?'Meu function municipios(){

}

function aparencia(){return heading('Aparência','Escolha como o painel aparece neste aparelho.')+`<section class="panel"><h2>Tema do aplicativo</h2><form id="aparenciaForm" class="form"><label class="field">Modo<select name="tema"><option value="claro" ${theme==='claro'?'selected':''}>Claro</option><option value="escuro" ${theme==='escuro'?'selected':''}>Escuro</option><option value="sistema" ${theme==='sistema'?'selected':''}>Acompanhar aparelho</option></select></label><div class="field" style="align-self:end"><button class="btn">Salvar aparência</button></div></form><p class="note">A escolha fica salva neste navegador.</p></section>`}function economia(){return heading('Economia e PIB','Indicadores simples definidos para a história de Bom Regresso.')+`<div class="cards">${card('PIB anual',money(data.pib),`Ano ${esc(data.ano)}`)}${card('População cadastrada',num(data.municipios.reduce((s,x)=>s+Number(x.populacao),0)),'Soma dos municípios')}${card('PIB por habitante',data.municipios.reduce((s,x)=>s+Number(x.populacao),0)?money(data.pib/data.municipios.reduce((s,x)=>s+Number(x.populacao),0)):'—','Estimativa simples')}</div><section class="panel"><h2>Atualizar indicadores</h2><form id="economiaForm" class="form"><label class="field">Ano<input name="ano" type="number" min="1900" max="9999" value="${esc(data.ano)}" required></label><label class="field">PIB anual estimado<input name="pib" type="number" min="0" step="0.01" value="${esc(data.pib)}" required></label><label class="field wide">Saldo inicial do cofre<input name="cofreInicial" type="number" min="0" step="0.01" value="${esc(data.cofreInicial)}" required></label><div class="field wide"><button class="btn">Salvar indicadores</button></div></form><p class="note">O PIB é um indicador informado manualmente. Ele não altera o dinheiro disponível no cofre.</p></section>`}
document.addEventListener('click',e=>{const login=e.target.closest('[data-login]');if(login){const p=data.profiles.find(x=>x.id===login.dataset.login);if(!p)return;p.lastUsedAt=Date.now();data.currentProfileId=p.id;save();return}const emoji=e.target.closest('[data-emoji]');if(emoji){const target=$(emoji.parentElement.dataset.target);if(target){target.value=emoji.dataset.emoji;target.dispatchEvent(new Event('input',{bubbles:true}))}return}if(e.target.closest('[data-logout]')){loginMode='select';data.currentProfileId='';photoDraft='';page='inicio';save();return}if(e.target.closest('[data-remove-photo]')){photoDraft='';const p=current();p.photo='';save();page='perfil';render();return}const userEdit=e.target.closest('[data-edit-user]');if(userEdit&&scope(current())==='nacional'){editUserId=userEdit.dataset.editUser;page='usuarios';render();return}if(e.target.closest('[data-cancel-user]')){editUserId='';render();return}const stateEdit=e.target.closest('[data-edit-state]');if(stateEdit){const x=data.estados.find(v=>v.id===stateEdit.dataset.editState);if(x&&canState(x)){editStateId=x.id;page='estados';render()}return}const cityEdit=e.target.closest('[data-edit-city]');if(cityEdit){const x=data.municipios.find(v=>v.id===cityEdit.dataset.editCity);if(x&&canCity(x)){editCityId=x.id;page='municipios';render()}return}if(e.target.closest('[data-cancel-edit]')){editStateId='';editCityId='';render();return}if(e.target.closest('[data-more]')){$('moreBackdrop').hidden=false;return}if(e.target.closest('[data-close-more]')||e.target.id==='moreBackdrop'){$('moreBackdrop').hidden=true;return}const nav=e.target.closest('[data-page]');if(nav){if(!canPage(nav.dataset.page))return;$('moreBackdrop').hidden=true;page=nav.dataset.page;render();window.scrollTo(0,0)}const del=e.target.closest('[data-delete]');if(del&&confirm('Excluir este registro?')){const type=del.dataset.delete;const key=del.dataset.id;if(type==='lancamentos'&&scope(current())!=='nacional')return;if(type==='estados'&&scope(cu
