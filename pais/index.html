<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2E59"><meta name="description" content="Painel fictício da Presidência de Bom Regresso"><title>País de Bom Regresso — Presidência</title><link rel="icon" href="brasao.svg"><style>
:root{--navy:#0B2E59;--navy2:#123F73;--gold:#D7A93E;--bg:#EEF2F6;--line:#DCE4EB;--text:#26323D;--muted:#667684}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 12px}.brand{padding:10px 12px 22px;border-bottom:1px solid #ffffff25;margin-bottom:16px}.brand b{display:block;color:var(--gold);font-size:21px}.brand small{display:block;margin-top:5px;color:#c7d7e5}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#fff;text-align:left;border-radius:11px;padding:12px;font-weight:700}.nav button.active,.nav button:hover{background:var(--navy2)}main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:17px 28px;color:var(--navy);font-weight:800}.content{max-width:1400px;padding:28px;margin:auto}h1{color:var(--navy);font-size:29px;margin:0 0 5px}h2{color:var(--navy);font-size:20px;margin:0 0 14px}p{line-height:1.5}.muted{color:var(--muted)}.lead{margin:0 0 23px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px #0b2e5909}.card{border-top:5px solid var(--gold)}.card small{display:block;color:var(--muted);font-weight:700}.card strong{display:block;color:var(--navy);font-size:26px;margin:7px 0}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--gold);color:var(--navy);font-weight:800}.btn.secondary{background:#e7edf3}.btn.danger{background:#f8e7e7;color:#9b3636}.tablebox{overflow-x:auto}.table{border-collapse:collapse;width:100%;min-width:580px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #ebeff3;font-size:14px}.table th{background:#e8eef3;color:var(--navy)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px;font-weight:700;color:var(--navy);font-size:14px}.field.wide{grid-column:1/-1}input,select,textarea{width:100%;border:1px solid #cbd7e1;border-radius:9px;padding:10px;background:#fff;color:var(--text);min-height:43px}textarea{min-height:85px}.note{background:#e8eef3;border-radius:11px;padding:12px 14px;margin:12px 0}.empty{color:var(--muted);padding:18px;text-align:center}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#e8eef3;color:var(--navy);font-size:13px;font-weight:700}.mobile{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.top{padding:14px 18px}.content{padding:20px 15px 100px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.mobile{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:5px 3px calc(5px + env(safe-area-inset-bottom));z-index:3}.mobile button{background:transparent;border:0;color:var(--navy);font-size:11px;padding:8px 2px}.mobile button.active{background:#e8eef3;border-radius:9px;font-weight:800}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.card{padding:12px}.card strong{font-size:20px}.form{grid-template-columns:1fr}.field.wide{grid-column:auto}}

ground:#E8F0F8;color:var(--navy);border-radius:11px;font-weight:900}.empty-home{min-height:156px;display:grid;align-content:center;justify-items:center;gap:7px;color:var(--muted);text-align:center}.empty-home span{font-size:30px}.empty-home b{color:var(--navy);font-size:14px}.empty-home small{font-size:12px}.more-backdrop[hidden]{display:none}.more-backdrop{position:fixed;inset:0;background:#081a2aba;z-index:7;display:flex;align-items:flex-end}.more-sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px #081a2a30}.more-head{display:flex;align-items:center;justify-content:space-between;color:var(--navy);margin-bottom:12px;font-size:18px}.close-more{border:0;background:#E8EEF3;color:var(--navy);border-radius:10px;width:34px;height:34px;font-size:24px}.more-sheet #moreItems{display:grid;gap:9px}.more-sheet #moreItems button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--navy);font-weight:800;text-align:left}.more-sheet #moreItems span{font-size:20px}.mobile{display:none}html[data-theme="dark"] .top-badge,html[data-theme="dark"] .recent-icon{background:#273F55}html[data-theme="dark"] .top-seal{background:#0B2E59}html[data-theme="dark"] .more-sheet{background:#182838}html[data-theme="dark"] .more-sheet #moreItems button,html[data-theme="dark"] .close-more{background:#273F55;color:#E6EEF6}
@media(max-width:900px){.top{width:100%;padding:11px 16px;min-height:62px}.content{padding:19px 13px 105px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:111px;padding:14px}.grid{gap:12px}.panel{padding:15px}.mobile{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;width:100%;min-height:69px;padding:5px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -9px 25px #0b2e5917}.mobile button{min-width:0;min-height:55px;display:grid;align-content:center;justify-items:center;gap:2px;padding:4px 1px;font-size:10px;color:#667684;position:relative}.mobile button span{display:grid;place-items:center;width:38px;height:29px;border-radius:10px;font-size:21px;line-height:1}.mobile button b{font-weight:700}.mobile button.active{background:transparent;color:var(--navy)}.mobile button.active span{background:#E6EEF7}.mobile button.active:after{content:'';position:absolute;bottom:0;width:18px;height:3px;border-radius:9px;background:var(--gold)}html[data-theme="dark"] .mobile button.active span{background:#284968}}

e="dark"] .top-badge{background:#ffffff20;color:#fff}html[data-theme="dark"] .card{background:#182838}html[data-theme="dark"] .finance-panel .kpi-line b{color:var(--navy)}

</style></head><body><div class="shell"><aside class="side"><div class="brand"><img src="brasao.svg" alt="Brasão de Bom Regresso"><b>Bom Regresso</b><small>Presidência · Sistema nacional</small></div><nav class="nav" id="nav"></nav></aside><main><div class="top"><img class="top-logo" src="brasao.svg" alt=""><div class="top-title"><strong>REPÚBLICA DE BOM REGRESSO</strong><small>SISTEMA DA PRESIDÊNCIA</small></div><span class="top-badge">Nacional</span></div><div class="content" id="content"></div></main></div><nav class="mobile" id="mobile"></nav><div class="more-backdrop" id="moreBackdrop" hidden><div class="more-sheet"><div class="more-head"><b>Mais opções</b><button type="button" class="close-more" aria-label="Fechar menu" data-close-more>×</button></div><div id="moreItems"></div></div></div><script>
(()=>{'use strict';const KEY='bom_regresso_pais_v1';const sections=[['inicio','🏠','Início'],['estados','🗺️','Estados'],['municipios','🏘️','Municípios'],['cofre','💰','Cofre'],['economia','📈','Economia'],['aparencia','🎨','Aparência']];const defaults=()=>({cofreInicial:1000000,estados:[],municipios:[],lancamentos:[],pib:0,ano:new Date().getFullYear()});let data;try{data=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{data=defaults()}let page='inicio';const THEME_KEY='bom_regresso_pais_theme_v1';let theme=localStorage.getItem(THEME_KEY)||'claro';if(!['claro','escuro','sistema'].includes(theme))theme='claro';const applyTheme=()=>{document.documentElement.dataset.theme=theme==='sistema'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):(theme==='escuro'?'dark':'light')};applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=n=>Number(n||0).toLocaleString('pt-BR'),id=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()},balance=()=>Number(data.cofreInicial||0)+data.lancamentos.reduce((s,x)=>s+(x.tipo==='Entrada'?1:-1)*Number(x.valor),0),tr=(rows,cols)=>`<div class="tablebox"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="empty">Nenhum registro ainda.</td></tr>`}</tbody></table></div>`;
function render(){$('nav').innerHTML=sections.map(([key,icon,label])=>`<button class="${page===key?'active':''}" data-page="${key}"><span class="nav-icon">${icon}</span>${label}</button>`).join('');$('mobile').innerHTML=sections.slice(0,4).map(([key,icon,label])=>`<button class="${page===key?'active':''}" data-page="${key}"><span>${icon}</span><b>${label}</b></button>`).join('')+`<button class="${['economia','aparencia'].includes(page)?'active':''}" data-more><span>☰</span><b>Mais</b></button>`;$('moreItems').innerHTML=sections.slice(4).map(([key,icon,label])=>`<button data-page="${key}"><span>${icon}</span>${label}</button>`).join('');$('content').innerHTML=({inicio,estados,municipios,cofre,economia,aparencia})[page]();}const heading=(title,desc)=>`<h1>${title}</h1><p class="lead muted">${desc}</p>`,card=(label,value,detail)=>`<div class="card"><span class="card-icon" aria-hidden="true">${({'Cofre público':'💰','Estados':'🗺️','Municípios':'🏘️','PIB':'📈','Saldo atual':'💰','Movimentações':'📋','PIB anual':'📈','População cadastrada':'👥','PIB por habitante':'◫'})[label]||'◆'}</span><small>${label}</small><strong>${value}</strong><small>${detail}</small></div>`;
function inicio(){const despesas=data.lancamentos.filter(x=>x.tipo==='Saída').reduce((s,x)=>s+Number(x.valor),0),entradas=data.lancamentos.filter(x=>x.tipo==='Entrada').reduce((s,x)=>s+Number(x.valor),0);return heading('Painel da Presidência','Administração da República de Bom Regresso.')+`<div class="cards">${card('Cofre público',money(balance()),'Saldo disponível')}${card('Estados',num(data.estados.length),'Cadastrados')}${card('Municípios',num(data.municipios.length),'Cadastrados')}${card('PIB',money(data.pib),`Ano ${esc(data.ano)}`)}</div><div class="grid"><section class="panel"><h2>Movimentação recente</h2>${data.lancamentos.length?`<div class="recent-list">${data.lancamentos.slice().reverse().slice(0,6).map(x=>`<div class="recent-item"><span class="recent-icon">${x.tipo==='Entrada'?'↙':'↗'}</span><div><b>${esc(x.descricao)}</b><small>${esc(x.data)} · ${esc(x.tipo)}</small></div><strong>${x.tipo==='Entrada'?'+':'−'} ${money(x.valor)}</strong></div>`).join('')}</div>`:'<div class="empty-home"><span>📋</span><b>Nenhuma movimentação ainda</b><small>Os registros de verbas aparecerão aqui.</small></div>'}</section><section class="panel finance-panel"><h2>Resumo do cofre</h2><div class="kpi-line"><span>Entradas</span><b>${money(entradas)}</b></div><div class="kpi-line"><span>Saídas</span><b>${money(despesas)}</b></div><div class="kpi-line"><span>Saldo atual</span><b>${money(balance())}</b></div><div class="actions"><button class="btn secondary" data-page="cofre">＋ Registrar verba</button><button class="btn secondary" data-page="estados">🗺️ Administrar estados</button></div></section></div>`}
function estados(){return heading('Estados','Cadastre estados e acompanhe suas verbas.')+`<section class="panel"><h2>Novo estado</h2><form id="estadoForm" class="form"><label class="field">Nome<input name="nome" required maxlength="80" placeholder="Ex.: Estado Central"></label><label class="field">Sigla<input name="sigla" required maxlength="3" placeholder="EC"></label><label class="field">Governante<input name="governante" maxlength="80" placeholder="Nome do governante"></label><label class="field">Verba prevista<input name="verba" type="number" min="0" step="0.01" value="0" required></label><div class="field wide"><button class="btn">Adicionar estado</button></div></form></section><section class="panel" style="margin-top:14px"><h2>Estados cadastrados</h2>${tr(data.estados.map(x=>`<tr><td>${esc(x.nome)} <span class="pill">${esc(x.sigla)}</span></td><td>${esc(x.governante||'—')}</td><td>${money(x.verba)}</td><td><button class="btn danger" data-delete="estados" data-id="${x.id}">Excluir</button></td></tr>`).join(''),['Estado','Governante','Verba prevista','Ações'])}</section>`}
function municipios(){return heading('Municípios','Organize os municípios dentro dos estados.')+`<section class="panel"><h2>Novo município</h2><form id="municipioForm" class="form"><label class="field">Nome<input name="nome" required maxlength="80"></label><label class="field">Estado<select name="estado" required><option value="">Selecione</option>${data.estados.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label class="field">Prefeito(a)<input name="prefeito" maxlength="80"></label><label class="field">População fictícia<input name="populacao" type="number" min="0" step="1" value="0" required></label><div class="field wide"><button class="btn" ${!data.estados.length?'disabled':''}>Adicionar município</button></div></form>${!data.estados.length?'<p class="note">Cadastre um estado antes de adicionar municípios.</p>':''}</section><section class="panel" style="margin-top:14px"><h2>Municípios cadastrados</h2>${tr(data.municipios.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(data.estados.find(e=>e.id===x.estado)?.nome||'—')}</td><td>${esc(x.prefeito||'—')}</td><td>${num(x.populacao)}</td><td><button class="btn danger" data-delete="municipios" data-id="${x.id}">Excluir</button></td></tr>`).join(''),['Município','Estado','Prefeito(a)','População','Ações'])}</section>`}
function cofre(){return heading('Cofre público','Registre receitas, gastos e repasses de verba.')+`<div class="cards">${card('Saldo atual',money(balance()),'Entradas menos saídas')}${card('Movimentações',num(data.lancamentos.length),'Registros')}</div><section class="panel"><h2>Novo lançamento</h2><form id="lancamentoForm" class="form"><label class="field">Tipo<select name="tipo"><option>Entrada</option><option>Saída</option></select></label><label class="field">Valor<input name="valor" type="number" min="0.01" step="0.01" required></label><label class="field">Data<input name="data" type="date" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}" required></label><label class="field">Destino / origem<select name="estado"><option value="">Cofre nacional</option>${data.estados.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label class="field wide">Descrição<input name="descricao" required maxlength="140" placeholder="Ex.: Repasse para obras"></label><div class="field wide"><button class="btn">Registrar lançamento</button></div></form></section><section class="panel" style="margin-top:14px"><h2>Histórico financeiro</h2>${tr(data.lancamentos.slice().reverse().map(x=>`<tr><td>${esc(x.data)}</td><td>${esc(x.descricao)}</td><td>${esc(data.estados.find(e=>e.id===x.estado)?.nome||'Cofre nacional')}</td><td>${esc(x.tipo)}</td><td>${money(x.valor)}</td><td><button class="btn danger" data-delete="lancamentos" data-id="${x.id}">Excluir</button></td></tr>`).join(''),['Data','Descrição','Destino / origem','Tipo','Valor','Ações'])}</section>`}
function aparencia(){return heading('Aparência','Escolha como o painel aparece neste aparelho.')+`<section class="panel"><h2>Tema do aplicativo</h2><form id="aparenciaForm" class="form"><label class="field">Modo<select name="tema"><option value="claro" ${theme==='claro'?'selected':''}>Claro</option><option value="escuro" ${theme==='escuro'?'selected':''}>Escuro</option><option value="sistema" ${theme==='sistema'?'selected':''}>Acompanhar aparelho</option></select></label><div class="field" style="align-self:end"><button class="btn">Salvar aparência</button></div></form><p class="note">A escolha fica salva neste navegador.</p></section>`}function economia(){return heading('Economia e PIB','Indicadores simples definidos para a história de Bom Regresso.')+`<div class="cards">${card('PIB anual',money(data.pib),`Ano ${esc(data.ano)}`)}${card('População cadastrada',num(data.municipios.reduce((s,x)=>s+Number(x.populacao),0)),'Soma dos municípios')}${card('PIB por habitante',data.municipios.reduce((s,x)=>s+Number(x.populacao),0)?money(data.pib/data.municipios.reduce((s,x)=>s+Number(x.populacao),0)):'—','Estimativa simples')}</div><section class="panel"><h2>Atualizar indicadores</h2><form id="economiaForm" class="form"><label class="field">Ano<input name="ano" type="number" min="1900" max="9999" value="${esc(data.ano)}" required></label><label class="field">PIB anual estimado<input name="pib" type="number" min="0" step="0.01" value="${esc(data.pib)}" required></label><label class="field wide">Saldo inicial do cofre<input name="cofreInicial" type="number" min="0" step="0.01" value="${esc(data.cofreInicial)}" required></label><div class="field wide"><button class="btn">Salvar indicadores</button></div></form><p class="note">O PIB é um indicador informado manualmente. Ele não altera o dinheiro disponível no cofre.</p></section>`}
document.addEventListener('click',e=>{if(e.target.closest('[data-more]')){$('moreBackdrop').hidden=false;return}if(e.target.closest('[data-close-more]')||e.target.id==='moreBackdrop'){$('moreBackdrop').hidden=true;return}const nav=e.target.closest('[data-page]');if(nav){$('moreBackdrop').hidden=true;page=nav.dataset.page;render();window.scrollTo(0,0)}const del=e.target.closest('[data-delete]');if(del&&confirm('Excluir este registro?')){const type=del.dataset.delete;const key=del.dataset.id;if(type==='estados'&&data.municipios.some(x=>x.estado===key)){alert('Remova primeiro os municípios deste estado.');return}if(type==='estados'&&data.lancamentos.some(x=>x.estado===key)){alert('Remova primeiro os lançamentos vinculados a este estado.');return}data[type]=data[type].filter(x=>x.id!==key);save()}});document.addEventListener('submit',e=>{if(!['estadoForm','municipioForm','lancamentoForm','economiaForm','aparenciaForm'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());if(e.target.id==='aparenciaForm'){theme=o.tema;localStorage.setItem(THEME_KEY,theme);applyTheme();render();return}if(e.target.id==='economiaForm'){data.ano=Number(o.ano);data.pib=Number(o.pib);data.cofreInicial=Number(o.cofreInicial)}else if(e.target.id==='estadoForm'){if(data.estados.some(x=>x.nome.toLowerCase()===o.nome.trim().toLowerCase()||x.sigla.toLowerCase()===o.sigla.trim().toLowerCase())){alert('Já existe um estado com este nome ou sigla.');return}data.estados.push({...o,id:id(),nome:o.nome.trim(),sigla:o.sigla.trim().toUpperCase(),verba:Number(o.verba)})}else if(e.target.id==='municipioForm'){if(!data.estados.some(x=>x.id===o.estado))return;data.municipios.push({...o,id:id(),populacao:Number(o.populacao)})}else{if(o.tipo==='Saída'&&Number(o.valor)>balance()){alert('O valor supera o saldo do cofre.');return}data.lancamentos.push({...o,id:id(),valor:Number(o.valor)})}save()});render()})();
</script></body></html>
