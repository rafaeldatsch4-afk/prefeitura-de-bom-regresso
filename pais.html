function aparencia(){return heading('Aparência','Escolha como o painel aparece neste aparelho.')+`<section class="panel"><h2>Tema do aplicativo</h2><form id="aparenciaForm" class="form"><label class="field">Modo<select name="tema"><option value="claro" ${theme==='claro'?'selected':''}>Claro</option><option value="escuro" ${theme==='escuro'?'selected':''}>Escuro</option><option value="sistema" ${theme==='sistema'?'selected':''}>Acompanhar aparelho</option></select></label><div class="field" style="align-self:end"><button class="btn">Salvar aparência</button></div></form><p class="note">A escolha fica salva neste navegador.</p></section>`}function economia(){return heading('Economia e PIB','Indicadores simples definidos para a história de Bom Regresso.')+`<div class="cards">${card('PIB anual',money(data.pib),`Ano ${esc(data.ano)}`)}${card('População cadastrada',num(data.municipios.reduce((s,x)=>s+Number(x.populacao),0)),'Soma dos municípios')}${card('PIB por habitante',data.municipios.reduce((s,x)=>s+Number(x.populacao),0)?money(data.pib/data.municipios.reduce((s,x)=>s+Number(x.populacao),0)):'—','Estimativa simples')}</div><section class="panel"><h2>Atualizar indicadores</h2><form id="economiaForm" class="form"><label class="field">Ano<input name="ano" type="number" min="1900" max="9999" value="${esc(data.ano)}" required></label><label class="field">PIB anual estimado<input name="pib" type="number" min="0" step="0.01" value="${esc(data.pib)}" required></label><label class="field wide">Saldo inicial do cofre<input name="cofreInicial" type="number" min="0" step="0.01" value="${esc(data.cofreInicial)}" required></label><div class="field wide"><button class="btn">Salvar indicadores</button></div></form><p class="note">O PIB é um indicador informado manualmente. Ele não altera o dinheiro disponível no cofre.</p></section>`}

rrent())!=='nacional')return;if(type==='municipios'&&scope(current())==='municipal')return;if(type==='municipios'&&!canCity(data.municipios.find(x=>x.id===key)))return;if(type==='estados'&&data.municipios.some(x=>x.estado===key)){alert('Remova primeiro os municípios deste estado.');return}if(type==='estados'&&data.lancamentos.some(x=>x.estado===key)){alert('Remova primeiro os lançamentos vinculados a este estado.');return}data[type]=data[type].filter(x=>x.id!==key);save()}});document.addEventListener('submit',e=>{if(!['createProfileForm','profileForm','adminCreateForm','adminEditForm','stateEditForm','cityEditForm','estadoForm','municipioForm','lancamentoForm','economiaForm','aparenciaForm'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());if(e.target.id==='createProfileForm'){if(data.profiles.length)return;const p={id:id(),name:o.name.trim(),role:o.role,sector:o.sector.trim(),emoji:(o.emoji||'').trim(),photo:'',jurisdictionId:o.jurisdictionId||'',lastUsedAt:Date.now()};if(!p.name||!p.sector)return;data.profiles.push(p);data.currentProfileId=p.id;save();return}if(e.target.id==='adminCreateForm'){if(scope(current())!=='nacional')return;const p={id:id(),name:o.name.trim(),role:o.role,sector:o.sector.trim(),jurisdictionId:o.jurisdictionId||'',emoji:(o.emoji||'').trim(),photo:'',lastUsedAt:0};if(!p.name||!p.sector||!roles.includes(p.role))return;if(p.jurisdictionId&&!((scope(p)==='estadual'?data.estados:data.municipios).some(x=>x.id===p.jurisdictionId))){alert('Escolha um território cadastrado para este cargo.');return}data.profiles.push(p);save();return}if(e.target.id==='adminEditForm'){if(scope(current())!=='nacional')return;const p=data.profiles.find(x=>x.id===o.id&&x.id!==current().id);if(!p||!roles.includes(o.role))return;if(o.jurisdictionId&&!((roles.slice(2,4).includes(o.role)?data.estados:data.municipios).some(x=>x.id===o.jurisdictionId))){alert('Escolha um território cadastrado para este cargo.');return}p.role=o.role;p.jurisdictionId=o.jurisdictionId||'';p.sector=o.sector.trim();editUserId='';save();return}if(e.target.id==='profileForm'){const p=current();if(!p)return;p.name=o.name.trim();p.sector=o.sector.trim();p.emoji=o.emoji.trim();if(photoDraft)p.photo=photoDraft;photoDraft='';save();return}if(e.target.id==='stateEditForm'){const x=data.estados.find(v=>v.id===o.id);if(!x||!canState(x))return;x.nome=o.nome.trim();x.sigla=o.sigla.trim().toUpperCase();x.governante=o.governante.trim();x.verba=Number(o.verba);editStateId='';save();return}if(e.target.id==='cityEditForm'){const x=data.municipios.find(v=>v.id===o.id);if(!x||!canCity(x))return;x.nome='Bom Regresso';x.prefeito=o.prefeito.trim();x.populacao=Number(o.populacao);editCityId='';save();return}if(e.target.id==='aparenciaForm'){theme=o.tema;localStorage.setItem(THEME_KEY,theme);applyTheme();render();return}if(e.target.id==='economiaForm'){if(scope(current())!=='nacional')return;data.ano=Number(o.ano);data.pib=Number(o.pib);data.cofreInicial=Number(o.cofreInicial)}else if(e.target.id==='estadoForm'){if(scope(current())!=='nacional')return;if(data.estados.some(x=>x.nome.toLowerCase()===o.nome.trim().toLowerCase()||x.sigla.toLowerCase()===o.sigla.trim().toLowerCase())){alert('Já existe um estado com este nome ou sigla.');return}data.estados.push({...o,id:id(),nome:o.nome.trim(),sigla:o.sigla.trim().toUpperCase(),verba:Number(o.verba)})}else if(e.target.id==='municipioForm'){if(scope(current())==='municipal'||data.municipios.length||!data.estados.some(x=>x.id===o.estado&&canState(x)))return;data.municipios.push({...o,id:id(),nome:'Bom Regresso',populacao:Number(o.populacao)})}else{if(scope(current())!=='nacional')return;if(o.tipo==='Saída'&&Number(o.valor)>balance()){alert('O valor supera o saldo do cofre.');return}data.lancamentos.push({...o,id:id(),valor:Number(o.valor)})}save()});document.addEventListener('change',e=>{if(e.target.id==='photoInput'){processPhoto(e.target.files?.[0]);return}if(['adminRole','assignRole','newRole','editRole'].includes(e.target.id)){const role=e.target.value,sector=sectorForRole(role);const field=$(({adminRole:'adminSector',assignRole:'assignSector',newRole:'newSector',editRole:'editSector'})[e.target.id]),description=$(({adminRole:'adminRoleDescription',assignRole:'assignRoleDescription',newRole:'newRoleDescription',editRole:'editRoleDescription'})[e.target.id]);if(field)field.value=sector;if(description)description.textContent=roleDescription(role);const box=$(({adminRole:'adminJurisdiction',assignRole:'assignJurisdiction',newRole:'newJurisdiction',editRole:'editJurisdiction'})[e.target.id]);if(box)box.innerHTML=jurisdictionFields(role)}});document.addEventListener('input',e=>{if(e.target.id==='editEmoji'){const p=current(),preview=$('content')?.querySelector('.profile-hero .avatar');if(preview&&!p.photo)preview.outerHTML=avatar({...p,emoji:e.target.value},'large')}});render()})();
</script></body></html>
