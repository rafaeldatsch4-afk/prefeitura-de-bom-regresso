const searchNorm=v=>String(v??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const searchText=x=>{const out=[];const walk=v=>{if(v==null)return;if(typeof v==='object'){for(const k in v)if(!/^(id|.*Id|photo|createdAt|updatedAt)$/.test(k))walk(v[k])}else out.push(String(v))};walk(x);return searchNorm(out.join(' '))};
let searchTimer=0;
function openSearch(){
  showModal('Buscar no sistema',`<label class="search-box"><span aria-hidden="true">🔍</span><input id="gSearch" type="search" autocomplete="off" placeholder="Nome, placa, contrato, produtor…" aria-label="Buscar no sistema" oninput="App.globalSearch(this.value)" onkeydown="if(event.key==='Enter'){const b=document.querySelector('#gSearchResults .search-hit-btn');if(b){event.preventDefault();b.click()}}"></label><div id="gSearchResults" class="search-results" aria-live="polite"><p class="muted">Digite pelo menos 2 letras. A busca olha servidores, pagamentos, contratos, lançamentos, máquinas, implementos, agendamentos, licitações, caminhões, viagens e transportadoras.</p></div>`,()=>setTimeout(()=>document.getElementById('gSearch')?.focus(),30))
}
function globalSearch(q){clearTimeout(searchTimer);searchTimer=setTimeout(()=>runSearch(q),120)}
function runSearch(q){
  const box=document.getElementById('gSearchResults');if(!box)return;const words=searchNorm(q).split(/\s+/).filter(Boolean);
  if(!words.length||searchNorm(q).trim().length<2){box.innerHTML='<p class="muted">Digite pelo menos 2 letras.</p>';return}
  let total=0;const groups=[];
  for(const [col,pg,tab,icon,label,title,meta] of SEARCH_SETS){
    if(!canPage(pg))continue;const list=(db[col]||[]).filter(x=>{const t=searchText(x);return words.every(w=>t.includes(w))});
    if(!list.length)continue;total+=list.length;
    groups.push(`<div class="search-group"><h4>${icon} ${esc(label)} <small>${list.length}</small></h4>${list.slice(0,8).map(x=>{const t=String(title(x)||'—');return `<button type="button" class="search-hit-btn" onclick="App.searchOpen(${jsArg(pg)},${jsArg(tab)},${jsArg(t)})"><b>${esc(t)}</b><small>${esc(meta(x).filter(v=>v!=null&&v!=='').join(' · '))}</small></button>`}).join('')}${list.length>8?`<p class="muted search-more">+ ${list.length-8} ${list.length-8===1?'resultado':'resultados'} nesta área</p>`:''}</div>`)
  }
  box.innerHTML=total?`<p class="muted search-count">${total} ${total===1?'resultado':'resultados'}</p>`+groups.join(''):`<p class="muted">Nada encontrado para “${esc(q.trim())}”.</p>`
}

const CSV_LABELS={name:'Nome',role:'Cargo',department:'Setor',status:'Situação',salary:'Salário',admission:'Admissão',employeeName:'Servidor',date:'Data',reference:'Referência',value:'Valor (R$)',notes:'Observações',operator:'Registrado por',refunded:'Reembolsado',number:'Número',contractor:'Contratado',object:'Objeto',start:'Início',end:'Fim',type:'Tipo',category:'Categoria',description:'Descrição',carrierName:'Transportadora',producer:'Produtor',locality:'Localidade',machine:'Máquina',implements:'Implementos',hours:'Horas',title:'Título',item:'Item',sentBy:'Enviada por',confirmedBy:'Confirmada por',confirmedAt:'Confirmada em',plate:'Placa',model:'Modelo',odometer:'Quilometragem',truck:'Caminhão',driver:'Motorista',origin:'Origem',destination:'Destino',cargo:'Carga',startKm:'Km inicial',endKm:'Km final',location:'Local',phone:'Telefone',document:'Documento',email:'E-mail',createdAt:'Criado em',updatedBy:'Alterado por'};
const CSV_SKIP=/^(id|.*Id|photo|sourceSystem|governmentLevel|jurisdiction.*|parent.*|federat.*|active|updatedAt|password.*|secret.*|avatar.*|color|emoji)$/;
const CSV_NAMES={employees:'servidores',payments:'pagamentos',contracts:'contratos',finance:'lancamentos',machinery:'maquinas',implements:'implementos',appointments:'agendamentos',licitations:'licitacoes',trucks:'caminhoes',trips:'viagens',carriers:'transportadoras'};
function csvCollectionFor(pg,s){
  if(pg==='agri')return s==='machines'?'machinery':s==='implements'?'implements':'appointments';
  if(pg==='hr')return s==='payments'?'payments':'employees';
  if(pg==='fleet')return s==='trucks'||s==='truck'?'trucks':s==='carriers'?'carriers':'trips';
  return ({contracts:'contracts',finance:'finance',licit:'licitations'})[pg]||''
}
const csvCellP=v=>{if(typeof v==='number')return Number.isFinite(v)?v.toLocaleString('pt-BR',{useGrouping:false,maximumFractionDigits:2}):'';if(typeof v==='boolean')return v?'Sim':'Não';if(Array.isArray(v))v=v.map(x=>typeof x==='object'?(x?.name||''):x).filter(Boolean).join(', ');let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[";\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
function downloadCsv(col){
  const list=(db[col]||[]).filter(x=>x&&typeof x==='object');if(!list.length)return toast('Ainda não há registros para baixar.');
  // Colunas na ordem em que os campos aparecem no cadastro; "Criado em" por último.
  const keys=[];for(const x of list)for(const k of Object.keys(x))if(!CSV_SKIP.test(k)&&!keys.includes(k)&&(typeof x[k]!=='object'||Array.isArray(x[k])))keys.push(k);
  keys.sort((a,b)=>(a==='createdAt')-(b==='createdAt'));
  const csv='﻿'+[keys.map(k=>csvCellP(CSV_LABELS[k]||k)).join(';'),...list.map(x=>keys.map(k=>csvCellP(k==='createdAt'&&x[k]?new Date(x[k]).toLocaleString('pt-BR'):x[k])).join(';'))].join('\r\n');
  const city=searchNorm(cityName()).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`${CSV_NAMES[col]||col}-${city||'prefeitura'}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  toast('Planilha baixada.')
}

function updateOfflineBar(){
  let bar=document.getElementById('offlineBar');const off=navigator.onLine===false;
  if(!off){if(bar){bar.classList.add('out');setTimeout(()=>bar?.remove(),250)}return}
  if(bar)return;bar=document.createElement('div');bar.id='offlineBar';bar.className='offline-bar';bar.setAttribute('role','status');
  bar.innerHTML='<b>📡 Sem internet</b> <span>· o que você salvar fica neste aparelho e sobe quando a conexão voltar.</span>';document.body.appendChild(bar)
}
window.addEventListener('offline',updateOfflineBar);
window.addEventListener('online',()=>{const was=!!document.getElementById('offlineBar');updateOfflineBar();if(was)toast('Conexão de volta. Sincronizando…')});
setTimeout(updateOfflineBar,0);

document.addEventListener('focusin',e=>{

    setTimeout(()=>syncChatViewportHeight(),80);

  }

    setTimeout(()=>e.target.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'}),180);
  }
});
