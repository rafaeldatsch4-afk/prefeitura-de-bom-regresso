<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0B2E59" />
<title>Prefeitura de Bom Regresso — Sistema Municipal</title>
<!-- Brasão oficial usado no sistema: Bom Regresso -->
<style>
:root{
  --navy:#0B2E59;--navy2:#123F73;--navy3:#1A528D;--gold:#D7A93E;--gold2:#F3D98F;
  --bg:#EEF3F7;--card:#fff;--text:#26323D;--muted:#687987;--border:#D9E2EA;
  --ok:#287A58;--warn:#AD7620;--danger:#A84545;--info:#2D6FA8;--shadow:0 10px 30px rgba(11,46,89,.08)
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.center{display:grid;place-items:center;min-height:100vh;padding:22px}
.login-card{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:26px;text-align:center}
.logo{width:240px;max-height:200px;object-fit:contain}.login-card h1{font-size:24px;color:var(--navy);margin:8px 0 4px}.login-card p{color:var(--muted);margin:0 0 22px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.btn-primary{background:var(--gold);color:var(--navy)}.btn-primary:hover{background:var(--gold2)}
.btn-secondary{background:#E7EDF3;color:var(--navy)}.btn-danger{background:#F8E7E7;color:var(--danger)}.btn-ok{background:#E8F5EE;color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;margin:10px 0}.field label{font-size:12px;font-weight:800;color:var(--navy)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(26,82,141,.1)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.sep{height:1px;background:var(--border);margin:14px 0}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:14px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{text-align:center;padding:4px 8px 12px}.brand img{width:180px;max-height:150px;object-fit:contain}.brand small{display:block;color:var(--gold2);font-weight:800;letter-spacing:.06em}
.operator-chip{display:flex;gap:10px;align-items:center;background:var(--navy2);border-radius:14px;padding:10px;margin:8px 2px 14px}.avatar{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900}.operator-chip small{color:var(--gold2);font-weight:800}.operator-chip strong{display:block}
.nav{display:flex;flex-direction:column;gap:3px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#fff;border-radius:11px;padding:12px 12px;font-weight:800}.nav button:hover,.nav button.active{background:var(--navy2)}
.sidebar-footer{margin-top:22px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}.content-wrap{min-width:0}.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.topbar strong{color:var(--navy)}.content{padding:24px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.page-head h2{margin:0;color:var(--navy);font-size:28px}.page-head p{margin:4px 0 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(11,46,89,.04)}.card .label{font-size:11px;color:var(--muted);font-weight:900}.card .value{font-size:28px;color:var(--navy);font-weight:900;margin:4px 0}.card .mini{font-size:12px;color:var(--muted)}.accent{height:5px;border-radius:14px 14px 0 0;margin:-16px -16px 13px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px}.panel h3{margin:0 0 4px;color:var(--navy)}.panel .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--border);background:#fff;color:var(--navy);padding:9px 12px;border-radius:10px;font-weight:800}.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}.table th,.table td{padding:11px 10px;border-bottom:1px solid #EDF1F4;text-align:left;font-size:13px}.table th{background:#E8EEF3;color:var(--navy);font-size:12px;position:sticky;top:0}.table tr:last-child td{border-bottom:0}.status{font-weight:800}.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-bad{color:var(--danger)}.s-info{color:var(--info)}.s-muted{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid .wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.listbox{border:1px solid var(--border);border-radius:10px;min-height:90px;padding:8px;background:#FAFCFE}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border-radius:999px;background:#EDF3F8;margin:4px 4px 0 0;font-size:12px}.pill button{border:0;background:transparent;color:var(--danger);font-weight:900;padding:0}.note{white-space:pre-wrap;background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:14px;min-height:290px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.muted{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(7,25,45,.55);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h3{margin:0;color:var(--navy)}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:40;font-weight:700}
.topbar-city{display:none}.mobile-nav{display:none}.mobile-more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mobile-more-grid .btn{min-height:58px;text-align:left;padding:12px}.small-actions{display:flex;gap:6px;flex-wrap:wrap}.small-actions .btn{padding:7px 9px;font-size:12px}.kpi-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEF2F5}.kpi-line:last-child{border-bottom:0}.kpi-line b{color:var(--navy)}
@media (max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.shell{grid-template-columns:220px 1fr}.sidebar{padding-left:8px;padding-right:8px}}
@media (max-width:760px){
  body{background:#F3F6FA;overscroll-behavior-y:auto}
  .shell{display:block}.sidebar{display:none}
  .topbar{height:58px;padding:8px 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(11,46,89,.06)}
  .topbar strong{display:block;line-height:1.05;letter-spacing:.04em}.topbar-city{display:block;font-size:13px}.topbar-system{display:none}
  .topbar .muted{margin-left:auto;background:#EAF5EF;color:var(--ok);padding:7px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
  .content{padding:14px 10px calc(92px + env(safe-area-inset-bottom));max-width:none}
  .page-head{display:block;margin-bottom:14px}.page-head h2{font-size:22px;line-height:1.12}.page-head p{font-size:13px;line-height:1.4;margin-top:5px}.page-head>.pill{margin-top:9px;font-size:11px;padding:6px 9px}
  .cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px;border-radius:15px;box-shadow:0 4px 14px rgba(11,46,89,.05)}.card .accent{margin:-13px -13px 11px;height:4px}.card .label{font-size:10px}.card .value{font-size:25px;margin:4px 0 2px}.card .mini{font-size:11px;line-height:1.25}
  .cards .card:nth-child(n+5){grid-column:1/-1}
  .grid2{gap:10px;margin-top:10px}.panel{padding:14px;border-radius:15px}.panel h3{font-size:18px}.panel .sub{font-size:11px;line-height:1.35}
  .form-grid{grid-template-columns:1fr;gap:7px}.form-grid .wide{grid-column:auto}.field{margin:7px 0}.field input,.field select,.field textarea{min-height:44px;padding:10px 11px;border-radius:10px}.field textarea{min-height:92px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 7px;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;white-space:nowrap;padding:9px 11px}
  .actions{gap:7px}.actions .btn{min-height:42px}.row.stack-mobile{flex-direction:column;align-items:stretch}
  .table-wrap{border-radius:11px;-webkit-overflow-scrolling:touch}.table{min-width:620px}.table th,.table td{padding:10px 9px;font-size:12px}
  .login-card{padding:20px;border-radius:22px}.logo{width:190px}
  .modal-backdrop{padding:10px;align-items:end}.modal{width:100%;max-height:88vh;border-radius:20px 20px 14px 14px;padding:16px}.mobile-more-grid{grid-template-columns:1fr 1fr}
  .mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(14px);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(11,46,89,.08);z-index:10;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
  .mobile-nav button{border:0;background:transparent;color:#667684;font-size:9.5px;font-weight:800;padding:5px 2px;border-radius:12px;min-width:0}
  .mobile-nav button span{display:grid;place-items:center;width:34px;height:28px;margin:0 auto 2px;font-size:18px;border-radius:12px}
  .mobile-nav button.active{color:var(--navy)}.mobile-nav button.active span{background:#E8F0F8;color:var(--navy)}
}
@media (max-width:360px){.cards{grid-template-columns:1fr}.cards .card:nth-child(n+5){grid-column:auto}.mobile-more-grid{grid-template-columns:1fr}}

/* Mobile UI v4 — otimizada para celular */
@media (max-width:760px){
  :root{--mobile-pad:12px}
  html,body{width:100%;overflow-x:hidden}
  body{
    background:
      radial-gradient(circle at 100% 0,rgba(215,169,62,.10),transparent 28%),
      linear-gradient(180deg,#F4F7FB 0,#EEF3F8 100%);
  }

  .topbar{
    min-height:68px;
    padding:9px var(--mobile-pad);
    background:linear-gradient(135deg,#0B2E59 0%,#123F73 100%);
    border-bottom:3px solid var(--gold);
    box-shadow:0 6px 20px rgba(11,46,89,.16);
    color:#fff;
  }
  .topbar strong{
    display:flex;
    flex-direction:column;
    gap:2px;
    max-width:58%;
    color:#fff;
  }
  .topbar-city{
    display:block!important;
    font-size:15px;
    font-weight:900;
    letter-spacing:.06em;
    line-height:1.05;
  }
  .topbar-system{
    display:block!important;
    font-size:9px;
    font-weight:700;
    letter-spacing:.08em;
    opacity:.78;
    line-height:1.1;
  }
  .topbar .muted{
    margin-left:auto;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    padding:7px 9px;
    border-radius:999px;
    font-size:10px;
    font-weight:800;
    line-height:1.15;
    box-shadow:none;
  }

  .content{
    padding:16px var(--mobile-pad) calc(94px + env(safe-area-inset-bottom));
  }
  .page-head{
    margin:2px 0 15px;
  }
  .page-head h2{
    font-size:24px;
    font-weight:900;
    letter-spacing:-.02em;
    color:var(--navy);
  }
  .page-head p{
    color:#6D7B88;
    font-size:12.5px;
  }
  .page-head>.pill{
    display:inline-flex;
    margin-top:9px;
    background:#E8EEF5;
    color:var(--navy);
    border:1px solid #D6E0E9;
    font-size:10.5px;
    font-weight:800;
    padding:6px 9px;
    border-radius:999px;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }
  .card{
    position:relative;
    overflow:hidden;
    min-height:112px;
    padding:15px 14px;
    border:1px solid rgba(11,46,89,.08);
    border-radius:18px;
    background:rgba(255,255,255,.96);
    box-shadow:0 7px 20px rgba(11,46,89,.07);
  }
  .card .accent{
    height:5px;
    margin:-15px -14px 12px;
    border-radius:0;
  }
  .card .label{
    font-size:9.5px;
    letter-spacing:.055em;
    color:#758492;
  }
  .card .value{
    font-size:30px;
    line-height:1;
    margin:8px 0 5px;
    letter-spacing:-.03em;
  }
  .card .mini{
    font-size:11px;
    line-height:1.25;
    color:#758492;
  }
  .cards .card:nth-child(5){
    min-height:96px;
    grid-column:1/-1;
  }

  .home-grid{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-top:11px;
  }
  .home-finance-panel{order:-1}
  .panel{
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(11,46,89,.08);
    box-shadow:0 6px 20px rgba(11,46,89,.055);
    background:rgba(255,255,255,.97);
  }
  .panel h3{
    font-size:18px;
    font-weight:900;
    letter-spacing:-.015em;
  }
  .panel .sub{color:#778592}

  .home-finance-panel .kpi-line{
    min-height:42px;
    align-items:center;
    padding:9px 2px;
  }
  .home-finance-panel .kpi-line b{
    font-size:14px;
  }
  .home-finance-panel .small-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }
  .home-finance-panel .small-actions .btn{
    min-height:42px;
    font-size:11px;
    text-align:center;
    padding:8px 6px;
    background:#EDF2F7;
  }

  /* Atividades recentes viram cartões em vez de tabela horizontal. */
  .home-recent{
    border:0;
    overflow:visible;
    background:transparent;
  }
  .home-recent .table{
    display:block;
    min-width:0;
    background:transparent;
  }
  .home-recent thead{display:none}
  .home-recent tbody{display:flex;flex-direction:column;gap:8px}
  .home-recent tr{
    display:grid;
    grid-template-columns:1fr auto;
    gap:3px 10px;
    padding:11px 12px;
    border:1px solid #E4EAF0;
    border-radius:13px;
    background:#FAFCFE;
  }
  .home-recent td{
    display:block;
    border:0;
    padding:0;
    white-space:normal;
    font-size:11px;
  }
  .home-recent td:nth-child(1){
    grid-column:1;
    grid-row:1;
    color:var(--navy);
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .home-recent td:nth-child(2){
    grid-column:1/-1;
    grid-row:2;
    font-size:12px;
    color:var(--text);
    font-weight:700;
  }
  .home-recent td:nth-child(3){
    grid-column:2;
    grid-row:1;
    color:var(--muted);
    text-align:right;
    font-size:10px;
  }
  .home-recent td:nth-child(4){
    grid-column:1/-1;
    grid-row:3;
    font-size:10.5px;
    margin-top:2px;
  }
  .home-recent td.empty{
    grid-column:1/-1;
    padding:14px 4px;
    text-align:center;
    font-size:12px;
    font-weight:500;
  }

  .tabs{
    margin:0 -2px 10px;
    padding:2px 2px 7px;
    scroll-snap-type:x proximity;
  }
  .tabs button{
    scroll-snap-align:start;
    min-height:40px;
    border-radius:12px;
    font-size:11.5px;
    box-shadow:0 2px 8px rgba(11,46,89,.035);
  }

  .table-wrap:not(.home-recent){
    box-shadow:inset -14px 0 18px -18px rgba(11,46,89,.35);
  }

  .mobile-nav{
    min-height:72px;
    gap:2px;
    padding:5px 6px calc(7px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97);
    border-top:1px solid rgba(11,46,89,.08);
    box-shadow:0 -10px 30px rgba(11,46,89,.12);
  }
  .mobile-nav button{
    position:relative;
    min-height:56px;
    color:#778592;
    font-size:9px;
    transition:background .15s ease,color .15s ease,transform .15s ease;
  }
  .mobile-nav button:active{transform:scale(.96)}
  .mobile-nav button span{
    width:38px;
    height:29px;
    font-size:19px;
    margin:0 auto 3px;
  }
  .mobile-nav button.active{
    background:transparent;
    color:var(--navy);
  }
  .mobile-nav button.active span{
    background:#E6EEF7;
    box-shadow:inset 0 0 0 1px rgba(11,46,89,.05);
  }
  .mobile-nav button.active:after{
    content:"";
    position:absolute;
    left:50%;
    bottom:1px;
    width:18px;
    height:3px;
    transform:translateX(-50%);
    border-radius:999px;
    background:var(--gold);
  }

  .modal{
    border-radius:24px 24px 14px 14px;
    box-shadow:0 -18px 50px rgba(7,25,45,.22);
  }
  .mobile-more-grid .btn{
    border:1px solid #E2E9F0;
    background:#F7F9FC;
    border-radius:14px;
  }
}

@media (max-width:390px){
  :root{--mobile-pad:10px}
  .topbar-city{font-size:14px}
  .topbar-system{font-size:8.5px}
  .topbar .muted{font-size:9.5px;padding:6px 7px}
  .page-head h2{font-size:22px}
  .card{padding:13px;min-height:105px}
  .card .accent{margin:-13px -13px 10px}
  .card .value{font-size:27px}
  .panel{padding:13px}
}


/* Configurações, temas e instalação PWA */
.topbar-settings{
  border:1px solid var(--border);background:#fff;color:var(--navy);width:38px;height:38px;
  border-radius:12px;font-size:18px;display:grid;place-items:center;padding:0;margin-left:auto
}
.topbar-settings:hover{background:#F3F6F9}
.settings-section h4{margin:0 0 10px;color:var(--navy);font-size:15px}
.theme-preset-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.theme-preset{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.theme-preset b{font-size:10px}.theme-swatch{display:flex;width:42px;height:22px;border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.theme-swatch i{display:block;flex:1}.field input[type="color"]{padding:4px;height:46px}
html[data-appearance="dark"]{
  --bg:#10161D;--card:#17212B;--text:#EDF3F7;--muted:#9AA9B5;--border:#2C3A46;
  --shadow:0 10px 30px rgba(0,0,0,.24)
}
html[data-appearance="dark"] body{background:#10161D;color:var(--text)}
html[data-appearance="dark"] .content-wrap,
html[data-appearance="dark"] .content{background:#10161D}
html[data-appearance="dark"] .card,
html[data-appearance="dark"] .panel,
html[data-appearance="dark"] .login-card,
html[data-appearance="dark"] .modal,
html[data-appearance="dark"] .table,
html[data-appearance="dark"] .tabs button,
html[data-appearance="dark"] .listbox{background:#17212B;color:var(--text);border-color:var(--border)}
html[data-appearance="dark"] .field input,
html[data-appearance="dark"] .field select,
html[data-appearance="dark"] .field textarea{background:#101820;color:var(--text);border-color:#344552}
html[data-appearance="dark"] .table th{background:#22303C;color:#DCE8F1}
html[data-appearance="dark"] .table td{border-color:#253440}
html[data-appearance="dark"] .btn-secondary{background:#24333F;color:#DDE9F2}
html[data-appearance="dark"] .topbar:not(:has(.topbar-city)){background:#17212B}
html[data-appearance="dark"] .topbar-settings{background:#24333F;color:#fff;border-color:#364755}
html[data-appearance="dark"] .mobile-nav{background:rgba(23,33,43,.98);border-color:#2C3A46}
html[data-appearance="dark"] .mobile-nav button{color:#A6B5C0}
html[data-appearance="dark"] .mobile-nav button.active{color:#fff}
html[data-appearance="dark"] .mobile-nav button.active span{background:#2A3C4C}
html[data-appearance="dark"] .home-recent tr{background:#131C24;border-color:#2C3A46}
html[data-appearance="dark"] .kpi-line{border-color:#293844}
html[data-appearance="dark"] .sep{background:#2C3A46}

/* Mobile stability v5 — rolagem, proporção e formulário da Agricultura */
@media (max-width:760px){
  html{
    width:100%;
    min-height:100%;
    height:auto;
    overflow-x:hidden!important;
    overflow-y:auto!important;
    -webkit-text-size-adjust:100%;
    scroll-behavior:auto;
  }
  body{
    width:100%;
    min-height:100dvh;
    height:auto!important;
    overflow-x:hidden!important;
    overflow-y:auto!important;
    overscroll-behavior-y:auto!important;
    touch-action:pan-y pinch-zoom;
    position:static!important;
  }
  #main,.app,.shell,.content-wrap,.content{
    height:auto!important;
    max-height:none!important;
    overflow:visible!important;
  }
  .shell{min-height:100dvh}
  .content-wrap{
    width:100%;
    min-width:0;
  }
  .content{
    width:100%;
    min-width:0;
    max-width:100%;
    padding-left:10px;
    padding-right:10px;
    padding-bottom:calc(104px + env(safe-area-inset-bottom));
  }
  .topbar{
    width:100%;
    max-width:100vw;
  }
  .tabs{
    max-width:calc(100vw - 20px);
    overscroll-behavior-x:contain;
    touch-action:auto;
  }
  .tabs button,
  .btn,
  input,
  select,
  textarea{
    touch-action:manipulation;
  }
  input,select,textarea{
    max-width:100%;
    width:100%;
    min-width:0;
    font-size:16px!important;
  }
  select{
    appearance:auto;
    -webkit-appearance:menulist;
  }
  .field{
    min-width:0;
    scroll-margin-top:90px;
    scroll-margin-bottom:150px;
  }
  .agri-form-panel{
    width:100%;
    max-width:100%;
    overflow:visible;
    padding:14px;
  }
  .agri-form-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:6px;
    width:100%;
  }
  .agri-form-grid>.field,
  .agri-form-grid>.wide{
    width:100%;
    min-width:0;
  }
  .agri-implement-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 48px;
    gap:8px;
    align-items:stretch;
    width:100%;
  }
  .agri-add-imp{
    width:48px;
    min-width:48px;
    min-height:48px;
    padding:0;
    font-size:22px;
  }
  .agri-form-panel .listbox{
    width:100%;
    min-height:62px;
    overflow:visible;
  }
  .agri-save-actions{
    margin-top:14px;
    width:100%;
  }
  .agri-save-actions .btn{
    width:100%;
    min-height:50px;
    font-size:14px;
  }
  .mobile-nav{
    width:100%;
    max-width:100vw;
  }
}
@media (max-width:390px){
  .content{
    padding-left:8px;
    padding-right:8px;
  }
  .agri-form-panel{
    padding:12px;
    border-radius:16px;
  }
  .page-head h2{font-size:21px}
  .tabs{max-width:calc(100vw - 16px)}
}


/* Exportação de notas */
.note-export-actions{

}
.note-export-actions .btn{min-height:44px}

}


/* Navegação interna / botão Voltar */
.topbar-back{
  display:none;
  border:1px solid var(--border);
  background:#fff;
  color:var(--navy);
  width:38px;
  height:38px;
  border-radius:12px;
  padding:0;
  font-size:24px;
  line-height:1;
  font-weight:800;

  flex:0 0 38px;
}

    display:grid;
    width:36px;
    height:36px;

  }

    height:34px;

    max-width:82px;
    font-size:9px;

html[data-appearance="dark"] .topbar-back{

  border-color:#364755;
}
@media (max-width:760px){

    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.18);
  }
}


/* Transportadoras */

/* Fluxo rápido de notas: texto primeiro, PDF sob demanda */
.notes-flow{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.28fr);gap:14px;align-items:start}

}


/* Perfil do operador, foto e emoji */
.operator-chip-button{width:calc(100% - 4px);border:0;color:#fff;text-align:left;cursor:pointer;font:inherit;position:relative}
.operator-chip-button:hover{background:rgba(255,255,255,.13)}
.operator-chip-text{min-width:0;flex:1}
.operator-chip-text strong,.operator-chip-text small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.operator-chip-arrow{font-size:24px;opacity:.72;margin-left:auto}
.profile-avatar{flex:0 0 auto;display:grid;place-items:center;overflow:hidden;background:var(--gold);color:var(--navy);font-weight:900;border-radius:14px}
.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-avatar-md{width:42px;height:42px;font-size:16px}
.profile-avatar-sm{width:32px;height:32px;border-radius:10px;font-size:12px}
.profile-avatar-top{width:32px;height:32px;border-radius:10px;font-size:12px}
.profile-avatar-menu{width:26px;height:26px;border-radius:8px;font-size:11px;display:inline-grid;margin-right:6px;vertical-align:middle}
.profile-avatar-xl{width:76px;height:76px;border-radius:22px;font-size:28px}
.profile-avatar-xxl{width:96px;height:96px;border-radius:28px;font-size:34px;box-shadow:0 8px 24px rgba(11,46,89,.14)}
.topbar-profile{border:1px solid var(--border);background:#fff;width:38px;height:38px;padding:2px;border-radius:12px;display:grid;place-items:center;cursor:pointer;margin-left:auto}
.topbar-profile .profile-avatar-top{width:30px;height:30px}
.topbar-profile:hover{background:#F3F6F9}
.profile-sheet{display:flex;flex-direction:column;gap:14px}
.profile-hero{display:flex;align-items:center;gap:16px;padding:4px 0 2px}
.profile-hero h2{margin:0 0 4px;font-size:24px;color:var(--navy)}
.profile-role{font-weight:900;color:var(--text)}
.profile-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.profile-stat{padding:13px;border:1px solid var(--border);border-radius:14px;background:#F8FAFC}
.profile-stat small{display:block;color:var(--muted);font-weight:800;margin-bottom:6px}
.profile-stat strong{font-size:20px;color:var(--navy)}
.profile-payment-panel{box-shadow:none;padding:13px}
.profile-payment-list{display:flex;flex-direction:column}
.profile-payment-list>div{display:flex;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.profile-payment-list>div:last-child{border-bottom:0}
.profile-payment-list b{text-align:right}
.profile-row-person{display:flex;align-items:center;gap:8px}
.avatar-editor{margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:14px;background:#F8FAFC}
.avatar-editor-top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.avatar-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.avatar-upload-label{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.emoji-picker-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.emoji-choice{width:42px;height:42px;border:1px solid var(--border);border-radius:11px;background:#fff;font-size:22px;cursor:pointer}
.emoji-choice:hover{background:#F0F4F8}
.emoji-custom{width:82px!important;min-height:42px!important;text-align:center;font-size:19px!important}
.avatar-crop-area{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.avatar-crop-frame{width:min(320px,100%);aspect-ratio:1;margin:0 auto 10px;border-radius:22px;overflow:hidden;border:3px solid var(--gold);background:#E8EEF4;touch-action:none}
.avatar-crop-frame canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.avatar-crop-frame canvas:active{cursor:grabbing}
.avatar-profile-button{border:0;background:transparent;padding:0;display:grid;justify-items:center;gap:4px;cursor:pointer;color:var(--navy);font-weight:800}.avatar-profile-button small{font-size:11px}
.avatar-preview-picker{display:grid;justify-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:800;color:var(--navy)}
.avatar-preview-picker .profile-avatar-xl{outline:2px solid var(--gold);outline-offset:3px}
.avatar-upload-label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
html[data-appearance="dark"] .profile-stat,html[data-appearance="dark"] .avatar-editor{background:#131C24}
html[data-appearance="dark"] .profile-hero h2,html[data-appearance="dark"] .profile-stat strong{color:#F2F6FA}
html[data-appearance="dark"] .emoji-choice{background:#1A2731;color:#fff}
html[data-appearance="dark"] .topbar-profile{background:#24333F;border-color:#364755}
@media (max-width:760px){
  .topbar-profile{margin-left:auto;flex:0 0 36px;width:36px;height:36px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16)}
  .topbar-profile .profile-avatar-top{width:30px;height:30px}
  .topbar-settings{margin-left:0}
  .topbar .muted{display:none}
  .profile-hero{align-items:flex-start}
  .profile-avatar-xxl{width:82px;height:82px;border-radius:24px}
  .profile-stats{grid-template-columns:1fr 1fr}
  .profile-payment-list>div{flex-direction:column;gap:3px}
}
@media (max-width:390px){
  .topbar-profile{width:34px;height:34px;flex-basis:34px}
  .topbar-profile .profile-avatar-top{width:28px;height:28px}
  .profile-stats{grid-template-columns:1fr}
  .avatar-choice-grid{grid-template-columns:1fr}
}


/* Usuários cadastrados — consulta de perfis */
.users-toolbar{align-items:center}
.users-search{
  width:min(320px,100%);min-height:42px;padding:9px 12px;border:1px solid var(--border);
  border-radius:12px;background:var(--card);color:var(--text);font:inherit
}
.users-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:14px}
.user-card{
  border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:16px;
  padding:14px;text-align:left;cursor:pointer;box-shadow:0 4px 14px rgba(11,46,89,.04);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease
}
.user-card:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(11,46,89,.10);border-color:#C7D5E0}
.user-card-top{display:flex;align-items:center;gap:11px}
.profile-avatar-user-card{width:54px;height:54px;border-radius:16px;font-size:19px}
.user-card-main{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.user-card-main strong{font-size:15px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card-main span{font-size:12px;font-weight:800}
.user-card-main small{font-size:10.5px;color:var(--muted)}
.user-card-arrow{font-size:24px;color:var(--muted)}
.user-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.user-card-stats>span{padding:9px;background:#F7F9FB;border-radius:11px}
.user-card-stats small{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.user-card-stats b{display:block;margin-top:3px;font-size:13px;color:var(--navy)}
.user-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:10.5px;color:var(--muted)}
.profile-viewonly-badge{

  font-size:10.5px;font-weight:900
}
.public-profile-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.public-profile-info>div{padding:11px;border:1px solid var(--border);border-radius:12px;background:#F8FAFC}
.public-profile-info small{display:block;color:var(--muted);font-size:9.5px;font-weight:800;text-transform:uppercase;margin-bottom:4px}
.public-profile-info b{font-size:12px}
html[data-appearance="dark"] .user-card-stats>span,
html[data-appearance="dark"] .public-profile-info>div{background:#131C24}
html[data-appearance="dark"] .user-card-main strong,
html[data-appearance="dark"] .user-card-stats b{color:#F2F6FA}
html[data-appearance="dark"] .profile-viewonly-badge{background:#24333F;color:#C6D3DD}
@media (max-width:1050px){.users-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .users-toolbar{align-items:stretch}
  .users-search{width:100%}
  .users-grid{grid-template-columns:1fr;gap:9px}
  .user-card{padding:13px}
  .profile-avatar-user-card{width:50px;height:50px}

  .public-profile-info{grid-template-columns:1fr}
}

/* Histórico de atividades e versão 1.0 */
.sidebar-version{font-size:10px;color:rgba(255,255,255,.64);text-align:center;margin:0 0 9px;font-weight:800;letter-spacing:.04em}
.settings-version-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;margin-bottom:14px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.settings-version-card small{display:block;font-size:9px;opacity:.7;font-weight:900;letter-spacing:.08em}
.settings-version-card strong{display:block;margin-top:3px;font-size:16px}
.settings-version-card>span{background:rgba(255,255,255,.14);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}
.activity-toolbar{display:grid;grid-template-columns:1fr 220px;gap:8px}
.activity-toolbar input,.activity-toolbar select{min-height:42px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);padding:9px 11px;font:inherit}
.activity-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.activity-item{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.activity-item.is-undone{opacity:.72;border-style:dashed}

async function migrateLegacyCarriers(items){

    const missing=items.filter(x=>x?.id&&!known.has(x.id));
    if(missing.length)await Promise.all(missing.map(x=>carrierCollection.doc(x.id).set(x,{merge:true})));

  return{accepted:jurisdiction===MUNICIPALITY_ID,level:'municipal',access:'municipal',municipalityId:jurisdiction}

async function acceptFederatedProfile(profile){

  const allowed=level==='national'

      ?['Governador','Vice-governador']
      :['Prefeito','Vice-prefeito','Assistente universal','Secretário da Agricultura','Motorista','Servidor / Outro'];
  if(!allowed.includes(profile.role))return{ok:false,reason:'Cargo incompatível com este nível de governo.'};

  const sourceSystem=profile.sourceSystem||'pais-bom-regresso';
  const SYNC_FIELDS=[['name','nome'],['role','cargo'],['sector','setor'],['avatarImage','foto'],['avatarEmoji','emoji'],['avatarColor','cor'],['jurisdictionId','território'],['active','ativação']];

  if(!o)o=(db.operators||[]).find(x=>x.id===profile.id&&x.sourceSystem===sourceSystem);

  if(!o){
    if(level==='municipal'&&roleIsOccupied(profile.role,''))return{ok:false,reason:`O cargo ${profile.role} já está ocupado no sistema municipal.`};
    o={id:profile.id||uid(),federatedProfileId:profile.id||'',sourceSystem,name:profile.name||'Perfil integrado',role:profile.role,sector:profile.sector||roleDepartment(profile.role),avatarImage:profile.photo||profile.avatarImage||'',avatarEmoji:profile.emoji||profile.avatarEmoji||'',avatarColor:validAvatarColor(profile.color),active:true,createdAt:nowISO(),governmentLevel:level,jurisdictionId:level==='municipal'?MUNICIPALITY_ID:(profile.jurisdictionId||''),parentJurisdictionId:profile.parentJurisdictionId||''};
    db.operators.push(o);created=true
  }else{
    if(level==='municipal'&&roleIsOccupied(profile.role,o.id))return{ok:false,reason:`O cargo ${profile.role} já está ocupado por outro perfil municipal.`};
    const oldName=o.name,before=SYNC_FIELDS.map(([k])=>JSON.stringify(o[k]??''));
    o.name=profile.name||o.name;o.role=profile.role;o.sector=profile.sector||o.sector||roleDepartment(profile.role);if('photo' in profile||'avatarImage' in profile)o.avatarImage=profile.photo||profile.avatarImage||'';if('emoji' in profile||'avatarEmoji' in profile)o.avatarEmoji=profile.emoji||profile.avatarEmoji||'';if('color' in profile)o.avatarColor=validAvatarColor(profile.color);o.federatedProfileId=profile.id||o.federatedProfileId||'';o.sourceSystem=sourceSystem;o.governmentLevel=level;o.jurisdictionId=level==='municipal'?MUNICIPALITY_ID:(profile.jurisdictionId||o.jurisdictionId||'');o.parentJurisdictionId=profile.parentJurisdictionId||o.parentJurisdictionId||'';o.active=true;changed=SYNC_FIELDS.filter(([k],n)=>JSON.stringify(o[k]??'')!==before[n]).map(([,label])=>label);if(changed.length)o.updatedAt=nowISO();
    if(level==='municipal')syncOperatorEmployee(o,oldName)
  }
  if(level==='municipal')syncOperatorEmployee(o);
  // Abrir a Prefeitura pela República acontece toda hora: só registra a primeira entrada ou o que mudou de fato.
  if(created)recordActivity('users','Integração',`${o.name} entrou pela primeira vez a partir da República Bom Regressense (${o.role}).`);
  else if(changed.length)recordActivity('users','Integração',`${o.name} foi atualizado a partir da República Bom Regressense: ${changed.join(', ')}.`);
  // A entrada é feita pela própria pessoa, não pelo "Sistema" (o operador atual ainda não foi trocado aqui).
  if((created||changed.length)&&db.activityLog?.[0]){db.activityLog[0].actor=o.name;db.activityLog[0].actorId=o.id;db.activityLog[0].role=o.role||''}

function installFederationDiscoveryListener(){
  window.addEventListener('message',async event=>{
    const msg=event.data;
    if(!msg||msg.protocol!==FEDERATION_PROTOCOL)return;
    // Só a República deste mesmo site (a janela que abriu o sistema) pode conversar com ele.
    if(event.origin!==location.origin||event.source!==window.parent)return;
    if(msg.type==='DISCOVER_MUNICIPAL_SYSTEM'){
      try{
        event.source?.postMessage({
          protocol:FEDERATION_PROTOCOL,type:'MUNICIPAL_SYSTEM_DESCRIPTOR',requestId:msg.requestId||'',
          payload:municipalIntegrationDescriptor()
        },event.origin)
      }catch(err){console.error('Handshake de integração:',err)}
      return
    }
    if(msg.type==='HANDOFF_PROFILE'){
      if(msg.payload?.city)applyCityInfo(msg.payload.city);
      let result;
      try{
        if(cloudInitialization)await cloudInitialization;
        if(CHAT_ONLY&&!cloudReady){
          result={ok:false,reason:'O Firebase não conectou. Reabra o chat quando a conexão voltar.'};
        }else{
          result=await acceptFederatedProfile(msg.payload||{});
        }
      }
      catch(err){console.error('Handoff de perfil:',err);result={ok:false,reason:'Falha ao integrar o perfil municipal.'}}
      try{
        event.source?.postMessage({
          protocol:FEDERATION_PROTOCOL,type:'HANDOFF_RESULT',requestId:msg.requestId||'',payload:result
        },event.origin)
      }catch(err){console.error('Resposta do handoff:',err)}
    }
  })
}

function chatTime(iso){
  if(!iso)return '';
  const d=new Date(iso);if(Number.isNaN(d.getTime()))return '';
  const today=new Date(),same=today.toDateString()===d.toDateString();
  return same?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
}
function chatFileSize(n){
  n=Number(n||0);if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(n<10240?1:0)+' KB';return (n/1024/1024).toFixed(1)+' MB'
}
function chatAttachmentMeta(a){
  if(!a)return null;
  return {kind:a.kind||'file',name:String(a.name||'Anexo').slice(0,120),type:String(a.type||'application/octet-stream').slice(0,120),size:Number(a.size||0),duration:Number(a.duration||0)||0}
}
async function storeChatMedia(a,owner){
  if(!a?.dataUrl||!chatMediaCollection)return {attachment:a,mediaId:''};
  const ref=chatMediaCollection.doc(),meta=chatAttachmentMeta(a);
  await ref.set({...meta,dataUrl:a.dataUrl,ownerId:owner?.id||'',ownerName:owner?.name||'',createdAt:nowISO()});
  return {attachment:{...meta,mediaId:ref.id},mediaId:ref.id}
}
async function getChatMedia(mediaId){
  if(!mediaId)return null;
  if(chatMediaCache.has(mediaId))return chatMediaCache.get(mediaId);
  if(!chatMediaCollection)return null;
  const snap=await chatMediaCollection.doc(mediaId).get();
  const data=snap.exists?Object.assign({id:snap.id},snap.data()):null;
  if(data)chatMediaCache.set(mediaId,data);
  return data
}
async function resolveChatAttachment(a){
  if(!a)return null;
  if(a.dataUrl)return a;
  if(!a.mediaId)return a;
  const media=await getChatMedia(a.mediaId);
  return media?Object.assign({},a,media):a
}
function hydrateChatMedia(){
  chatMediaObserver?.disconnect?.();
  const nodes=[...document.querySelectorAll('[data-chat-media-id]')];
  if(!nodes.length)return;
  const load=async el=>{
    if(el.dataset.loaded==='1')return;
    el.dataset.loaded='1';
    try{
      const media=await getChatMedia(el.dataset.chatMediaId);
      if(!media?.dataUrl){el.innerHTML='<div class="chat-media-error">⚠ Imagem indisponível</div>';return}
      el.innerHTML=`<img src="${esc(media.dataUrl)}" alt="${esc(media.name||'Imagem')}" loading="lazy">`
    }catch{el.innerHTML='<div class="chat-media-error">⚠ Falha ao carregar imagem</div>'}
  };
  if('IntersectionObserver' in window){
    chatMediaObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){chatMediaObserver.unobserve(e.target);load(e.target)}}),{root:document.getElementById('chatMessages'),rootMargin:'180px'});
    nodes.forEach(n=>chatMediaObserver.observe(n))
  }else nodes.forEach(load)
}
async function loadChatAudio(id){
  const m=chatMessages.find(x=>x.id===id),host=document.getElementById('chatAudio_'+id);if(!m?.attachment||!host)return;
  host.innerHTML='<span>☁ Carregando áudio…</span>';
  try{
    const a=await resolveChatAttachment(m.attachment);
    if(!a?.dataUrl){host.innerHTML='<span>⚠ Áudio indisponível</span>';return}
    host.innerHTML=`<audio controls autoplay preload="metadata" src="${esc(a.dataUrl)}"></audio>`
  }catch{host.innerHTML='<span>⚠ Falha ao carregar áudio</span>'}
}

function chatLastReadStorageKey(){return CHAT_LAST_READ_PREFIX+(db.currentOperatorId||'guest')}

function recalculateChatUnread(){

  if(page==='chat'&&document.visibilityState==='visible'){markChatRead();return}

function getChatNotifySettings(){
  try{return Object.assign({enabled:true,sound:true,vibrate:true,preview:true},JSON.parse(localStorage.getItem(CHAT_NOTIFY_SETTINGS_KEY)||'{}'))}
  catch{return{enabled:true,sound:true,vibrate:true,preview:true}}
}
async function setChatNotifySetting(key,value){
  const s=getChatNotifySettings();s[key]=!!value;localStorage.setItem(CHAT_NOTIFY_SETTINGS_KEY,JSON.stringify(s));
  if(key==='enabled'&&!value){await unregisterChatPushDevice();return}
  if(s.enabled&&typeof Notification!=='undefined'&&Notification.permission==='granted'){
    if(pushTokensCollection&&db.currentOperatorId){
      try{
        await pushTokensCollection.doc(pushDeviceId()).set({
          operatorId:db.currentOperatorId,operatorName:db.currentOperator,notificationsEnabled:true,
          previewEnabled:s.preview!==false,soundEnabled:s.sound!==false,vibrateEnabled:s.vibrate!==false,
          updatedAt:nowISO(),appVersion:APP_VERSION
        },{merge:true})
      }catch{}
    }
    ensurePushRegistration(false)
  }
}
async function unregisterChatPushDevice(){
  try{
    if(pushTokensCollection)await pushTokensCollection.doc(pushDeviceId()).delete();
    if(messaging?.deleteToken)await messaging.deleteToken().catch(()=>{});
  }catch(err){console.warn('Remover push:',err)}
  lastPushOperatorId=''
}
// ---- Sons do chat: um único AudioContext, liberado no primeiro toque (o navegador bloqueia som antes disso)
let chatAudioCtx=null;
function chatAudio(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!chatAudioCtx)try{chatAudioCtx=new C()}catch{return null}if(chatAudioCtx.state==='suspended')chatAudioCtx.resume().catch(()=>{});return chatAudioCtx}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{const c=chatAudio();if(c&&c.state==='suspended')c.resume().catch(()=>{})},{passive:true}));
// receive: "pop" suave · send: "fiu" curto subindo · notify: dois toques (mensagem chegando em outra tela)
const CHAT_SOUNDS={receive:[[880,1180,0,.11,.09]],send:[[420,980,0,.12,.05]],notify:[[740,740,0,.12,.1],[988,988,.13,.16,.1]]};
function playChatSound(kind='notify'){
  try{const ctx=chatAudio();if(!ctx||ctx.state!=='running')return;const t0=ctx.currentTime+.01;
    for(const [f1,f2,at,dur,vol] of CHAT_SOUNDS[kind]||CHAT_SOUNDS.notify){const o=ctx.createOscillator(),g=ctx.createGain(),t=t0+at;
      o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur*.7);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}
  }catch{}
}
function playChatTone(kind='notify'){if(!getChatNotifySettings().sound)return;playChatSound(kind)}
function vibrateChat(){
  const s=getChatNotifySettings();if(s.vibrate&&navigator.vibrate)try{navigator.vibrate([70,45,70])}catch{}
}
function notificationPermissionLabel(){
  if(typeof Notification==='undefined')return'Não suportado';
  if(Notification.permission==='granted')return'Permitido';
  if(Notification.permission==='denied')return'Bloqueado pelo navegador';
  return'Aguardando autorização'
}
async function testChatNotification(){
  const s=getChatNotifySettings();
  if(!s.enabled)return toast('Ative as notificações do chat primeiro.');
  if(typeof Notification==='undefined')return toast('Notificações não são suportadas neste aparelho.');
  if(Notification.permission!=='granted'){
    const ok=await ensurePushRegistration(true);if(!ok)return
  }
  playChatTone();vibrateChat();
  try{
    const reg=await navigator.serviceWorker?.ready;
    if(reg)await reg.showNotification('💬 Chat da República',{body:'Notificação de teste funcionando.',icon:'/app-icon.svg',badge:'/app-icon.svg',tag:'bom-regresso-test',data:{type:'chat'}});
    else new Notification('💬 Chat da República',{body:'Notificação de teste funcionando.'});
    toast('Notificação de teste enviada.')
  }catch{toast('Não foi possível exibir a notificação de teste.')}
}

async function loadPushConfig(){
  if(!pushConfigDoc)return '';
  try{
    const s=await pushConfigDoc.get(),d=s.exists?s.data():{};
    pushVapidPublicKey=String(d?.vapidPublicKey||'').trim();
    return pushVapidPublicKey
  }catch(err){console.error('Config push:',err);return ''}
}
async function savePushConfig(){
  if(!requireFull())return;
  const key=val('pushVapidKey');
  if(!key||key.length<40)return toast('Cole a chave pública Web Push (VAPID) gerada no Firebase.');
  try{
    await pushConfigDoc.set({vapidPublicKey:key,updatedAt:nowISO(),updatedBy:db.currentOperator},{merge:true});
    pushVapidPublicKey=key;toast('Chave Web Push salva para todos os aparelhos.');
  }catch(err){console.error(err);toast('Não foi possível salvar a chave Web Push.')}
}
function pushDeviceId(){
  const k='bom_regresso_push_device_v2';let id=localStorage.getItem(k);
  if(!id){id=(crypto.randomUUID?.()||uid())+'_'+Math.random().toString(36).slice(2,8);localStorage.setItem(k,id)}
  return id
}
async function startPushInfrastructure(){
  if(!fbStore)return;
  pushTokensCollection=fbStore.collection('pushTokens_'+DATA_NAMESPACE);
  pushConfigDoc=fbStore.collection('municipio').doc('push_config_'+PUSH_CONFIG_NAMESPACE);
  await loadPushConfig();
  try{
    const r=await fetch('/api/push',{cache:'no-store'});
    const j=await r.json();
    pushBackendConfigured=!!j.configured
  }catch{pushBackendConfigured=false}
  try{
    messaging=firebase.messaging();
    messaging.onMessage(payload=>{
      const d=payload?.data||{};
      if(d.type==='chat'&&page==='chat'&&document.visibilityState==='visible')markChatRead()
    })
  }catch(err){console.warn('FCM não suportado:',err);messaging=null}
  startChatPresence();
  const prefs=getChatNotifySettings();
  if(prefs.enabled&&typeof Notification!=='undefined'&&Notification.permission==='granted'&&db.currentOperatorId)ensurePushRegistration(false)
}
async function ensurePushRegistration(askPermission=true){
  if(pushRegistering)return false;
  const prefs=getChatNotifySettings();if(!prefs.enabled&&!askPermission)return false;
  if(typeof Notification==='undefined')return askPermission&&toast('Este aparelho não oferece notificações push.'),false;
  pushRegistering=true;
  try{
    let permission=Notification.permission;
    if(permission==='default'&&askPermission)permission=await Notification.requestPermission();
    if(permission!=='granted'){
      if(askPermission)toast(permission==='denied'?'Notificações bloqueadas. Libere nas configurações do navegador/aplicativo.':'Notificações não foram autorizadas.');
      return false
    }
    if(!pushVapidPublicKey)await loadPushConfig();
    if(!messaging){try{messaging=firebase.messaging()}catch{return false}}
    const reg=await navigator.serviceWorker.ready;
    let token='';
    try{
      token=pushVapidPublicKey
        ?await messaging.getToken({vapidKey:pushVapidPublicKey,serviceWorkerRegistration:reg})
        :await messaging.getToken({serviceWorkerRegistration:reg})
    }catch(err){
      console.warn('FCM token:',err);
      if(askPermission)toast('Notificação local ativada. O push com o app fechado ainda depende da configuração FCM.');
      return true
    }
    if(!token)return true;
    const p=currentProfile();if(!p||!pushTokensCollection)return false;
    await pushTokensCollection.doc(pushDeviceId()).set({
      token,operatorId:p.id,operatorName:p.name,role:p.role||'Servidor / Outro',
      updatedAt:nowISO(),lastRegisteredAt:nowISO(),platform:navigator.platform||'',
      standalone:isStandalone(),notificationsEnabled:true,
      previewEnabled:prefs.preview!==false,soundEnabled:prefs.sound!==false,vibrateEnabled:prefs.vibrate!==false,
      appVersion:APP_VERSION
    },{merge:true});
    lastPushOperatorId=p.id;
    if(askPermission)toast(pushBackendConfigured?'🔔 Notificações completas ativadas.':'🔔 Notificações ativadas neste aparelho.');
    return true
  }catch(err){
    console.error('Registrar push:',err);
    if(askPermission)toast(Notification.permission==='granted'?'Notificação local ativada; o push com app fechado ainda não respondeu.':'Não foi possível ativar as notificações.');
    return Notification.permission==='granted'
  }finally{pushRegistering=false}
}
async function sendChatPush(msg){
  if(!pushBackendConfigured||!pushTokensCollection||!fbAuth?.currentUser)return;
  try{
    const snap=await pushTokensCollection.get();
    const recipients=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x?.token&&x.notificationsEnabled!==false&&x.operatorId!==msg.senderId);
    if(!recipients.length)return;
    const idToken=await fbAuth.currentUser.getIdToken();
    const attachmentLabel=msg.attachment?.kind==='image'?'📷 Imagem':msg.attachment?.kind==='audio'?'🎙️ Mensagem de voz':msg.attachment?'📎 Arquivo':'';
    const fullBody=(msg.text||attachmentLabel||'Nova mensagem').slice(0,180);
    const groups=new Map();
    for(const r of recipients.slice(0,50)){
      const preview=r.previewEnabled!==false,sound=r.soundEnabled!==false,vibrate=r.vibrateEnabled!==false;
      const key=[preview?'1':'0',sound?'1':'0',vibrate?'1':'0'].join('');
      if(!groups.has(key))groups.set(key,{tokens:[],preview,sound,vibrate});
      groups.get(key).tokens.push(r.token)
    }
    for(const g of groups.values()){
      const body=g.preview?fullBody:'Nova mensagem no Chat da República';
      const r=await fetch('/api/push',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+idToken},body:JSON.stringify({
        tokens:g.tokens,title:'💬 '+msg.senderName,body,
        data:{type:'chat',messageId:msg.id||'',senderId:msg.senderId||'',sound:g.sound?'1':'0',vibrate:g.vibrate?'1':'0',preview:g.preview?'1':'0'}
      })});
      if(!r.ok){const t=await r.text().catch(()=>String(r.status));console.warn('Push não enviado:',r.status,t)}
    }
  }catch(err){console.warn('Push do chat:',err)}
}

function noteChatTyping(list){
  const now=Date.now();
  for(const p of list||[]){
    if(!p.operatorId)continue;
    const key=p.typing?String(p.typingAt||p.lastSeen||''):'';
    if(!key){chatTypingSeen.delete(p.operatorId);continue}
    const prev=chatTypingSeen.get(p.operatorId);if(prev&&prev.key===key)continue;
    // Um "digitando" antigo visto pela primeira vez (aba fechada no meio) não conta.
    if(!prev&&!(Math.abs(now-new Date(key).getTime())<30000))continue;
    chatTypingSeen.set(p.operatorId,{key,at:now})
  }
}

// Posição do cursor dentro da caixa (cópia invisível com o mesmo texto e a mesma fonte).
function chatCaretPoint(el){
  const cs=getComputedStyle(el),mirror=document.createElement('div');
  for(const k of ['boxSizing','width','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','borderStyle','fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight','textTransform','wordSpacing','textIndent','tabSize'])mirror.style[k]=cs[k];
  Object.assign(mirror.style,{position:'absolute',visibility:'hidden',top:'0',left:'-9999px',whiteSpace:'pre-wrap',overflowWrap:'break-word',overflow:'hidden'});
  const pos=el.selectionEnd??el.value.length;mirror.textContent=el.value.slice(0,pos);
  const mark=document.createElement('span');mark.textContent='​';mirror.appendChild(mark);document.body.appendChild(mirror);
  const r=el.getBoundingClientRect(),pt={x:r.left+mark.offsetLeft-el.scrollLeft,y:r.top+mark.offsetTop-el.scrollTop,h:mark.offsetHeight,cs};
  mirror.remove();return pt
}
// A letra digitada dá um pulinho na caixa de mensagem.
function chatLetterHop(el,ev){
  if(!el||!ev||!ev.data||!/^insert(Text|CompositionText|ReplacementText)$/.test(ev.inputType||''))return;
  // Teclado do Android manda a palavra inteira a cada letra: só pula quando ela cresce (apagar não pula).
  if(ev.inputType==='insertCompositionText'){
    if(!el._hopBound){el._hopBound=true;el.addEventListener('compositionend',()=>{el._compLen=0})}
    const grew=ev.data.length>(el._compLen||0);el._compLen=ev.data.length;if(!grew)return
  }
  if(chatReduceMotion()||typeof document.body.animate!=='function')return;
  const ch=Array.from(ev.data).pop();if(!ch||!ch.trim())return;
  if(document.querySelectorAll('.chat-hop').length>14)return;
  const pt=chatCaretPoint(el),r=el.getBoundingClientRect();
  if(pt.y<r.top-2||pt.y>r.bottom)return; // cursor fora da parte visível
  const hop=document.createElement('span');hop.className='chat-hop';hop.textContent=ch;
  Object.assign(hop.style,{left:pt.x+'px',top:(pt.y+(pt.h-parseFloat(pt.cs.fontSize))/2)+'px',fontSize:pt.cs.fontSize,fontFamily:pt.cs.fontFamily,color:pt.cs.color});
  document.body.appendChild(hop);
  const tilt=(Math.random()*16-8).toFixed(1);

function bindChatTouchGuard(){
  const shell=document.querySelector('.chat-shell');if(!shell||shell.dataset.touchGuard==='1')return;
  shell.dataset.touchGuard='1';
  let sx=0,sy=0,pid=null,moved=false,suppressUntil=0,lastTarget=null,lastAt=0;
  shell.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch')return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;moved=false
  },{passive:true});
  shell.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch'||e.pointerId!==pid)return;
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>11)moved=true
  },{passive:true});
  shell.addEventListener('pointerup',e=>{
    if(e.pointerType!=='touch'||e.pointerId!==pid)return;
    if(moved)suppressUntil=performance.now()+320;
    pid=null
  },{passive:true});
  shell.addEventListener('pointercancel',()=>{pid=null;moved=false},{passive:true});
  shell.addEventListener('click',e=>{
    const action=e.target.closest('button,a,.chat-image-wrap,.chat-file-card');
    if(!action)return;
    const now=performance.now();
    if(now<suppressUntil){
      e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();return
    }
    if(lastTarget===action&&now-lastAt<260){
      e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();return
    }
    lastTarget=action;lastAt=now
  },true)
}

function blobToDataURL(blob){

async function compressChatImage(file){
  const raw=await fileToDataURL(file);
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=raw});
  const max=1100,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
  let q=.82,data=canvas.toDataURL('image/jpeg',q);
  while(data.length>480000&&q>.46){q-=.08;data=canvas.toDataURL('image/jpeg',q)}
  if(data.length>520000)throw new Error('Imagem ainda muito grande');
  return {kind:'image',name:(file.name||'imagem').replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:Math.round(data.length*.75),dataUrl:data}
}

const RIPPLE_TARGETS='.btn,.nav button,.mobile-nav button,.sidebar button,.tabs button,.chat-send-btn,.operator-chip-button,.topbar-profile';
// ---- Efeitos: ondinha ao tocar (só com movimento permitido)
const fxMotionOK=()=>!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('pointerdown',e=>{
  if(!fxMotionOK()||e.button>0)return;
  const host=e.target.closest?.(RIPPLE_TARGETS);if(!host||host.disabled)return;

  const r=host.getBoundingClientRect(),size=Math.max(r.width,r.height)*2.2,wrap=document.createElement('span'),dot=document.createElement('span');

// ---- Fluidez: a "pílula" do item ativo desliza de um botão do menu para o outro.
const GLIDE_NAVS=['.sidebar .nav','.mobile-nav'];
const glideBg=el=>{const c=getComputedStyle(el).backgroundColor;return c&&c!=='transparent'&&!/rgba\(.*,\s*0\)$/.test(c)};
const glideTarget=a=>glideBg(a)?a:[...a.children].find(glideBg)||null;
function fxNavSnapshot(){
  return GLIDE_NAVS.map(sel=>{
    const nav=document.querySelector(sel),a=nav?.querySelector(':scope>button.active');if(!a||!a.getClientRects().length)return null;
    const t=glideTarget(a);return {sel,sig:[...nav.children].map(b=>b.textContent).join('|'),idx:[...nav.children].indexOf(a),rect:(t||a).getBoundingClientRect()}
  }).filter(Boolean)
}
function fxNavGlide(snap){
  let dir='';
  for(const s of snap||[]){
    const nav=document.querySelector(s.sel),a=nav?.querySelector(':scope>button.active');if(!a||!a.getClientRects().length)continue;
    const kids=[...nav.children],idx=kids.indexOf(a);
    if(kids.map(b=>b.textContent).join('|')!==s.sig||idx===s.idx)continue;
    dir=dir||(idx>s.idx?'fwd':'back');
    if(!fxMotionOK()||typeof document.body.animate!=='function')continue;
    const t=glideTarget(a);if(!t)continue;
    const cs=getComputedStyle(t),g=document.createElement('span');g.className='ui-glider';g.setAttribute('aria-hidden','true');
    Object.assign(g.style,{background:cs.backgroundColor,borderRadius:cs.borderRadius,boxShadow:cs.boxShadow==='none'?'':cs.boxShadow});
    if(getComputedStyle(nav).position==='static')nav.style.position='relative';
    nav.classList.add('ui-glide-host');t.classList.add('ui-glide-hide');nav.prepend(g);
    requestAnimationFrame(()=>{
      if(!g.isConnected)return;
      const nr=nav.getBoundingClientRect(),r=t.getBoundingClientRect(),box=x=>({left:(x.left-nr.left-nav.clientLeft+nav.scrollLeft)+'px',top:(x.top-nr.top-nav.clientTop+nav.scrollTop)+'px',width:x.width+'px',height:x.height+'px'});
      const from=box(s.rect.width?s.rect:r),to=box(r);Object.assign(g.style,to);
      const done=()=>{g.remove();t.classList.remove('ui-glide-hide');if(!nav.querySelector('.ui-glider'))nav.classList.remove('ui-glide-host')};
      const anim=g.animate([from,to],{duration:380,easing:'cubic-bezier(.3,1.25,.5,1)'});anim.onfinish=done;anim.oncancel=done;
      const icon=a.querySelector('span');icon?.animate?.([{transform:'none'},{transform:'translateY(-3px) scale(1.18)'},{transform:'none'}],{duration:420,easing:'ease-out',delay:120})
    })
  }

}

// ---- Chat: arrastar a mensagem para a direita responde (igual WhatsApp).
function bindChatSwipeReply(){
  const root=document.getElementById('chatMessages');if(!root||root._swipeBound)return;root._swipeBound=true;
  let st=null;
  const parts=row=>[...row.children].filter(c=>!c.classList.contains('chat-swipe-icon'));
  const finish=(reply)=>{
    if(!st)return;const {row,icon,dx,id}=st;st=null;
    parts(row).forEach(el=>{
      if(dx&&typeof el.animate==='function')el.animate([{transform:`translateX(${dx}px)`},{transform:'translateX(-4px)',offset:.7},{transform:'none'}],{duration:260,easing:'ease-out'});
      el.style.transform=''
    });
    if(icon){icon.animate?.([{opacity:Math.min(1,dx/56),transform:'scale(1)'},{opacity:0,transform:'scale(.5)'}],{duration:180});setTimeout(()=>{icon.remove();row.classList.remove('chat-swiping')},180)}
    if(reply)replyChatMessage(id)
  };
  root.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'||chatReduceMotion())return;
    const row=e.target.closest('.chat-row[data-chat-id]');if(!row||e.target.closest('audio,input,textarea'))return;
    st={id:row.dataset.chatId,row,x:e.clientX,y:e.clientY,pid:e.pointerId,mode:'',dx:0,armed:false,icon:null}
  },{passive:true});
  root.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.pid)return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.mode){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      if(!(dx>0&&Math.abs(dx)>Math.abs(dy)*1.4)){st=null;return}
      st.mode='swipe';const row=st.row,first=parts(row)[0];
      row.classList.add('chat-swiping');const icon=document.createElement('span');icon.className='chat-swipe-icon';icon.textContent='↩';icon.setAttribute('aria-hidden','true');
      icon.style.left=Math.max(2,(first?first.getBoundingClientRect().left-row.getBoundingClientRect().left:0)-34)+'px';
      row.appendChild(icon);st.icon=icon
    }
    const d=Math.max(0,dx),pull=d<64?d:64+(d-64)*.25;st.dx=pull;
    parts(st.row).forEach(el=>{el.style.transform=`translateX(${pull}px)`});
    const k=Math.min(1,pull/56);st.icon.style.opacity=k;st.icon.style.transform=`scale(${.5+.5*k})`;
    const armed=pull>=56;if(armed&&!st.armed)try{navigator.vibrate?.(12)}catch{}
    st.armed=armed;st.icon.classList.toggle('armed',armed)
  },{passive:true});
  root.addEventListener('pointerup',e=>{if(st&&e.pointerId===st.pid)finish(st.mode==='swipe'&&st.armed);else if(st)st=null},{passive:true});
  root.addEventListener('pointercancel',()=>finish(false),{passive:true})
}
const TILT_TARGETS='.card';
// Cartões inclinam de leve seguindo o mouse, com um reflexo de luz (só com mouse e movimento permitido).
(()=>{
  const SEL=TILT_TARGETS;let cur=null;
  const ok=()=>fxMotionOK()&&!!window.matchMedia?.('(hover:hover) and (pointer:fine)').matches;
  const reset=el=>{if(!el)return;el.style.transform='';el.classList.remove('ui-tilt')};
  document.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse'||!ok())return;
    const el=e.target.closest?.(SEL);if(cur&&cur!==el)reset(cur);cur=el;if(!el)return;
    if(getComputedStyle(el).position==='static')el.style.position='relative';
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(800px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translateY(-2px)`;
    el.style.setProperty('--gx',((x+.5)*100).toFixed(1)+'%');el.style.setProperty('--gy',((y+.5)*100).toFixed(1)+'%');el.classList.add('ui-tilt')
  },{passive:true});
  document.addEventListener('pointerleave',()=>{reset(cur);cur=null},true);
  document.addEventListener('pointerdown',()=>{reset(cur);cur=null},{passive:true});
})();

function refreshNoteTargets(){
  const t=val('noteType');let arr=[];
  if(t==='trip')arr=db.trips.map(x=>[x.id,`${x.date} • ${x.origin||'-'} → ${x.destination||'-'}`]);
  if(t==='appointment')arr=db.appointments.map(x=>[x.id,`${x.date} • ${x.producer}`]);
  if(t==='licitation')arr=db.licitations.map(x=>[x.id,`${x.date} • ${x.title}`]);
  if(t==='payment')arr=db.payments.map(x=>[x.id,`${x.date} • ${x.employeeName} • ${money(x.value)}`]);
  if(t==='refund')arr=db.payments.filter(x=>x.refunded).map(x=>[x.id,`${x.refundedDate||x.date} • ${x.employeeName} • ${money(x.value)}`]);
  if(t==='contract')arr=db.contracts.map(x=>[x.id,`${x.number} • ${x.contractor}`]);
  if(t==='truck')arr=db.trucks.map(x=>[x.id,`${x.plate} • ${x.model||'-'}`]);
  document.getElementById('noteTarget').innerHTML=arr.length?arr.map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join(''):'<option value="">Não se aplica / sem registros</option>'
}
function noteHeader(title){

}
function generateNote(type,id=''){if(!type)type=val('noteType');if(!id)id=val('noteTarget');let s='';if(type==='general'){const rev=db.finance.filter(x=>x.type==='Receita'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0),exp=db.finance.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0);s=noteHeader('Resumo Geral')+`Operador: ${db.currentOperator}\nData: ${todayBR()}\n\nServidores: ${db.employees.length}\nAgendamentos: ${db.appointments.length}\nLicitações: ${db.licitations.length}\nContratos: ${db.contracts.length}\nCaminhões: ${db.trucks.length}\nViagens: ${db.trips.length}\n\nReceitas pagas: ${money(rev)}\nDespesas pagas: ${money(exp)}\nSaldo: ${money(rev-exp)}`}
else if(type==='finance'){const rev=db.finance.filter(x=>x.type==='Receita'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0),exp=db.finance.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,b)=>a+Number(b.value||0),0);s=noteHeader('Resumo de Saldo')+`Data: ${todayBR()}\nOperador: ${db.currentOperator}\n\nReceitas: ${money(rev)}\nDespesas: ${money(exp)}\nSaldo: ${money(rev-exp)}\n\nLançamentos registrados: ${db.finance.length}`}
else if(type==='trip'){const x=db.trips.find(r=>r.id===id);if(x)s=noteHeader('Nota de Viagem')+`Data: ${x.date}\nTransportadora: ${carrierName(x.carrierId,x.carrierName)||'-'}\nCaminhão: ${x.truck||'-'}\nMotorista: ${x.driver||'-'}\nOrigem: ${x.origin||'-'}\nDestino: ${x.destination||'-'}\nCarga / motivo: ${x.cargo||'-'}\nKM inicial: ${x.startKm||0}\nKM final: ${x.endKm||0}\nStatus: ${x.status}\nOperador: ${x.operator}\nObservações: ${x.notes||'-'}`}
else if(type==='appointment'){const x=db.appointments.find(r=>r.id===id);if(x)s=noteHeader('Ordem / Resumo da Agricultura')+`Produtor: ${x.producer}\nLocalidade: ${x.locality||'-'}\nData: ${x.date}\nMáquina: ${x.machine||'-'}\nImplementos: ${(x.implements||[]).join(', ')||'-'}\nHoras: ${x.hours||0}\nStatus: ${x.status}\nOperador: ${x.operator}\nObservações: ${x.notes||'-'}`}
else if(type==='licitation'){const x=db.licitations.find(r=>r.id===id);if(x)s=noteHeader('Nota de Licitação')+`Título: ${x.title}\nData de envio: ${x.date}\nObjeto / itens: ${x.item||'-'}\nStatus: ${x.status}\nEnviado por: ${x.sentBy}\nConfirmado por: ${x.confirmedBy||'-'}\nObservações: ${x.notes||'-'}`}
else if(type==='payment'){const x=db.payments.find(r=>r.id===id);if(x)s=noteHeader('Pagamento de Servidor')+`Servidor: ${x.employeeName}\nFunção: ${x.role||'-'}\nSetor: ${x.department||'-'}\nData do pagamento: ${x.date}\nReferência: ${x.reference||'-'}\nValor pago: ${money(x.value)}\nStatus: ${x.refunded?'Reembolsado':'Pago'}\nRegistrado por: ${x.operator}\n${x.refunded?`Reembolsado em: ${x.refundedDate||'-'}\nReembolsado por: ${x.refundedBy||'-'}\n`:''}Observações: ${x.notes||'-'}\n\n${'-'.repeat(58)}\nDocumento fictício para uso no sistema de ${cityName()}.`}
else if(type==='refund'){const x=db.payments.find(r=>r.id===id);if(x&&x.refunded)s=noteHeader('Reembolso de Pagamento')+`Servidor: ${x.employeeName}\nFunção: ${x.role||'-'}\nData do pagamento original: ${x.date}\nReferência: ${x.reference||'-'}\nValor reembolsado: ${money(x.value)}\nReembolsado em: ${x.refundedDate||'-'}\nReembolsado por: ${x.refundedBy||'-'}\nStatus: Reembolsado\n\n${'-'.repeat(58)}\nDocumento fictício para uso no sistema de ${cityName()}.`}
else if(type==='contract'){const x=db.contracts.find(r=>r.id===id);if(x)s=noteHeader('Resumo de Contrato')+`Número: ${x.number}\nContratado: ${x.contractor}\nObjeto: ${x.object||'-'}\nInício: ${x.start||'-'}\nFim: ${x.end||'-'}\nValor: ${money(x.value)}\nStatus: ${x.status}\nOperador: ${x.operator}\nObservações: ${x.notes||'-'}`}
else if(type==='truck'){const x=db.trucks.find(r=>r.id===id);if(x)s=noteHeader('Resumo de Caminhão')+`Identificação / placa: ${x.plate}\nModelo: ${x.model||'-'}\nTransportadora: ${carrierName(x.carrierId,x.carrierName)||'-'}\nStatus: ${x.status}\nQuilometragem: ${x.odometer||0}\nObservações: ${x.notes||'-'}`}
if(!s)s='Registro não encontrado.';return s}
function generateSelectedNote(){
  const box=document.getElementById('noteBox'),btn=document.getElementById('notePdfBtn'),badge=document.getElementById('noteReadyBadge');
  const text=generateNote();
  if(box){box.textContent=text;box.dataset.ready=text&&text!=='Registro não encontrado.'?'1':'0'}
  const ready=box?.dataset.ready==='1';
  if(btn)btn.disabled=!ready;
  if(badge){badge.textContent=ready?'Pronta':'Sem registro';badge.classList.toggle('is-ready',ready)}
  if(ready)box?.scrollIntoView({behavior:'smooth',block:'nearest'})
}
function noteFrom(type,id){
  if(!canPage('notes'))return accessDenied();
  page='notes';sub='';pushAppHistory('notes','');render();
  setTimeout(()=>{
    const typeEl=document.getElementById('noteType'),target=document.getElementById('noteTarget');
    if(!typeEl||!target)return;
    typeEl.value=type;refreshNoteTargets();target.value=id;generateSelectedNote()
  },0)
}
async function copyNote(){const s=currentNoteText();try{await navigator.clipboard.writeText(s);toast('Nota copiada.')}catch{toast('Não foi possível copiar automaticamente.')}}
function currentNoteText(){
  const box=document.getElementById('noteBox');
  const shown=(box?.textContent||'').trim();
  if(box?.dataset.ready==='1'&&shown)return shown;
  const generated=generateNote();
  if(box){
    box.textContent=generated;
    box.dataset.ready=generated&&generated!=='Registro não encontrado.'?'1':'0';
    const btn=document.getElementById('notePdfBtn');if(btn)btn.disabled=box.dataset.ready!=='1';
    const badge=document.getElementById('noteReadyBadge');if(badge){badge.textContent=box.dataset.ready==='1'?'Pronta':'Sem registro';badge.classList.toggle('is-ready',box.dataset.ready==='1')}
  }
  return generated;
}

function cleanPdfText(s){return String(s||'').replace(/\t/g,'    ').replace(/[═━]/g,'=')}
function noteTypeLabel(type){
  return ({general:'RESUMO GERAL',finance:'RESUMO DE SALDO',trip:'NOTA DE VIAGEM',appointment:'ORDEM DA AGRICULTURA',licitation:'NOTA DE LICITAÇÃO',payment:'COMPROVANTE DE PAGAMENTO',refund:'COMPROVANTE DE REEMBOLSO',contract:'RESUMO DE CONTRATO',truck:'FICHA DE CAMINHÃO'}[type]||'DOCUMENTO MUNICIPAL')
}
function noteDocumentNumber(){
  const type=val('noteType')||'general',target=val('noteTarget')||'';
  const prefixes={general:'GER',finance:'FIN',trip:'VIA',appointment:'AGR',licitation:'LIC',payment:'PAG',refund:'REE',contract:'CTR',truck:'CAM'};
  let datePart=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const sources={trip:db.trips,appointment:db.appointments,licitation:db.licitations,payment:db.payments,refund:db.payments,contract:db.contracts,truck:db.trucks};
  const row=(sources[type]||[]).find(x=>x.id===target);
  const rawDate=String(row?.date||row?.createdAt||'');
  const dm=rawDate.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  const iso=rawDate.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(dm)datePart=dm[3]+dm[2]+dm[1];else if(iso)datePart=iso[1]+iso[2]+iso[3];
  const clean=String(target||'').replace(/[^a-z0-9]/gi,'').toUpperCase();
  const suffix=clean?clean.slice(-4).padStart(4,'0'):'0001';
  return `${prefixes[type]||'DOC'}-${datePart}-${suffix}`
}
function parseNoteRows(text){
  const lines=cleanPdfText(text).split(/\r?\n/).map(x=>x.trim());
  const rows=[];
  for(const line of lines){
    if(!line||/^[-=]{5,}$/.test(line))continue;
    if(line.toUpperCase()===('PREFEITURA DE '+cityName()).toUpperCase()||line.toUpperCase()===('PREFEITURA MUNICIPAL DE '+cityName()).toUpperCase())continue;
    if(line.toUpperCase()===noteTypeLabel(val('noteType')))continue;
    const m=line.match(/^([^:]{1,42}):\s*(.*)$/);
    if(m)rows.push({label:m[1].trim(),value:m[2].trim()||'-'});
    else if(!/Documento fictício/i.test(line))rows.push({label:'',value:line});
  }
  return rows
}

function ensurePdfLib(){
  if(window.jspdf?.jsPDF)return Promise.resolve(window.jspdf);
  if(pdfLibPromise)return pdfLibPromise;
  pdfLibPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';s.integrity='sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/';s.crossOrigin='anonymous';
    s.async=true;
    s.onload=()=>window.jspdf?.jsPDF?resolve(window.jspdf):reject(new Error('Biblioteca de PDF indisponível.'));
    s.onerror=()=>reject(new Error('Não foi possível carregar a biblioteca de PDF.'));
    document.head.appendChild(s);
  }).catch(err=>{pdfLibPromise=null;throw err});
  return pdfLibPromise;
}
function buildNotePdfBlob(){
  if(!window.jspdf?.jsPDF)throw new Error('Biblioteca de PDF não carregou.');
  const text=currentNoteText(),{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  const pageW=210,pageH=297,left=15,right=15,usable=pageW-left-right;
  const navy=[11,46,89],navy2=[18,61,106],gold=[215,169,62],ink=[28,37,48],muted=[88,101,114],line=[211,220,229],soft=[247,249,251],white=[255,255,255];
  const title=noteTypeLabel(val('noteType')),docNo=noteDocumentNumber();
  const issued=new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
  const rows=parseNoteRows(text);
  let y=0;

  function logoData(){
    try{
      const img=document.querySelector('.brand img');
      if(!img||!img.complete||!img.naturalWidth)return '';
      const cv=document.createElement('canvas');cv.width=180;cv.height=180;
      const ctx=cv.getContext('2d');ctx.clearRect(0,0,180,180);ctx.drawImage(img,0,0,180,180);
      return cv.toDataURL('image/png')
    }catch{return ''}
  }
  const logo=logoData();

  function header(){
    doc.setFillColor(...navy);doc.rect(0,0,pageW,31,'F');
    if(logo){
      doc.setFillColor(...white);doc.roundedRect(left,5.3,20,20,3,3,'F');
      try{doc.addImage(logo,'PNG',left+2,7.3,16,16)}catch{}
    }
    const tx=logo?left+26:left;
    doc.setTextColor(...white);doc.setFont('helvetica','bold');doc.setFontSize(15.2);
    doc.text('PREFEITURA DE '+cityUpper(),tx,12.2);
    doc.setFont('helvetica','normal');doc.setFontSize(8.2);doc.setTextColor(224,232,240);
    doc.text('SISTEMA MUNICIPAL INTEGRADO',tx,18);
    doc.setFontSize(7.5);doc.text('DOCUMENTO ELETRÔNICO',tx,23);
    doc.setFillColor(...gold);doc.rect(0,31,pageW,1.5,'F')
  }
  function footer(){
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){
      doc.setPage(p);
      doc.setDrawColor(...line);doc.setLineWidth(.25);doc.line(left,pageH-17,pageW-right,pageH-17);
      doc.setFont('helvetica','normal');doc.setFontSize(7.4);doc.setTextColor(...muted);
      doc.text('Documento fictício • Sistema Municipal Integrado de '+cityName(),left,pageH-11);
      doc.text(`Página ${p} de ${pages}`,pageW-right,pageH-11,{align:'right'})
    }
  }
  function newPage(){
    doc.addPage();header();y=42;
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...muted);
    doc.text(title,left,y);doc.text(docNo,pageW-right,y,{align:'right'});y+=8
  }
  function ensureSpace(h){if(y+h>pageH-24)newPage()}
  function cleanNumber(label,value){
    const key=String(label||'').toLocaleLowerCase('pt-BR');
    const raw=String(value??'-').trim();
    if(/^km (inicial|final)$/i.test(label)&&/^-?\d+(?:[.,]\d+)?$/.test(raw))return raw.replace('.',',')+' km';
    if(key==='quilometragem'&&/^-?\d+(?:[.,]\d+)?$/.test(raw))return raw.replace('.',',')+' km';
    if(key==='horas'&&/^-?\d+(?:[.,]\d+)?$/.test(raw))return raw.replace('.',',')+' h';
    return raw||'-'
  }
  function drawStatus(value){
    const text=String(value||'-');
    doc.setFont('helvetica','bold');doc.setFontSize(9);
    const w=Math.min(58,Math.max(26,doc.getTextWidth(text)+10));
    doc.setFillColor(236,242,248);doc.roundedRect(pageW-right-w,y-1.5,w,8,4,4,'F');
    doc.setTextColor(...navy);doc.text(text,pageW-right-w/2,y+3.8,{align:'center'});
  }
  function drawRow(row,index){
    const label=String(row.label||''),value=cleanNumber(label,row.value);
    const key=label.toLocaleLowerCase('pt-BR');
    if(!label){
      const wrapped=doc.splitTextToSize(value,usable-10),h=Math.max(15,wrapped.length*5.1+8);
      ensureSpace(h+3);
      doc.setFillColor(...soft);doc.setDrawColor(...line);doc.roundedRect(left,y,usable,h,2,2,'FD');
      doc.setFont('helvetica','normal');doc.setFontSize(10.6);doc.setTextColor(...ink);doc.text(wrapped,left+5,y+8);
      y+=h+3;return
    }
    const longField=['observações','objeto / itens','resumo / itens','carga / motivo','objeto'].includes(key)||value.length>82;
    if(longField){
      doc.setFont('helvetica','normal');doc.setFontSize(10.8);
      const wrapped=doc.splitTextToSize(value,usable-10),h=Math.max(19,wrapped.length*5.2+13);
      ensureSpace(h+2);
      doc.setFillColor(...soft);doc.setDrawColor(...line);doc.roundedRect(left,y,usable,h,2,2,'FD');
      doc.setFont('helvetica','bold');doc.setFontSize(7.8);doc.setTextColor(...muted);doc.text(label.toUpperCase(),left+5,y+6.3);
      doc.setFont('helvetica','normal');doc.setFontSize(10.8);doc.setTextColor(...ink);doc.text(wrapped,left+5,y+12.4);
      y+=h+2;return
    }
    const labelW=48,valueW=usable-labelW-9;
    const wrapped=doc.splitTextToSize(value,valueW),h=Math.max(13,wrapped.length*5.1+7);
    ensureSpace(h+1.6);
    if(index%2===0){doc.setFillColor(...soft);doc.roundedRect(left,y,usable,h,1.5,1.5,'F')}
    doc.setDrawColor(...line);doc.setLineWidth(.25);doc.line(left,y+h,pageW-right,y+h);
    doc.setFont('helvetica','bold');doc.setFontSize(8.3);doc.setTextColor(...muted);doc.text(label.toUpperCase(),left+4,y+7.3);
    const moneyField=/valor|saldo|receita|despesa/i.test(label);
    doc.setFont('helvetica',moneyField?'bold':'normal');doc.setFontSize(moneyField?11.4:10.8);doc.setTextColor(...ink);
    doc.text(wrapped,left+labelW+4,y+7.3);y+=h+1.2
  }

  header();y=42;

  // Título e número, como uma nota/comprovante.
  doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(17);
  doc.text(title,left,y);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...muted);
  doc.text('Nº '+docNo,pageW-right,y,{align:'right'});
  y+=7.5;
  doc.setDrawColor(...gold);doc.setLineWidth(.9);doc.line(left,y,pageW-right,y);y+=7;

  const statusRow=rows.find(r=>String(r.label||'').toLocaleLowerCase('pt-BR')==='status');
  doc.setFillColor(...soft);doc.setDrawColor(...line);doc.roundedRect(left,y,usable,16,2,2,'FD');
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...muted);
  doc.text('EMISSÃO',left+5,y+5.5);
  doc.text('IDENTIFICAÇÃO',left+58,y+5.5);
  doc.setFontSize(10.2);doc.setTextColor(...ink);
  doc.text(issued,left+5,y+11.8);
  doc.text(docNo,left+58,y+11.8);
  if(statusRow){y+=4;drawStatus(statusRow.value);y-=4}
  y+=23;

  // Cabeçalho da área de dados.
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...navy);
  doc.text('DADOS DO DOCUMENTO',left,y);y+=4;
  doc.setDrawColor(...navy2);doc.setLineWidth(.35);doc.line(left,y,pageW-right,y);y+=4;

  let visibleIndex=0;
  for(const row of rows){
    if(String(row.label||'').toLocaleLowerCase('pt-BR')==='status')continue;
    drawRow(row,visibleIndex++)
  }

  y+=6;ensureSpace(24);
  doc.setFillColor(251,251,251);doc.setDrawColor(...line);doc.roundedRect(left,y,usable,20,2,2,'FD');
  doc.setFont('helvetica','bold');doc.setFontSize(8.2);doc.setTextColor(...navy);
  doc.text('REGISTRO DO SISTEMA',left+5,y+6.7);
  doc.setFont('helvetica','normal');doc.setFontSize(8.7);doc.setTextColor(...muted);
  doc.text('Gerado eletronicamente. Não necessita assinatura para uso interno fictício.',left+5,y+13);

  footer();
  return doc.output('blob')
}
function triggerBlobDownload(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
